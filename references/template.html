        window.saveMessage = function(idx, mi, newText) {
            if (!newText) {
                alert("A reply cannot be empty.");
                return;
            }
            const m = (comments[idx].messages || [])[mi];
            if (!m) return;
            m.text = newText;
            // Restamped like the head comment on edit: the turn now says this, as of now.
            m.timestamp = new Date().toISOString();
            editingMsg = null;
            markDirty();
            renderComments();
        };

        window.startReply = function(idx) {
            replyingIdx = idx;
            renderComments();
        };

        window.cancelReply = function() {
            replyingIdx = -1;
            renderComments();
        };

        // A reply is a human turn appended to the thread. It answers any question the agent left
        // there, which is the whole rule: there is no separate "answer" control, because a second
        // posting path would buy nothing over the reply the human is already writing.
        window.sendReply = function(idx, text) {
            if (!text) {
                cancelReply();
                return;
            }
            const c = comments[idx];
            c.messages = (c.messages || []).concat([{
                author: "human",
                text: text,
                timestamp: new Date().toISOString(),
            }]);
            replyingIdx = -1;
            markDirty();
            renderComments();
        };

        window.saveComment = function(idx, newText) {
            if (!newText) {
                alert("Comment text cannot be empty.");
                return;
            }
            comments[idx].text = newText;
            comments[idx].timestamp = new Date().toISOString();
            editingIdx = -1;
            renderComments();
            updateCommentIndicators();
        };

        window.cancelEdit = function() {
            editingIdx = -1;
            renderComments();
        };

        window.deleteComment = function(idx) {
            comments.splice(idx, 1);
            if (editingIdx === idx) {
                editingIdx = -1;
            } else if (editingIdx > idx) {
                // Adjust editing index if we deleted an item before the editing one
                editingIdx--;
            }
            if (replyingIdx === idx) {
                replyingIdx = -1;
            } else if (replyingIdx > idx) {
                replyingIdx--;
            }
            if (editingMsg) {
                if (editingMsg.idx === idx) editingMsg = null;
                else if (editingMsg.idx > idx) editingMsg.idx--;
            }
            renderComments();
            updateCommentIndicators();
        };

        document.getElementById("submitFeedbackBtn").addEventListener("click", () => {
            if (comments.length === 0) {
                alert("Please add at least one comment before submitting.");
                return;
            }

            // Submitting is what hands the round back to the agent, so it is the last moment at
            // which an unanswered question can still be answered cheaply.
            const waiting = comments.filter(pendingQuestion).length;
            if (waiting > 0) {
                const message = waiting === 1
                    ? "1 thread still has a question the agent is waiting on.\n\nSubmit without answering it?"
                    : waiting + " threads still have questions the agent is waiting on.\n\nSubmit without answering them?";
                if (!confirm(message)) return;
            }

            const btn = document.getElementById("submitFeedbackBtn");
            btn.disabled = true;
            // Start a fresh round: the previous agent summary is stale until the agent runs again.
            fetch("/api/feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ comments: comments, summary: "" })
            }).then(res => {
                if (res.ok) {
                    dirty = false;
                    summary = "";
                    renderSummary();
                    btn.disabled = false;
                    // The live activity panel (right above the button) is the reaction to Submit;
                    // the agent's own status updates then refine it.
                    renderAgentStatus({ kind: "status", state: "working", message: "送信しました。エージェントの応答を待っています…" });
                    // The server will push status updates and a reload as the agent works.
                } else {
                    alert("Error submitting feedback.");
                    btn.disabled = false;
                }
            }).catch(err => {
                alert("Error: " + err);
                btn.disabled = false;
            });
        });

        // End Review — stop the live session (separate from Submit).
        document.getElementById("endReviewBtn").addEventListener("click", () => {
            if (!confirm("End this review session? The review server will stop.")) return;
            const finish = () => {
                const status = document.getElementById("statusMsg");
                status.textContent = "Review ended. You can close this tab.";
                status.style.display = "block";
                setTimeout(() => window.close(), 1200);
            };
            fetch("/api/close", { method: "POST" }).then(finish).catch(finish);
        });

        // Live reload over SSE: the server pushes "reload" when the agent edits the
        // document or writes replies. Defer the reload if the user has unsent edits.
        function hasUnsentEdits() {
            return dirty || editingIdx !== -1 || replyingIdx !== -1 || editingMsg !== null || document.getElementById("composerInput").value.trim() !== "";
        }

        function connectLiveReload() {
            if (!isServed || typeof EventSource === "undefined") return;
            const dot = document.getElementById("liveDot");
            const es = new EventSource("/api/events");
            es.onopen = () => { if (dot) dot.classList.remove("offline"); };
            es.onerror = () => { if (dot) dot.classList.add("offline"); };
            es.onmessage = (e) => {
                let msg;
                try { msg = JSON.parse(e.data); } catch (_) { return; }
                if (msg.kind === "status") {
                    renderAgentStatus(msg);
                    return;
                }
                if (msg.kind === "reload") {
                    if (hasUnsentEdits()) {
                        pendingReload = true;
                        document.getElementById("reloadPrompt").style.display = "flex";
                    } else {
                        window.location.reload();
                    }
                }
            };
        }

        document.getElementById("reloadNowBtn").addEventListener("click", () => window.location.reload());

        let isProgrammaticScroll = false; // Flag to prevent scroll-spy hijacking during clicks
        let programmaticScrollTimeout = null;
        let activeScrollEndHandler = null;

        // Helper to clean up programmatic scroll state safely
        function clearProgrammaticScrollState() {
            if (programmaticScrollTimeout) {
                clearTimeout(programmaticScrollTimeout);
                programmaticScrollTimeout = null;
            }
            if (activeScrollEndHandler) {
                window.removeEventListener("scrollend", activeScrollEndHandler, true);
                activeScrollEndHandler = null;
            }
            isProgrammaticScroll = false;
        }

        // Marks for the file list. Glyphs rather than an icon font or SVG: they inherit the
        // monospace column and the text colour, so the list stays one typographic system and
        // the page keeps loading nothing it does not already load.
        const FILE_STATUS_MARK = {
            added: "+",
            deleted: "−",   // minus sign, not a hyphen: it pairs with + at the same weight
            renamed: "⇄",   // two arrows: it went from somewhere to somewhere
            modified: "·",
        };

        function appendFileStatusMark(link, heading) {
            const status = heading.getAttribute("data-status") || "modified";
            const mark = document.createElement("span");
            mark.className = "file-status file-status-" + status;
            mark.textContent = FILE_STATUS_MARK[status] || FILE_STATUS_MARK.modified;
            mark.setAttribute("aria-hidden", "true");
            // The words are still available, just not spent on the list's width.
            const note = heading.querySelector(".diff-file-note");
            mark.title = note ? note.textContent.trim() : status;
            link.appendChild(mark);
        }

        function initializeTableOfContents() {
            const tocContainer = document.getElementById("railToc");
            const documentColumn = document.querySelector(".document-column");
            if (!tocContainer || !documentColumn) return;

            tocContainer.innerHTML = "";

            // 1. Fetch all headings (h1, h2, h3)
            const headings = Array.from(documentColumn.querySelectorAll("h1, h2, h3"));
            
            // Pre-fill usedIds with all existing DOM IDs to prevent collisions
            const usedIds = new Set(Array.from(document.querySelectorAll("[id]")).map(el => el.id));

            function slugify(text) {
                const cleanText = text.replace(/\[.*?\]/g, "").trim();
                let slug = cleanText.toLowerCase()
                    .replace(/[^\w\s-]/g, "")
                    .replace(/\s+/g, "-")
                    .replace(/-+/g, "-");
                if (!slug) slug = "section";
                
                let uniqueSlug = slug;
                let counter = 1;
                while (usedIds.has(uniqueSlug)) {
                    uniqueSlug = `${slug}-${counter}`;
                    counter++;
                }
                usedIds.add(uniqueSlug);
                return uniqueSlug;
            }

            headings.forEach((heading, idx) => {
                // Ensure heading has ID for anchoring
                if (!heading.id) {
                    heading.id = slugify(visibleText(heading));
                } else {
                    usedIds.add(heading.id);
                }

                // Create TOC link
                const link = document.createElement("a");
                link.href = `#${heading.id}`;
                link.className = `rail-toc-item rail-toc-${heading.tagName.toLowerCase()}`;
                if (idx === 0) {
                    link.classList.add("active");
                }

                const filePath = heading.getAttribute("data-file");
                if (filePath) {
                    // A file list, not a table of contents: what happened to the file is a mark
                    // in front of its name, so the names line up in one column and the list can
                    // be scanned down instead of read. The words stay on the header itself,
                    // where there is room to say "renamed from …" in full.
                    link.classList.add("rail-toc-file");
                    appendFileStatusMark(link, heading);
                    const label = document.createElement("span");
                    label.className = "rail-toc-file-name";
                    label.textContent = filePath;
                    link.appendChild(label);
                } else {
                    // Clean heading text for display in TOC
                    const text = visibleText(heading).trim();
                    link.textContent = text;
                }

                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    clearProgrammaticScrollState();

                    isProgrammaticScroll = true;
                    heading.scrollIntoView({ behavior: "smooth", block: "start" });
                    history.pushState(null, null, `#${heading.id}`);
                    setActiveTOCItem(link);

                    activeScrollEndHandler = () => clearProgrammaticScrollState();
                    window.addEventListener("scrollend", activeScrollEndHandler, true);
                    programmaticScrollTimeout = setTimeout(clearProgrammaticScrollState, 1000);
                });

                tocContainer.appendChild(link);
            });

            function setActiveTOCItem(activeLink) {
                tocContainer.querySelectorAll(".rail-toc-item").forEach(item => {
                    item.classList.remove("active");
                });
                activeLink.classList.add("active");
            }

            // 2. Scroll-Spy implementation using IntersectionObserver
            const observerOptions = {
                root: null,
                rootMargin: "0px 0px -80% 0px",
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                if (isProgrammaticScroll) return; // Ignore observer events while scrolling from click

                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        const activeLink = tocContainer.querySelector(`a[href="#${id}"]`);
                        if (activeLink) {
                            setActiveTOCItem(activeLink);
                            activeLink.scrollIntoView({ behavior: "smooth", block: "nearest" });
                        }
                    }
                });
            }, observerOptions);

            headings.forEach(heading => observer.observe(heading));

            // Cache the first and last links to avoid DOM queries on scroll
            const firstLink = tocContainer.querySelector(".rail-toc-item");
            const lastLink = tocContainer.querySelector(".rail-toc-item:last-child");

            // Fallback for highlighting the first item near the top of the column, or the last
            // item at the bottom. Capture phase: scroll does not bubble, so a listener bound to
            // window would never see .document-column scrolling.
            window.addEventListener("scroll", () => {
                if (isProgrammaticScroll) return;

                const scroller = documentScroller();
                const offset = scrollOffset(scroller);
                const viewport = scroller === window ? window.innerHeight : scroller.clientHeight;
                const total = scroller === window ? document.documentElement.scrollHeight : scroller.scrollHeight;

                if (offset < 50) {
                    if (firstLink) {
                        setActiveTOCItem(firstLink);
                    }
                } else if (viewport + offset >= total - 10) {
                    if (lastLink) {
                        setActiveTOCItem(lastLink);
                    }
                }
            }, true);
        }

        // ---------- Resizable feedback panel ----------
        // The width lives in a CSS custom property, never in el.style.width: an inline style
        // outranks the width:100% the narrow-viewport media query applies to the stacked
        // layout, which would leave the page scrolling sideways on a small screen.
        (function initPanelResize() {
            const PANEL_WIDTH_KEY = "reviewer.feedbackPanelWidth";
            const MIN_WIDTH = 300;

            // The document column's floor comes from the stylesheet, so the drag can never
            // squeeze the column past the width CSS already refuses to go below.
            function documentMinWidth() {
                const declared = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--document-min-width"), 10);
                return Number.isFinite(declared) ? declared : 480;
            }

            // Whatever the rails already take is not the panel's to claim. Folding the
            // contents rail away therefore hands its width straight to the panel's ceiling.
            function railWidth() {
                const contentsRail = document.getElementById("contentsRail");
                if (!contentsRail || document.body.classList.contains("rail-collapsed")) return 0;
                return contentsRail.getBoundingClientRect().width;
            }

            const maxWidth = () => Math.max(MIN_WIDTH, window.innerWidth - railWidth() - documentMinWidth());

            function applyWidth(px) {
                document.documentElement.style.setProperty("--feedback-panel-width", px + "px");
            }

            function currentWidth() {
                const set = parseInt(document.documentElement.style.getPropertyValue("--feedback-panel-width"), 10);
                return Number.isFinite(set) ? set : 0;
            }

            const stored = parseInt(localStorage.getItem(PANEL_WIDTH_KEY) || "", 10);
            if (Number.isFinite(stored)) {
                applyWidth(Math.min(maxWidth(), Math.max(MIN_WIDTH, stored)));
            }

            const handle = document.getElementById("panelResizeHandle");
            const panel = document.getElementById("feedbackPanel");
            if (!handle || !panel) return;

            let width = 0;
            // The panel's right edge, measured when the drag starts. It is NOT the right edge
            // of the window: a vertical scrollbar eats into window.innerWidth. Measuring instead
            // of assuming is what keeps the panel edge under the pointer rather than a
            // scrollbar's width to its left.
            let panelRight = 0;

            handle.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                // Cleared per drag, so a click that moves nothing cannot re-save a width the
                // user has since reset.
                width = 0;
                panelRight = panel.getBoundingClientRect().right;
                handle.setPointerCapture(e.pointerId);
                handle.classList.add("dragging");
                document.body.classList.add("panel-resizing");
            });

            // Double-click the divider to go back to the default width, the same way a window
            // manager treats a double-clicked edge. The stored width is dropped and the property
            // removed, so the value falls back to the one the stylesheet declares.
            handle.addEventListener("dblclick", () => {
                width = 0;
                localStorage.removeItem(PANEL_WIDTH_KEY);
                document.documentElement.style.removeProperty("--feedback-panel-width");
                scheduleConnectorRefresh();
            });
            handle.addEventListener("pointermove", (e) => {
                if (!handle.hasPointerCapture(e.pointerId)) return;
                // Width is the distance from the pointer to the panel's own right edge, so the
                // edge being dragged tracks the pointer exactly.
                width = Math.min(maxWidth(), Math.max(MIN_WIDTH, panelRight - e.clientX));
                applyWidth(width);
                // The connector line ends on the panel, so it has to follow the drag.
                scheduleConnectorRefresh();
            });
            const finishDrag = (e) => {
                if (!handle.classList.contains("dragging")) return;
                handle.releasePointerCapture(e.pointerId);
                handle.classList.remove("dragging");
                document.body.classList.remove("panel-resizing");
                if (width) localStorage.setItem(PANEL_WIDTH_KEY, String(width));
                scheduleConnectorRefresh();
            };
            handle.addEventListener("pointerup", finishDrag);
            handle.addEventListener("pointercancel", finishDrag);

            // Shrinking the window must not let a panel set when it was wider push the
            // document column below its floor. The stored width is left alone: it is what the
            // panel returns to once there is room for it again.
            window.addEventListener("resize", () => {
                const set = currentWidth();
                if (!set) return;
                const clamped = Math.min(maxWidth(), Math.max(MIN_WIDTH, set));
                if (clamped !== set) applyWidth(clamped);
            });
        })();

        // ---------- Collapsible contents rail ----------
        // Reading a diff is worth more width than the file list is, so the rail folds away and
        // stays folded across the reloads the review loop performs.
        (function initRailToggle() {
            const RAIL_KEY = "reviewer.railCollapsed";
            const hideBtn = document.getElementById("hideRailBtn");
            const showBtn = document.getElementById("showRailBtn");
            if (!hideBtn || !showBtn) return;

            function setCollapsed(collapsed) {
                document.body.classList.toggle("rail-collapsed", collapsed);
                hideBtn.setAttribute("aria-expanded", String(!collapsed));
                showBtn.setAttribute("aria-expanded", String(!collapsed));
                localStorage.setItem(RAIL_KEY, collapsed ? "1" : "0");
                scheduleConnectorRefresh();
            }

            if (localStorage.getItem(RAIL_KEY) === "1") {
                document.body.classList.add("rail-collapsed");
                hideBtn.setAttribute("aria-expanded", "false");
                showBtn.setAttribute("aria-expanded", "false");
            }

            hideBtn.addEventListener("click", () => setCollapsed(true));
            showBtn.addEventListener("click", () => setCollapsed(false));
        })();

        // ---------- Hide whitespace changes ----------
        // The renderer decided which lines are whitespace-only; this only flips a body class,
        // so switching is instant and costs no round trip. The preference outlives the reloads
        // the review loop performs, like the contents rail above.
        (function initHideWhitespace() {
            const HIDE_WS_KEY = "reviewer.hideWhitespace";
            const toggle = document.getElementById("hideWhitespaceToggle");
            if (!toggle) return;

            function apply(hidden) {
                document.body.classList.toggle("hide-ws", hidden);
                // Rows vanishing moves everything below them, so any drawn connector is stale.
                scheduleConnectorRefresh();
            }

            toggle.checked = localStorage.getItem(HIDE_WS_KEY) === "1";
            apply(toggle.checked);

            toggle.addEventListener("change", () => {
                localStorage.setItem(HIDE_WS_KEY, toggle.checked ? "1" : "0");
                apply(toggle.checked);
            });
        })();

        // Initialize elements and load existing comments on page start
        {{if eq .Mode "diff"}}
        // Diff mode targets line ranges, not document blocks. Calling the Markdown initializer
        // here would tag every diff row as a block-level comment target and anchor comments
        // that cannot survive the next round.
        initializeDiffLines();
        initializeDiffHighlighting();
        {{else}}
        initializeCommentableElements();
        {{end}}
        loadExistingComments();
        // Initialize Table of Contents
        initializeTableOfContents();
        // Connect the live-reload stream (serve mode only)
        connectLiveReload();
        // Restore any in-progress agent status (e.g. after a mid-round reload)
        loadAgentStatus();

        // The column, not the page, is the scrollport now, so arrow/Space/PageDown keys aimed at
        // the body would scroll something that no longer moves. preventScroll so taking focus
        // cannot undo the #hash jump below.
        const initialScroller = document.querySelector(".document-column");
        if (initialScroller) {
            initialScroller.classList.add("focus-on-load");
            initialScroller.focus({ preventScroll: true });
            initialScroller.addEventListener("blur",
                () => initialScroller.classList.remove("focus-on-load"), { once: true });
        }

        // Handle initial URL hash scroll if present
        if (window.location.hash) {
            const targetId = decodeURIComponent(window.location.hash.substring(1));
            const targetEl = document.getElementById(targetId);
            if (targetEl) {
                setTimeout(() => {
                    targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                }, 200); // Small delay to let browser stabilize layout
            }
        }
    </script>
</body>
</html>
