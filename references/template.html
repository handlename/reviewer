<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        // Theme-aware Mermaid: follow the OS colour scheme instead of a fixed white canvas.
        (function () {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            mermaid.initialize({ startOnLoad: true, theme: prefersDark ? 'dark' : 'neutral' });
        })();
    </script>
    <!-- Prism.js Tomorrow Night Theme for Dark Mode -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" media="(prefers-color-scheme: dark)" />
    <!-- Prism.js Default Theme for Light Mode -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" media="(prefers-color-scheme: light)" />
    <!-- Prism.js Core and Autoloader JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js" defer></script>
    <!-- markdown-it, for the Markdown the panel's own text is authored in -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js" defer></script>
    <style>
        /* ============================================================
           reviewer — premium minimal review screen
           Monochrome stone scale · opacity-based hierarchy · one accent
           Hierarchy comes from opacity/weight/space, never from a 2nd hue.
           ============================================================ */
        :root {
            color-scheme: light dark;

            /* Foreground / background as HSL components so we can derive
               the whole hierarchy from opacity alone. */
            --fg-hsl: 30 12% 14%;
            --bg-hsl: 40 20% 96.5%;

            --bg-primary:   hsl(var(--bg-hsl));       /* page — the reading canvas */
            --bg-secondary: hsl(36 15% 93%);          /* quiet surfaces (callout, panels) */
            --bg-tertiary:  hsl(36 13% 87.5%);        /* inline code, elevated chips */
            --code-bg:      hsl(38 20% 94.5%);

            --text-primary:   hsl(var(--fg-hsl));
            --text-body:      hsl(var(--fg-hsl) / 0.86);
            --text-secondary: hsl(var(--fg-hsl) / 0.62);
            --text-tertiary:  hsl(var(--fg-hsl) / 0.40);

            /* one restrained accent, used only for interactive affordances */
            --accent-hsl:   222 42% 43%;
            --accent-color: hsl(var(--accent-hsl));
            --accent-hover: hsl(222 46% 34%);
            --on-accent:    hsl(40 30% 98%);

            --border-color:  hsl(var(--fg-hsl) / 0.13);   /* hairline */
            --border-strong: hsl(var(--fg-hsl) / 0.24);
            --card-bg:       hsl(36 15% 93%);
            --glass-border:  hsl(var(--fg-hsl) / 0.08);

            /* functional feedback colours (kept muted, not decorative) */
            --badge-must:  hsl(2 52% 46%);    /* destructive affordance: delete, clear × */
            --badge-could: hsl(150 30% 37%);  /* success message */
            --badge-should:     var(--text-secondary);
            --badge-wont:       var(--text-tertiary);
            --badge-confirmed:  var(--text-secondary);
            --badge-inferred:   var(--text-secondary);
            --badge-assumption: var(--text-tertiary);

            --callout-info:    var(--accent-color);
            --callout-warning: hsl(38 58% 40%);
            --callout-danger:  hsl(2 52% 46%);

            /* Comment-state highlight channels. One accent hue throughout;
               the four states are told apart by position, stroke style and
               depth instead. Why not a second hue: .callout already spends
               the accent on its semantic left rule, so any state that also
               paints inside the box is invisible on a callout. */
            --hl-wash:   hsl(var(--accent-hsl) / 0.07);   /* hover + persistent states */
            --hl-mark:   hsl(var(--accent-hsl) / 0.40);   /* gutter tick: has comments */
            --hl-ring:   hsl(var(--accent-hsl));          /* full-perimeter ring */
            --hl-halo:   hsl(var(--accent-hsl) / 0.20);   /* selected only */
            --hl-gutter: 12px;                            /* tick offset, outside the box */

            --radius: 3px;
            --u: 8px;           /* spacing base unit */

            /* Feedback panel width. A custom property rather than a fixed width so the
               drag handle can rewrite it and the narrow-viewport media query can still
               override it — an inline el.style.width would beat the media query. */
            --feedback-panel-width: 520px;
            /* The narrowest the document column may become. Read by the resize handle too. */
            --document-min-width: 480px;

            scrollbar-color: hsl(var(--fg-hsl) / 0.22) transparent;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg-hsl: 40 22% 91%;
                --bg-hsl: 30 9% 8%;

                --bg-primary:   hsl(var(--bg-hsl));
                --bg-secondary: hsl(30 7% 11%);
                --bg-tertiary:  hsl(30 6% 16%);
                --code-bg:      hsl(30 8% 11.5%);

                --accent-hsl:   213 55% 73%;
                --accent-color: hsl(var(--accent-hsl));
                --accent-hover: hsl(213 62% 82%);
                --on-accent:    hsl(30 12% 9%);

                --border-color:  hsl(var(--fg-hsl) / 0.14);
                --border-strong: hsl(var(--fg-hsl) / 0.26);
                --card-bg:       hsl(30 7% 12.5%);
                --glass-border:  hsl(var(--fg-hsl) / 0.07);

                --badge-must:  hsl(4 58% 67%);
                --badge-could: hsl(150 38% 62%);
                --callout-warning: hsl(40 62% 62%);
                --callout-danger:  hsl(4 58% 67%);

                scrollbar-color: hsl(var(--fg-hsl) / 0.26) transparent;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 1.0625rem;               /* 17px reading base */
            line-height: 1.65;
            background-color: var(--bg-primary);
            color: var(--text-body);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            font-kerning: normal;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection { background: hsl(var(--accent-hsl) / 0.22); }

        :focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
            border-radius: 2px;
        }

        /* thin, neutral scrollbars */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: hsl(var(--fg-hsl) / 0.18); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: hsl(var(--fg-hsl) / 0.3); }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ---------- Layout ---------- */
        .layout {
            display: flex;
            width: 100%;
            position: relative;
        }

        /* Supporting rails recede: same canvas as the page, separated only by a hairline. */
        .contents-rail {
            width: 280px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            background-color: transparent;
            border-right: 1px solid var(--border-color);
            padding: calc(var(--u) * 5) calc(var(--u) * 3.5);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 2);
        }
        /* Descendant, not child: the title sits inside .contents-rail-header alongside the collapse
           button, and a child selector would drop it back to document-heading styling. */
        .contents-rail h2 {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin: 0;
            border: none;
            padding: 0;
            text-wrap: balance;
        }
        .contents-rail > p {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            color: var(--text-tertiary);
            margin: 0;
        }

        /* The main column is the hero: it takes whatever the two rails leave.
           Why no reading measure caps it any more: on a wide window the cap was pure loss — the
           column sat at 46rem with dead margin either side while the window still had room, and
           the 1600px cap on .layout pushed the rest of that room outside the layout entirely.
           Why no min-width floor here either: the panel drag is already clamped against
           --document-min-width in JavaScript, so a CSS floor adds nothing the drag needs. What
           it would add is harm — it only ever binds when the *window* is the narrow thing, and
           then it pushes the feedback panel off the right edge of the screen. */
        .document-column {
            flex: 1;
            min-width: 0;
            padding: clamp(2.5rem, 5vw, 4.5rem) clamp(1.5rem, 4vw, 3rem);
            /* Its own scrollport rather than the page's. Why not let the page scroll: the two
               rails are already 100vh and sticky, so a page-level scroll puts this column's
               scrollbar at the window edge — outside the feedback panel — instead of at the
               column's own right edge, where the content it scrolls actually ends. */
            height: 100vh;
            overflow-y: auto;
        }
        /* Why not ring like everything else does: the focus this suppresses is not the reader's,
           it is the one taken on load so the keyboard can scroll the column at all. Chrome turns
           the ring on at their first arrow key and never turns it off — focus never leaves the
           column — so a 2px accent frame would enclose the whole document for the rest of the
           session while announcing nothing they chose. The class is dropped the first time focus
           does leave, after which every arrival here is deliberate and rings normally. */
        .document-column.focus-on-load:focus-visible { outline: none; }

        .feedback-panel {
            width: var(--feedback-panel-width);
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            background-color: transparent;
            border-left: 1px solid var(--border-color);
            padding: calc(var(--u) * 5) calc(var(--u) * 3);
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 2);
            overflow-y: auto;
        }

        /* Drag handle on the panel's left edge: a 7px hit area for the pointer, a 1px
           line for the eye.
           Why a sibling of the panel rather than a child: the panel scrolls
           (overflow-y: auto), and an absolutely positioned child both scrolls away with
           the comment list and gets clipped where it overhangs the panel's edge. As a
           sticky flex item pulled back over that edge by a negative margin it stays put,
           stays hittable, and costs the layout no width. */
        .panel-resize-handle {
            display: none;               /* serve mode only — see body.is-served below */
            position: sticky;
            top: 0;
            width: 7px;
            height: 100vh;
            margin-right: -7px;
            flex-shrink: 0;
            cursor: col-resize;
            z-index: 30;
            touch-action: none;
        }
        .panel-resize-handle::after {
            content: "";
            position: absolute;
            left: 3px;
            top: 0;
            width: 1px;
            height: 100%;
            background: transparent;
            transition: background-color 0.18s;
        }
        body.is-served .panel-resize-handle { display: block; }
        .panel-resize-handle:hover::after,
        .panel-resize-handle.dragging::after { background: var(--accent-color); }
        /* While dragging, keep the pointer's own cursor and stop text selecting mid-drag. */
        body.panel-resizing { user-select: none; cursor: col-resize; }

        /* ---------- Typography ---------- */
        h1, h2, h3, h4 {
            color: var(--text-primary);
            text-wrap: balance;
            letter-spacing: -0.015em;
        }
        h1 {
            font-size: 2.05rem;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.025em;
            margin: 0 0 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.25;
            margin: 3rem 0 1rem;
        }
        h3 {
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.3;
            margin: 2.25rem 0 0.75rem;
        }
        h4 {
            font-size: 1rem;
            font-weight: 600;
            margin: 1.75rem 0 0.5rem;
        }

        p { margin-bottom: 1.15rem; color: var(--text-body); text-wrap: pretty; }

        ul, ol { margin: 0 0 1.15rem 1.4rem; color: var(--text-body); }
        li { margin-bottom: 0.4rem; }

        a { color: var(--accent-color); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.18s; }
        a:hover { border-bottom-color: currentColor; }

        hr { border: none; border-top: 1px solid var(--border-color); margin: 2.5rem 0; }

        strong { font-weight: 600; color: var(--text-primary); }
        em { font-style: italic; }

        /* ---------- Code ---------- */
        code, pre, .monospace, pre[class*="language-"], code[class*="language-"] {
            font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace !important;
            font-size: 0.88em;
        }
        :not(pre) > code {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            font-size: 0.82em;
        }
        pre code, pre[class*="language-"] code[class*="language-"] {
            font-size: 1em !important;
            display: block;
            overflow-x: auto;
            width: 100%;
            background: transparent !important;
        }
        pre, pre[class*="language-"] {
            margin: 1.5rem 0 !important;
            border-radius: var(--radius);
            background: var(--code-bg) !important;
            border: 1px solid var(--border-color);
            overflow: visible !important; /* allow comment bubbles / indicators to overflow right */
            line-height: 1.55;
        }

        /* ---------- Badges (monochrome: form + opacity, not hue) ---------- */
        .badge {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 0.12rem 0.42rem;
            border-radius: 2px;
            margin-left: 0.45rem;
            vertical-align: middle;
            line-height: 1.5;
            white-space: nowrap;
            border: 1px solid var(--border-strong);
            color: var(--text-secondary);
            background: transparent;
        }
        /* priority — presence via fill / opacity */
        .badge-must   { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }
        .badge-should { color: var(--text-primary); border-color: var(--border-strong); }
        .badge-could  { color: var(--text-secondary); border-color: var(--border-color); }
        .badge-wont   { color: var(--text-tertiary); border-color: transparent; text-decoration: line-through; }
        /* status — differentiated by border style, still monochrome */
        .badge-confirmed  { color: var(--text-primary); border-style: solid; border-color: var(--border-strong); }
        .badge-inferred   { color: var(--text-secondary); border-style: dashed; }
        .badge-assumption { color: var(--text-tertiary); border-style: dotted; }

        /* ---------- Callouts (flat, hairline, single left rule) ---------- */
        .callout {
            padding: 1rem 1.25rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--callout-info);
            border-radius: var(--radius);
            margin: 1.75rem 0;
        }
        .callout > p { margin-bottom: 0.5rem; color: var(--text-body); }
        .callout > p:last-child { margin-bottom: 0; }
        .callout-info    { border-left-color: var(--accent-color); }
        .callout-warning { border-left-color: var(--callout-warning); }
        .callout-danger  { border-left-color: var(--callout-danger); }
        .callout-title {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.09em;
            color: var(--text-tertiary);
        }

        /* ---------- Tables ----------
           Wrap-to-fit instead of horizontal scroll: a scrolling table would
           clip the per-row comment bubble sitting in the right gutter. */
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.75rem 0;
            font-size: 0.92rem;
            font-variant-numeric: tabular-nums;
            table-layout: auto;
        }
        .spec-table th, .spec-table td {
            padding: 0.5rem 0.7rem;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            vertical-align: top;
            overflow-wrap: break-word;   /* break a word only when it would overflow — not mid-word for short words */
        }
        .spec-table th {
            font-weight: 500;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border-strong);
        }
        .spec-table tbody tr:last-child td { border-bottom: none; }
        /* inline code in cells: compact, and only long tokens (e.g. /api/paths) break */
        .spec-table :not(pre) > code { padding: 0.05rem 0.28rem; font-size: 0.8em; word-break: break-all; }

        /* ---------- Diagram (theme-aware, no forced white) ----------
           The figure stays full-column width with overflow VISIBLE so the
           comment bubble in the gutter is never clipped; the inner .mermaid
           carries the horizontal scroll for oversized diagrams. */
        .diagram-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: var(--radius);
            margin: 1.75rem 0;
            text-align: center;
            overflow: visible;
        }
        .diagram-container .mermaid {
            overflow-x: auto;
            max-width: 100%;
        }
        .diagram-container figcaption {
            margin-top: 0.85rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        /* ---------- Feedback panel ---------- */
        .feedback-header {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }
        .composer {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.65rem 0.75rem;
            margin-bottom: 0.85rem;
            transition: border-color 0.18s;
        }
        .composer:focus-within { border-color: var(--accent-color); }
        .composer textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: vertical;
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.5;
            outline: none;
            min-height: 96px;
            /* Grown to fit its content from JS. The ceiling keeps the buttons below it
               on screen; past it the textarea scrolls instead of pushing them off. */
            max-height: 50vh;
            overflow-y: auto;
        }
        .composer textarea::placeholder { color: var(--text-tertiary); }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.7rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid var(--border-strong);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: var(--radius);
            cursor: pointer;
            text-align: center;
            transition: background-color 0.18s, border-color 0.18s, transform 0.1s;
        }
        .btn:hover { background: var(--bg-secondary); border-color: var(--text-tertiary); }
        .btn:active { transform: translateY(1px); }
        #submitFeedbackBtn {
            background: var(--accent-color);
            color: var(--on-accent);
            border-color: var(--accent-color);
        }
        #submitFeedbackBtn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .comment-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 0.7rem 0.8rem;
            padding-right: 46px;   /* room for edit + delete affordances */
            border-radius: var(--radius);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-body);
            position: relative;
        }
        /* A comment may carry a ```suggestion fence, which is only readable if its line breaks
           and indentation survive. This also keeps a Markdown comment's own paragraphs intact. */
        .comment-card > p { white-space: pre-wrap; overflow-wrap: anywhere; }
        .comment-card .delete-btn {
            position: absolute;
            top: 8px;
            right: 9px;
            cursor: pointer;
            color: var(--badge-must);
            font-weight: bold;
            line-height: 1;
        }
        .comment-card .edit-btn {
            position: absolute;
            top: 8px;
            right: 28px;
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            line-height: 1;
            user-select: none;
            transition: color 0.18s;
        }
        .comment-card .edit-btn:hover { color: var(--accent-color); }
        /* Folding sits in the affordance row with edit and delete rather than at the foot of the
           card: the reader who has just opened a folded thread is still at its top, and the
           control they reach for next is the one that closes it again. */
        .comment-card .fold-toggle {
            position: absolute;
            top: 8px;
            right: 47px;
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            line-height: 1;
            user-select: none;
            transition: color 0.18s;
        }
        .comment-card .fold-toggle:hover { color: var(--accent-color); }
        /* A thread the agent opened carries no edit or delete, so the row starts at the edge. */
        .comment-card.agent-thread .fold-toggle { right: 9px; }
        /* Room for the third affordance, on top of the 46px the other two already hold. */
        .comment-card.resolved:not(.folded) { padding-right: 66px; }
        .comment-card.resolved.agent-thread:not(.folded) { padding-right: 28px; }
        .comment-card.editing-mode {
            border-color: var(--accent-color);
            background: hsl(var(--accent-hsl) / 0.05);
        }
        .edit-textarea {
            width: 100%;
            min-height: 60px;
            max-height: 50vh;
            overflow-y: auto;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.5;
            padding: 0.45rem;
            margin: 0.4rem 0;
            resize: vertical;
            outline: none;
            transition: border-color 0.18s;
        }
        .edit-textarea:focus { border-color: var(--accent-color); }
        .edit-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.25rem;
        }
        .btn-sm {
            padding: 0.28rem 0.7rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: var(--radius);
            cursor: pointer;
            border: 1px solid transparent;
            transition: background-color 0.18s, border-color 0.18s, opacity 0.18s;
        }
        .btn-save {
            background: var(--accent-color);
            color: var(--on-accent);
            border-color: var(--accent-color);
        }
        .btn-save:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-strong);
        }
        .btn-cancel:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .feedback-success {
            color: var(--badge-could);
            font-weight: 500;
            text-align: center;
        }

        /* ---------- Live loop: change summary, agent replies, resolve, session ---------- */

        /* Agent's page-level summary of the latest pass — quiet callout, single left rule. */
        .change-summary {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--accent-color);
            border-radius: var(--radius);
            padding: 0.7rem 0.85rem;
            font-size: 0.88rem;
            line-height: 1.55;
            color: var(--text-body);
            /* enter softly when the agent's summary appears after a reload */
            animation: summary-enter 0.32s cubic-bezier(0.2, 0, 0, 1);
        }
        .change-summary .change-summary-label {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.35rem;
        }
        .change-summary p { margin: 0 0 0.5rem; color: var(--text-body); }
        .change-summary p:last-child { margin-bottom: 0; }

        @keyframes summary-enter {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* author tag on each comment */
        .comment-author {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.3rem;
        }

        /* One message in a comment's thread, beneath the head. Concentric: parent radius 3px,
           inner 2px. The two authors are told apart by depth — the agent's is a filled block,
           the human's answer is unfilled — never by a second hue (UI_DESIGN.md 2.1). */
        .thread-message {
            margin-top: 0.55rem;
            padding: 0.5rem 0.6rem;
            border-left: 2px solid var(--text-tertiary);
            border-radius: 2px;
            font-size: 0.86rem;
            line-height: 1.5;
            color: var(--text-body);
            animation: reply-enter 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .thread-message.from-agent { background: var(--bg-tertiary); }
        .thread-message.from-human {
            background: transparent;
            border-left-color: var(--border-strong);
        }
        .thread-message .thread-message-meta {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.25rem;
        }
        .thread-message .thread-message-time {
            letter-spacing: 0.04em;
            text-transform: none;
        }
        /* The direct child is the plain-text body drawn when markdown-it is not there; a
           rendered message's own paragraphs are governed by .prose instead. */
        .thread-message > p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        /* Sits at the end of the message's own meta line, so it needs no gutter of its own and
           cannot collide with the card's edit and delete affordances. */
        .thread-message-edit {
            margin-left: auto;
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 0.8rem;
            line-height: 1;
            user-select: none;
            transition: color 0.18s;
        }
        .thread-message-edit:hover { color: var(--accent-color); }
        .thread-message .edit-textarea { margin-bottom: 0.25rem; }

        /* ---------- Panel Prose ---------- */
        /* Unrendered prose, drawn on all three surfaces when markdown-it is not there. Its
           line breaks are all the structure it has left, so they are kept. */
        .prose-plain { white-space: pre-wrap; overflow-wrap: anywhere; }

        /* The panel's three authored surfaces — a comment, a thread message, the agent's
           change summary — are written in Markdown, so they are read as Markdown. One scope
           covers all three because the summary sits outside .comment-card and can inherit
           nothing from it.

           Why headings have a scale of their own: the panel is a 520px annotation column at
           0.9rem, and document-scale headings belong to the document column. Rendering an
           author's `## …` at document size would make the panel a second document arguing
           with the first over the page's hierarchy. Collapsed just above body size, the
           structure still reads as structure — depth, not decoration (UI_DESIGN.md 2.1).

           These rules come after .change-summary p and .thread-message p deliberately: they
           tie on specificity, and the rendered body must win inside all three surfaces. */
        .prose { overflow-wrap: anywhere; }
        .prose > :first-child { margin-top: 0; }
        .prose > :last-child { margin-bottom: 0; }
        .prose p { margin: 0 0 0.5rem; }
        .prose h1, .prose h2, .prose h3,
        .prose h4, .prose h5, .prose h6 {
            margin: 0.75rem 0 0.3rem;
            font-weight: 600;
            line-height: 1.35;
            letter-spacing: 0;
            color: var(--text-primary);
        }
        .prose h1, .prose h2 { font-size: 1rem; }
        .prose h3 { font-size: 0.92rem; }
        .prose h4, .prose h5, .prose h6 { font-size: 0.9rem; color: var(--text-secondary); }
        .prose ul, .prose ol { margin: 0 0 0.5rem; padding-left: 1.25rem; }
        .prose li { margin: 0.12rem 0; }
        .prose li > ul, .prose li > ol { margin: 0.12rem 0 0; }
        .prose blockquote {
            margin: 0 0 0.5rem;
            padding-left: 0.6rem;
            border-left: 2px solid var(--border-color);
            color: var(--text-secondary);
        }
        /* Inline code and code fences already have a treatment on this page, so the panel
           reuses it rather than inventing a second one. Only the fence's 1.5rem document
           margin is wrong inside a 0.7rem card — and it is set !important, so it has to be
           answered in kind. An unclassed fence gets no padding from Prism's theme either. */
        .prose pre { margin: 0 0 0.5rem !important; padding: 0.45rem 0.6rem; }
        .prose > pre:last-child { margin-bottom: 0 !important; }
        .prose a { color: var(--accent-color); }
        .prose hr { margin: 0.7rem 0; border: 0; border-top: 1px solid var(--border-color); }
        .prose img { max-width: 100%; }
        /* A table is the one block that cannot be made to fit 520px, so it scrolls in place
           rather than widening the panel. */
        .prose table {
            display: block;
            width: max-content;
            max-width: 100%;
            overflow-x: auto;
            margin: 0 0 0.5rem;
            border-collapse: collapse;
            font-size: 0.94em;
        }
        .prose th, .prose td {
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.45rem;
            text-align: left;
        }
        .prose th { font-weight: 600; background: var(--bg-tertiary); }

        /* Reply to a thread. Quiet until wanted: a text-weight control, the composer only once
           it is opened, so a thread at rest stays as calm as it was before it had one. */
        .thread-reply-btn {
            /* Sits on the same line as the resolve toggle, so it matches its height and keeps a
               gap: the two read as one row of choices rather than as colliding words.
               vertical-align is what actually lines them up — as atomic inline boxes they would
               otherwise align on their baselines, and the toggle's baseline is dragged four
               pixels by the checkbox inside it. */
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            min-height: 24px;
            margin-top: 0.55rem;
            margin-right: 0.9rem;
            padding: 0.2rem 0;
            background: none;
            border: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: color 0.18s;
        }
        .thread-reply-btn:hover { color: var(--text-secondary); }
        .thread-reply { margin-top: 0.5rem; }

        @keyframes reply-enter {
            from { opacity: 0; transform: translateY(-3px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* resolve toggle — a real checkbox, 40px+ hit area via the label.
           .ws-toggle rides the same rules: both are a bare checkbox with a micro-label, and
           having them drift apart visually would read as two different kinds of control. */
        .resolve-toggle,
        .ws-toggle {
            display: inline-flex;
            align-items: center;
            /* Paired with the same rule on .thread-reply-btn: both boxes are aligned by their
               middles, so the checkbox cannot pull this label off the Reply button's line. */
            vertical-align: middle;
            gap: 0.4rem;
            margin-top: 0.55rem;
            min-height: 24px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            cursor: pointer;
            user-select: none;
            transition: color 0.18s;
        }
        .resolve-toggle:hover,
        .ws-toggle:hover { color: var(--text-secondary); }
        .resolve-toggle input,
        .ws-toggle input {
            width: 15px;
            height: 15px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* ---------- ```suggestion rendered as a diff ----------
           Same tints as the diff body, so a suggestion in the panel and the lines it
           replaces in the document read as the same kind of object. Code wraps here
           rather than scrolling: the panel is narrow, and a suggestion is short. */
        .suggestion-diff {
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            background: var(--bg-primary);
        }
        .suggestion-diff-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            padding: 0.3rem 0.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .suggestion-line {
            display: flex;
            align-items: baseline;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.74rem;
            line-height: 1.55;
        }
        .suggestion-marker {
            flex: 0 0 auto;
            width: 1.2em;
            text-align: center;
            color: var(--text-tertiary);
            user-select: none;
        }
        .suggestion-code {
            flex: 1 1 auto;
            min-width: 0;
            padding-right: 0.4rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: var(--text-body);
        }
        .suggestion-add { background: var(--diff-add-bg); }
        .suggestion-del { background: var(--diff-del-bg); }
        .suggestion-add .suggestion-marker { color: var(--diff-add-fg); font-weight: 600; }
        .suggestion-del .suggestion-marker { color: var(--diff-del-fg); font-weight: 600; }
        .suggestion-ctx .suggestion-code { color: var(--text-secondary); }

        /* Outdated: the comment's lines are no longer in the diff. It recedes, but keeps its
           text and the lines it was written against — with the diff gone, that quotation is the
           only remaining record of what it referred to. */
        .comment-card.outdated { border-style: dashed; background: transparent; }
        /* Heading over a group of comments in the panel. Weight and letter-spacing only — the
           groups are told apart by the label, not by a rule or a box. */
        .panel-section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-top: 0.4rem;
        }
        .panel-section-label:first-child { margin-top: 0; }

        /* A thread waiting on the human. The accent is the page's single attention channel, so
           it marks the card and the panel-level count alike. */
        .awaiting-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 0.3rem;
        }
        /* Panel-level count of unanswered questions: a button, because it takes you to the first
           of them — and because a thing you can act on has to be reachable by keyboard. */
        .pending-questions {
            display: block;
            width: 100%;
            text-align: left;
            background: hsl(var(--accent-hsl) / 0.05);
            border: 1px solid var(--accent-color);
            border-radius: var(--radius);
            padding: 0.55rem 0.7rem;
            margin-bottom: 0.5rem;
            font-family: inherit;
            font-size: 0.82rem;
            color: var(--text-body);
            cursor: pointer;
            transition: background-color 0.18s;
        }
        .pending-questions:hover { background: hsl(var(--accent-hsl) / 0.09); }
        /* It shares the composer's width and shape, so without a mark it reads as a field to type
           in rather than something to press. The arrow says it takes you somewhere. */
        .pending-questions::after {
            content: "\2192";
            float: right;
            color: var(--accent-color);
        }
        /* Inset, so the mark costs no padding or border and the text under it never moves. */
        .comment-card.awaiting-answer { box-shadow: inset 2px 0 0 var(--accent-color); }
        /* A thread the agent opened carries no edit or delete affordance, so it does not need the
           gutter the card reserves for them. */
        .comment-card.agent-thread { padding-right: 0.8rem; }

        .outdated-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--callout-warning);
            margin-bottom: 0.3rem;
        }
        .outdated-context {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            color: var(--text-tertiary);
            margin-top: 0.45rem;
            overflow-wrap: anywhere;
        }
        .outdated-lines {
            margin: 0.35rem 0 0 !important;
            padding: 0.4rem 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            font-size: 0.72rem;
            line-height: 1.5;
            color: var(--text-secondary);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* A comment the user marked resolved recedes but stays visible for the cycle: it folds to
           one line and gathers at the end of the panel. It recedes rather than leaving because
           submit is the last moment a resolve made by mistake can be caught, and that check is
           the whole reason the folded line stays readable. */
        .comment-card.resolved {
            opacity: 0.6;
        }
        .comment-card.resolved:hover { opacity: 1; }
        .comment-card.resolved > p,
        .comment-card.resolved > .prose { text-decoration: line-through; text-decoration-color: var(--text-tertiary); }
        .comment-card.resolved .resolve-toggle { color: var(--badge-could); }

        /* Folded, the summary is the whole card, so the card keeps no padding of its own —
           including the 46px reserved for the edit and delete affordances, which are not
           rendered here. */
        .comment-card.folded { padding: 0; }
        .resolved-summary {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.45rem 0.6rem;
            background: transparent;
            border: 0;
            border-radius: var(--radius);
            font: inherit;
            color: var(--text-body);
            text-align: left;
            cursor: pointer;
        }
        .resolved-summary-mark { flex: none; color: var(--badge-could); }
        /* Truncation is left to CSS: the panel's width is dragged by the reader, so a character
           count chosen here would be the right one at a single width. */
        .resolved-summary-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .resolved-summary-chevron { flex: none; color: var(--text-tertiary); font-size: 0.7rem; }

        /* End Review — quiet secondary action, distinct from Submit */
        #endReviewBtn {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-color);
            margin-top: 0.5rem;
        }
        #endReviewBtn:hover { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--text-tertiary); }
        .btn:active { transform: scale(0.98); }

        /* reload prompt shown only when auto-reload is deferred to protect unsent edits */
        .reload-prompt {
            display: none;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 0.55rem 0.7rem;
            font-size: 0.82rem;
            color: var(--text-body);
            animation: summary-enter 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .reload-prompt button {
            margin-left: auto;
            padding: 0.28rem 0.6rem;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: var(--radius);
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: var(--on-accent);
            cursor: pointer;
            transition: background-color 0.18s;
        }
        .reload-prompt button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        /* subtle live-connection dot next to the panel header */
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--badge-could);
            margin-left: 0.5rem;
            vertical-align: middle;
            transition: background-color 0.3s;
        }
        .live-dot.offline { background: var(--text-tertiary); }

        /* agent activity — live progress between submit and the reply landing */
        .agent-activity {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--text-tertiary);
            border-radius: var(--radius);
            padding: 0.6rem 0.75rem;
            font-size: 0.84rem;
            animation: summary-enter 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .agent-activity.working { border-left-color: var(--accent-color); }
        .agent-activity-label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.4rem;
        }
        #agentActivityList {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        #agentActivityList li {
            color: var(--text-secondary);
            line-height: 1.45;
            margin: 0;
            padding-left: 0.9rem;
            position: relative;
            animation: reply-enter 0.25s cubic-bezier(0.2, 0, 0, 1);
        }
        #agentActivityList li::before {
            content: "\203A";
            position: absolute;
            left: 0;
            color: var(--text-tertiary);
        }
        #agentActivityList li:last-child { color: var(--text-primary); }
        .agent-spinner {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-color);
            flex-shrink: 0;
            animation: agent-pulse 1s ease-in-out infinite;
        }
        .agent-activity:not(.working) .agent-spinner { animation: none; background: var(--text-tertiary); }
        @keyframes agent-pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50%      { opacity: 1;   transform: scale(1); }
        }
        @media (prefers-reduced-motion: reduce) { .agent-spinner { animation: none !important; } }

        /* ---------- Inline commenting affordances ---------- */
        .commentable-element {
            position: relative;
            border-radius: var(--radius);
            /* Never `transition: all` — the interpolated properties are listed
               so a state change can never move the text. */
            transition: background-color 0.18s ease-out,
                        box-shadow 0.18s ease-out,
                        outline-color 0.18s ease-out;
        }
        .commentable-element:hover {
            background-color: var(--hl-wash);
        }
        /* "Has comments" lives in the left gutter, outside the box.
           Why not a left rule: .callout owns border-left for its semantic
           accent, so an inner rule reads as the callout, not as a state.
           Why a short centred tick rather than a full-height bar: next to a
           callout a full-height bar in the same accent reads as a second
           left rule, and the two become hard to tell apart. */
        .commentable-element.has-comments-highlight::before {
            content: "";
            position: absolute;
            left: calc(var(--hl-gutter) * -1);
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: calc(var(--u) * 2.5);
            border-radius: 1px;
            background: var(--hl-mark);
        }
        /* Compose target and selected target are both persistent and mutually
           exclusive (selectComment clears the compose state first), so they are
           separated by stroke style and depth. Neither touches padding or
           border, so .callout keeps its own left rule and its 1rem 1.25rem
           padding, and nothing shifts when a state turns on. */
        .commentable-element.active-comment-target {
            background-color: var(--hl-wash);
            outline: 1.5px dashed var(--hl-ring);
            outline-offset: 3px;
        }
        /* Table rows carry their state on the row, but never a generated box.
           Why not `::before` on the tr, and why the comment indicator is appended to the
           last cell in JS: a row may only contain cells, so an extra child or a
           generated box gets wrapped in an ANONYMOUS TABLE CELL — the row gains
           a column and its cells stop lining up with the rest of the table.
           outline, box-shadow and background-color are safe on a tr because
           none of them generates a box, so hover / active / selected keep the
           exact same declarations as every other block element. */
        tr.commentable-element > td { position: relative; }
        tr.commentable-element.has-comments-highlight::before { content: none; }
        tr.commentable-element.has-comments-highlight > td:first-child::before {
            content: "";
            position: absolute;
            left: calc(var(--hl-gutter) * -1);
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: calc(var(--u) * 2.5);
            border-radius: 1px;
            background: var(--hl-mark);
        }
        .comment-indicator {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.22rem;
            background: var(--accent-color);
            color: var(--on-accent);
            border: 1px solid transparent;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            font-weight: 500;
            /* The chip is appended inside its target, so it inherits that target's text
               metrics: a heading's tighter line-height and negative letter-spacing made the
               same chip 5px shorter and a fraction narrower there than on a paragraph.
               Measured, not assumed — the count is what has to line up across the page. */
            line-height: 1;
            letter-spacing: 0;
            padding: 0.12rem 0.4rem;
            border-radius: 2px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
            z-index: 11;
        }
        .comment-indicator:hover {
            transform: translateY(-50%) scale(1.08);
            background-color: var(--accent-hover);
        }
        /* Both glyphs are given a box of the same size. A speech bubble is wider than a check
           mark, so left to their own metrics two chips carrying the same number of digits would
           come out different widths and the chip's left edge would jump as threads get resolved. */
        .comment-indicator .ci-glyph {
            flex: none;
            width: 10px;
            height: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .comment-indicator .ci-glyph svg { display: block; }
        /* An indicator whose threads are every one resolved says so, so that the reader can tell
           from the document — without opening the panel — that nothing here still waits on them.
           It is drawn the way §2.5 steps a badge down: the fill is given up, and the accent moves
           to a hairline outline and the text. Neither state spends a hue — the glyphs are a
           stroked bubble and a ✓, both in currentColor — so the two read as one control in two
           states rather than as two different marks. */
        .comment-indicator.resolved {
            background: transparent;
            color: var(--accent-color);
            border-color: hsl(var(--accent-hsl) / 0.55);
        }
        .comment-indicator.resolved:hover { background-color: hsl(var(--accent-hsl) / 0.10); }
        pre.commentable-element .comment-indicator {
            top: 1rem;
            transform: none;
        }
        pre.commentable-element .comment-indicator:hover { transform: scale(1.08); }
        /* ---------- Connector line (comment ⇄ target element) ----------
           A viewport-fixed SVG overlay draws a line between a selected comment
           and its target element. Selecting always scrolls the element into
           view, so a fixed layer (recomputed on scroll/resize) is enough. */
        #connectorOverlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 40;
            overflow: visible;
        }
        #connectorOverlay path {
            fill: none;
            stroke: var(--accent-color);
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
        }
        #connectorOverlay path.persistent { stroke-width: 1.75; opacity: 0.9; }
        #connectorOverlay path.transient  { stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.55; }
        #connectorOverlay circle { fill: var(--accent-color); }
        #connectorOverlay circle.transient { opacity: 0.55; }
        #connectorOverlay stop { stop-color: var(--accent-color); }

        @keyframes connector-draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
        #connectorOverlay path.persistent.drawing {
            stroke-dasharray: var(--len);
            animation: connector-draw 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* selected comment card + its target element share the accent lift */
        .comment-card.selected { border-color: var(--accent-color); background: hsl(var(--accent-hsl) / 0.06); }
        /* Strongest state: solid ring plus a halo, so it outranks the dashed
           compose ring without needing a second hue. */
        .commentable-element.selected-target {
            background-color: var(--hl-wash);
            outline: 1.5px solid var(--hl-ring);
            outline-offset: 3px;
            box-shadow: 0 0 0 6px var(--hl-halo);
        }

        /* ---------- Diff view ----------
           A diff is read across, not down: it trades the document's generous reading
           padding for room, and its lines wrap rather than run off the side.
           Added and removed are the one place a second hue is spent — they are not a
           hierarchy but a distinction of meaning, and nothing else on the page can
           carry it as fast. The tints are dropped to the saturation of the stone
           palette so they read as paper, not as a warning. */
        :root {
            --diff-add-bg: hsl(150 34% 42% / 0.13);
            --diff-del-bg: hsl(2 60% 50% / 0.11);
            --diff-add-fg: hsl(150 40% 32%);
            --diff-del-fg: hsl(2 55% 44%);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --diff-add-bg: hsl(150 40% 55% / 0.15);
                --diff-del-bg: hsl(4 60% 62% / 0.14);
                --diff-add-fg: hsl(150 40% 62%);
                --diff-del-fg: hsl(4 58% 67%);
            }
        }

        /* A diff keeps a floor where a spec has none: its lines are as wide as the code, and
           squeezing the column past --document-min-width stops being a diff. Prose reflows, so
           a spec column that gets narrow is merely narrow. The tighter padding buys room for
           the same reason. */
        .document-column.diff-mode {
            min-width: var(--document-min-width);
            padding: calc(var(--u) * 4) calc(var(--u) * 3);
        }
        .diff-file {
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: calc(var(--u) * 3);
            overflow: hidden;
            background: var(--bg-primary);
        }
        .document-column.diff-mode h2.diff-file-header {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            line-height: 1.5;
            color: var(--text-primary);
            margin: 0;
            padding: 0.55rem 0.85rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            /* The path stays visible while its hunks scroll past. */
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .diff-file-note {
            color: var(--text-tertiary);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            margin-left: 0.5rem;
        }
        .diff-empty {
            margin: 0;
            padding: 0.5rem 0.85rem;
            font-size: 0.84rem;
            color: var(--text-tertiary);
        }
        /* Lines wrap, so this rarely scrolls — but the hunk stays the scroll unit and the
           scrollport the sticky badge sticks to. Scrolling per line would make the rows slide
           independently; scrolling the whole file card would take the sticky path header. */
        .diff-hunk {
            overflow-x: auto;
            display: flex;
            flex-direction: column;
        }
        .diff-hunk + .diff-hunk { border-top: 1px solid var(--border-color); }
        .diff-hunk-header {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-tertiary);
            padding: 0.3rem 0.85rem;
            background: hsl(var(--fg-hsl) / 0.035);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .diff-line {
            display: flex;
            align-items: baseline;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.84rem;
            line-height: 1.6;
            /* pre-WRAP, not pre: a line too long for the hunk wraps rather than pushing the
               row wider than the scrollport. Whitespace is still significant, so leading
               indentation survives. */
            white-space: pre-wrap;
            position: relative;
        }
        .diff-no {
            flex: 0 0 auto;
            width: 3.6em;
            text-align: right;
            padding-right: 0.6em;
            color: var(--text-tertiary);
            font-size: 0.72rem;
            user-select: none;
        }
        /* A deletion has no number on the new side, so its own (old) number is shown
           instead — dimmed, because the column changes coordinate system for that row. */
        .diff-no-old { opacity: 0.6; font-style: italic; }
        .diff-marker {
            flex: 0 0 auto;
            width: 1.4em;
            text-align: center;
            color: var(--text-tertiary);
            user-select: none;
        }
        /* The only column that wraps: the number and marker columns keep their fixed width, so
           a wrapped line's number stays on its first visual row. flex-shrink and min-width: 0
           are what let the cell narrow below its content — a flex item refuses to otherwise.
           `anywhere` breaks inside a token with no spaces in it (base64, minified JS, a long
           URL), which is what keeps the row from overflowing no matter what it holds. */
        .diff-code {
            flex: 0 1 auto;
            min-width: 0;
            padding-right: 1rem;
            overflow-wrap: anywhere;
        }
        .diff-add { background: var(--diff-add-bg); }
        .diff-del { background: var(--diff-del-bg); }
        .diff-add .diff-marker { color: var(--diff-add-fg); font-weight: 600; }
        .diff-del .diff-marker { color: var(--diff-del-fg); font-weight: 600; }
        .diff-meta .diff-code { color: var(--text-tertiary); font-style: italic; }

        /* ---------- Diff line states ----------
           The wash is painted as a background IMAGE so it layers over the row's own
           added/removed tint instead of replacing it: which side a line is on must
           stay readable while it is selected or commented. */
        .diff-line { cursor: pointer; }
        .diff-line:hover { background-image: linear-gradient(var(--hl-wash), var(--hl-wash)); }

        /* ---------- Hide whitespace changes ----------
           Both halves of a whitespace-only pair carry data-ws-only from the renderer. Folding
           is done here and nowhere else: the rows stay in the DOM, so every data-line-index is
           unchanged and a comment anchored to a folded line still resolves.

           The deletion is hidden and the addition is dressed down to look like context, which
           leaves one readable row per pair — the shape `git diff -w` produces.

           An anchored line is exempt. A connector is drawn from the anchor's bounding box
           (alignAndDraw), and display:none collapses that box to the origin, so hiding a line
           someone has commented on would fling its connector to the corner of the page. Keeping
           it visible — still tinted as a deletion — also says why it survived the fold. */
        body.hide-ws .diff-line[data-ws-only].diff-del:not([data-anchor]):not([data-anchor-member]) {
            display: none;
        }
        body.hide-ws .diff-line[data-ws-only].diff-add { background: transparent; }
        body.hide-ws .diff-line[data-ws-only].diff-add .diff-marker {
            color: var(--text-tertiary);
            font-weight: 400;
        }
        .diff-line.range-selected,
        .diff-line.anchored-range {
            background-image: linear-gradient(var(--hl-wash), var(--hl-wash));
        }
        .diff-line.anchored-range[data-anchor] { box-shadow: inset 2px 0 0 var(--hl-mark); }
        /* A range is several rows, so its states are drawn as a band — a continuous left rule
           and a wash — rather than an outline per row, which would read as separate boxes
           stacked on top of each other instead of one selection. */
        .diff-line.active-comment-target { box-shadow: inset 2px 0 0 var(--hl-ring); }
        .diff-line.selected-target {
            background-image: linear-gradient(var(--hl-halo), var(--hl-halo));
            box-shadow: inset 3px 0 0 var(--hl-ring);
        }
        /* The comment indicator cannot hang in the right gutter here: the hunk scrolls horizontally
           and would clip it. Sticking it to the scrollport's right edge keeps it in view at
           any scroll position. */
        .diff-line .comment-indicator {
            position: sticky;
            right: 4px;
            top: auto;
            transform: none;
            margin-left: auto;
            align-self: center;
        }
        .diff-line .comment-indicator:hover { transform: scale(1.08); }

        /* The file header is a comment target too — for what is true of the change to the file
           rather than of any line in it. Same states as a line, drawn on the header's own bar. */
        .document-column.diff-mode h2.diff-file-header { cursor: pointer; }
        .document-column.diff-mode h2.diff-file-header:hover { background: var(--bg-tertiary); }
        .diff-file-header.anchored-range { box-shadow: inset 2px 0 0 var(--hl-mark); }
        .diff-file-header.active-comment-target { box-shadow: inset 2px 0 0 var(--hl-ring); }
        .diff-file-header.selected-target {
            background: hsl(var(--accent-hsl) / 0.10);
            box-shadow: inset 3px 0 0 var(--hl-ring);
        }
        /* Inside the header rather than out in the gutter: .diff-file clips its overflow. */
        .diff-file-header .comment-indicator {
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        #suggestionActions { margin-top: -0.4rem; }
        #quoteLinesBtn { width: 100%; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; letter-spacing: 0.04em; }

        /* ---------- Collapsing the contents rail ----------
           A diff is read across, so the contents rail is the first thing worth
           trading for width. Collapsed state rides a class on <body>, never an
           inline style, so the narrow-viewport rules can still override it. */
        .contents-rail-header {
            display: flex;
            align-items: flex-start;
            gap: calc(var(--u) * 1.5);
        }
        .contents-rail-header > h2 { flex: 1 1 auto; min-width: 0; }
        .rail-toggle {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-tertiary);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            line-height: 1;
            cursor: pointer;
            transition: color 0.18s, border-color 0.18s, background-color 0.18s;
        }
        .rail-toggle:hover { color: var(--text-primary); border-color: var(--border-color); background: var(--bg-secondary); }
        /* The restore handle only exists while the rail is gone. */
        #showRailBtn {
            display: none;
            position: fixed;
            top: calc(var(--u) * 2);
            left: calc(var(--u) * 2);
            z-index: 45;
            background: var(--bg-secondary);
            border-color: var(--border-color);
        }
        body.rail-collapsed .contents-rail { display: none; }
        body.rail-collapsed #showRailBtn { display: inline-flex; }

        /* ---------- Contents rail TOC ---------- */
        .rail-toc {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        .rail-toc-item {
            display: block;
            color: var(--text-tertiary);
            text-decoration: none;
            padding: 0.25rem 0.6rem;
            border-left: 1px solid transparent;
            transition: color 0.2s, border-color 0.2s;
            cursor: pointer;
            line-height: 1.4;
        }
        .rail-toc-item:hover {
            color: var(--text-secondary);
            text-decoration: none;
            border-left-color: var(--border-strong);
        }
        .rail-toc-item.active {
            color: var(--text-primary);
            font-weight: 500;
            border-left-color: var(--accent-color);
        }
        /* File list: a fixed-width mark column so the names line up and the list can be
           scanned down rather than read across. */
        .rail-toc-file { display: flex; align-items: baseline; gap: 0.45rem; }
        .file-status {
            flex: 0 0 auto;
            width: 0.9em;
            text-align: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            line-height: 1;
        }
        .file-status-added    { color: var(--diff-add-fg); }
        .file-status-deleted  { color: var(--diff-del-fg); }
        .file-status-renamed  { color: var(--text-secondary); }
        .file-status-modified { color: var(--text-tertiary); }
        .rail-toc-file-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

        .rail-toc-h1 { padding-left: 0.6rem; }
        .rail-toc-h2 { padding-left: 1.35rem; font-size: 0.8rem; }
        .rail-toc-h3 { padding-left: 2.1rem; font-size: 0.78rem; }

        /* ---------- Reading comfort in dark mode (compensate light-on-dark) ---------- */
        @media (prefers-color-scheme: dark) {
            .document-column p, .document-column li { line-height: 1.72; letter-spacing: 0.006em; }
        }

        /* ---------- Respect reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
        }

        /* ---------- Narrow viewports: collapse the rails ---------- */
        @media (max-width: 1080px) {
            body { display: block; }
            .layout { flex-direction: column; }
            .contents-rail, .feedback-panel {
                position: static;
                width: 100%;
                height: auto;
                border: none;
                border-bottom: 1px solid var(--border-color);
            }
            .feedback-panel { border-bottom: none; border-top: 1px solid var(--border-color); }
            /* The rails are stacked, so there is no horizontal edge left to drag. */
            body.is-served .panel-resize-handle { display: none; }
            /* The rails are stacked and the page scrolls again, so the column must not keep
               a second scrollport nested inside it. */
            .document-column { height: auto; overflow-y: visible; }
            /* A diff gives up its floor here too: body carries overflow-x: hidden, so a 480px
               min-width on a narrower phone does not scroll sideways — it silently clips the
               right edge of every line. */
            .document-column.diff-mode { min-width: 0; }
            .comment-indicator { right: 2px; }
        }
    </style>
</head>
<body class="{{if eq .Mode "diff"}}diff-review{{end}}">
    <div class="layout">
        <aside class="contents-rail" id="contentsRail">
            <div class="contents-rail-header">
                <h2>{{.Title}}</h2>
                <button type="button" class="rail-toggle" id="hideRailBtn" title="Hide contents" aria-label="Hide contents" aria-expanded="true" aria-controls="contentsRail">&#x2039;</button>
            </div>
            {{if eq .Mode "diff"}}
            <p style="font-size: 0.9rem;">{{.Stats}}</p>
            <label class="ws-toggle" title="Fold away changes that only add or remove whitespace">
                <input type="checkbox" id="hideWhitespaceToggle">
                <span>Hide whitespace</span>
            </label>
            {{else}}
            <p style="font-size: 0.9rem;">Version: {{.Version}}</p>
            <p style="font-size: 0.9rem;">Date: {{.Date}}</p>
            {{end}}
            <nav class="rail-toc" id="railToc">
                <!-- Dynamic headings loaded via JS -->
            </nav>
        </aside>

        <main class="document-column{{if eq .Mode "diff"}} diff-mode{{end}}" tabindex="0">
            {{.Body}}
        </main>

        <!-- Feedback Panel visible in Serve mode -->
        <div class="panel-resize-handle" id="panelResizeHandle" role="separator" aria-orientation="vertical" aria-label="Resize feedback panel" title="Drag to resize"></div>
        <aside class="feedback-panel" id="feedbackPanel" style="display: none;">
            <div class="feedback-header">Feedback<span class="live-dot offline" id="liveDot" title="Live connection"></span></div>

            <div class="reload-prompt" id="reloadPrompt">
                <span>Document updated by the agent.</span>
                <button type="button" id="reloadNowBtn">Reload</button>
            </div>

            <div class="change-summary" id="changeSummary" style="display: none;">
                <span class="change-summary-label">Agent changes</span>
                <div id="changeSummaryBody"></div>
            </div>

            <button type="button" class="pending-questions" id="pendingQuestions" style="display: none;"></button>

            <div id="commentContextContainer" style="display: none; font-size: 0.8rem; background: var(--bg-primary); padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 0.5rem;">
                <span style="font-weight: 600; color: var(--accent-color);">Target:</span>
                <span id="commentContextText" style="color: var(--text-primary); margin-left: 0.25rem; display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;"></span>
                <span id="clearContextBtn" style="float: right; cursor: pointer; color: var(--badge-must); font-weight: bold; font-size: 1.1rem; line-height: 1;" title="Clear targeting">&times;</span>
            </div>
            <div class="composer">
                <textarea id="composerInput" placeholder="Type a comment or request changes..."></textarea>
            </div>
            <div id="suggestionActions" style="display: none;">
                <button class="btn-sm btn-cancel" id="quoteLinesBtn" title="Insert the selected lines as a ```suggestion block">Quote lines as suggestion</button>
            </div>
            <button class="btn" id="addCommentBtn">Add Comment</button>
            
            <div id="commentsList" style="margin-top: 1rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
                <!-- Comments appear here -->
            </div>
            
            <div class="agent-activity" id="agentActivity" style="display: none;">
                <div class="agent-activity-label"><span class="agent-spinner"></span><span id="agentActivityState">Agent</span></div>
                <ul id="agentActivityList"></ul>
            </div>

            <button class="btn" id="submitFeedbackBtn">Submit Review</button>
            <button class="btn" id="endReviewBtn">End Review</button>
            <div id="statusMsg" class="feedback-success" style="display: none;"></div>
        </aside>
    </div>

    <button type="button" class="rail-toggle" id="showRailBtn" title="Show contents" aria-label="Show contents" aria-expanded="false" aria-controls="contentsRail">&#x203A;</button>

    <svg id="connectorOverlay" aria-hidden="true"></svg>

    <script>
        // Enable feedback UI if served
        const isServed = window.location.protocol.startsWith('http');
        if (isServed) {
            document.getElementById("feedbackPanel").style.display = "flex";
            // The handle's visibility rides a body class, not an inline style: the
            // narrow-viewport media query has to be able to hide it again, and an inline
            // display would outrank it.
            document.body.classList.add("is-served");
        }

        let comments = [];
        let summary = "";
        let editingIdx = -1;
        // Which resolved threads the reader has opened again. Held for the life of the page only:
        // a resolved thread is pruned on the submit after this one, so there is nothing here for a
        // reload to remember.
        let expandedResolved = new Set();
        // Which thread has its reply composer open. Separate from editingIdx: editing rewrites
        // the human's own head message, replying adds a turn to the thread.
        let replyingIdx = -1;
        // Which turn of which thread is being edited, as {idx, mi} — a message needs both
        // coordinates, so it cannot ride the single index the head comment uses.
        let editingMsg = null;
        let activeAnchor = "";
        let activeContext = "";
        // Diff mode only: the exact content of the lines being commented on. It travels with the
        // comment because it, not the line numbers, is what finds the lines again next round.
        let activeAnchorLines = [];
        // dirty = the user has unsent local changes; used to defer auto-reload so we never
        // discard an in-progress comment when the agent updates the document.
        let dirty = false;
        let pendingReload = false;

        function markDirty() { dirty = true; }

        // Grow a textarea to fit what is in it. A ```suggestion fence is many lines long, and a
        // three-line window turns writing one into scrolling through it. CSS max-height caps the
        // growth, so the height is only ever set up to that ceiling.
        function autoGrowTextarea(el) {
            if (!el) return;
            el.style.height = "auto";
            el.style.height = el.scrollHeight + "px";
        }

        // Tag commentable elements on load
        function initializeCommentableElements() {
            const container = document.querySelector('.document-column');
            if (!container) return;

            // Target block elements inside main spec body
