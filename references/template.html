<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        // Theme-aware Mermaid: follow the OS colour scheme instead of a fixed white canvas.
        (function () {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            mermaid.initialize({ startOnLoad: true, theme: prefersDark ? 'dark' : 'neutral' });
        })();
    </script>
    <!-- Prism.js Tomorrow Night Theme for Dark Mode -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" media="(prefers-color-scheme: dark)" />
    <!-- Prism.js Default Theme for Light Mode -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" media="(prefers-color-scheme: light)" />
    <!-- Prism.js Core and Autoloader JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js" defer></script>
    <style>
        /* ============================================================
           reviewer — premium minimal review screen
           Monochrome stone scale · opacity-based hierarchy · one accent
           Hierarchy comes from opacity/weight/space, never from a 2nd hue.
           ============================================================ */
        :root {
            color-scheme: light dark;

            /* Foreground / background as HSL components so we can derive
               the whole hierarchy from opacity alone. */
            --fg-hsl: 30 12% 14%;
            --bg-hsl: 40 20% 96.5%;

            --bg-primary:   hsl(var(--bg-hsl));       /* page — the reading canvas */
            --bg-secondary: hsl(36 15% 93%);          /* quiet surfaces (callout, panels) */
            --bg-tertiary:  hsl(36 13% 87.5%);        /* inline code, elevated chips */
            --code-bg:      hsl(38 20% 94.5%);

            --text-primary:   hsl(var(--fg-hsl));
            --text-body:      hsl(var(--fg-hsl) / 0.86);
            --text-secondary: hsl(var(--fg-hsl) / 0.62);
            --text-tertiary:  hsl(var(--fg-hsl) / 0.40);

            /* one restrained accent, used only for interactive affordances */
            --accent-hsl:   222 42% 43%;
            --accent-color: hsl(var(--accent-hsl));
            --accent-hover: hsl(222 46% 34%);
            --on-accent:    hsl(40 30% 98%);

            --border-color:  hsl(var(--fg-hsl) / 0.13);   /* hairline */
            --border-strong: hsl(var(--fg-hsl) / 0.24);
            --card-bg:       hsl(36 15% 93%);
            --glass-border:  hsl(var(--fg-hsl) / 0.08);

            /* functional feedback colours (kept muted, not decorative) */
            --badge-must:  hsl(2 52% 46%);    /* destructive affordance: delete, clear × */
            --badge-could: hsl(150 30% 37%);  /* success message */
            --badge-should:     var(--text-secondary);
            --badge-wont:       var(--text-tertiary);
            --badge-confirmed:  var(--text-secondary);
            --badge-inferred:   var(--text-secondary);
            --badge-assumption: var(--text-tertiary);

            --callout-info:    var(--accent-color);
            --callout-warning: hsl(38 58% 40%);
            --callout-danger:  hsl(2 52% 46%);

            --measure: 40rem;   /* ~70ch reading column */
            --radius: 3px;
            --u: 8px;           /* spacing base unit */

            scrollbar-color: hsl(var(--fg-hsl) / 0.22) transparent;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg-hsl: 40 22% 91%;
                --bg-hsl: 30 9% 8%;

                --bg-primary:   hsl(var(--bg-hsl));
                --bg-secondary: hsl(30 7% 11%);
                --bg-tertiary:  hsl(30 6% 16%);
                --code-bg:      hsl(30 8% 11.5%);

                --accent-hsl:   213 55% 73%;
                --accent-color: hsl(var(--accent-hsl));
                --accent-hover: hsl(213 62% 82%);
                --on-accent:    hsl(30 12% 9%);

                --border-color:  hsl(var(--fg-hsl) / 0.14);
                --border-strong: hsl(var(--fg-hsl) / 0.26);
                --card-bg:       hsl(30 7% 12.5%);
                --glass-border:  hsl(var(--fg-hsl) / 0.07);

                --badge-must:  hsl(4 58% 67%);
                --badge-could: hsl(150 38% 62%);
                --callout-warning: hsl(40 62% 62%);
                --callout-danger:  hsl(4 58% 67%);

                scrollbar-color: hsl(var(--fg-hsl) / 0.26) transparent;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 1.0625rem;               /* 17px reading base */
            line-height: 1.65;
            background-color: var(--bg-primary);
            color: var(--text-body);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            font-kerning: normal;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection { background: hsl(var(--accent-hsl) / 0.22); }

        :focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
            border-radius: 2px;
        }

        /* thin, neutral scrollbars */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: hsl(var(--fg-hsl) / 0.18); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: hsl(var(--fg-hsl) / 0.3); }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ---------- Layout ---------- */
        .layout {
            display: flex;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }

        /* Supporting rails recede: same canvas as the page, separated only by a hairline. */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            background-color: transparent;
            border-right: 1px solid var(--border-color);
            padding: calc(var(--u) * 5) calc(var(--u) * 3.5);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 2);
        }
        .sidebar > h2 {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin: 0;
            border: none;
            padding: 0;
            text-wrap: balance;
        }
        .sidebar > p {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            color: var(--text-tertiary);
            margin: 0;
        }

        /* The main column is the hero: a comfortable reading measure, centred. */
        .main-content {
            flex: 1;
            min-width: 0;
            max-width: calc(var(--measure) + var(--u) * 12);
            margin: 0 auto;
            padding: clamp(2.5rem, 5vw, 4.5rem) clamp(1.5rem, 4vw, 3rem);
            overflow-y: auto;
        }

        .feedback-panel {
            width: 340px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            background-color: transparent;
            border-left: 1px solid var(--border-color);
            padding: calc(var(--u) * 5) calc(var(--u) * 3);
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 2);
            overflow-y: auto;
        }

        /* ---------- Typography ---------- */
        h1, h2, h3, h4 {
            color: var(--text-primary);
            text-wrap: balance;
            letter-spacing: -0.015em;
        }
        h1 {
            font-size: 2.05rem;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.025em;
            margin: 0 0 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.25;
            margin: 3rem 0 1rem;
        }
        h3 {
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.3;
            margin: 2.25rem 0 0.75rem;
        }
        h4 {
            font-size: 1rem;
            font-weight: 600;
            margin: 1.75rem 0 0.5rem;
        }

        p { margin-bottom: 1.15rem; color: var(--text-body); text-wrap: pretty; }

        ul, ol { margin: 0 0 1.15rem 1.4rem; color: var(--text-body); }
        li { margin-bottom: 0.4rem; }

        a { color: var(--accent-color); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.18s; }
        a:hover { border-bottom-color: currentColor; }

        hr { border: none; border-top: 1px solid var(--border-color); margin: 2.5rem 0; }

        strong { font-weight: 600; color: var(--text-primary); }
        em { font-style: italic; }

        /* ---------- Code ---------- */
        code, pre, .monospace, pre[class*="language-"], code[class*="language-"] {
            font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace !important;
            font-size: 0.88em;
        }
        :not(pre) > code {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            font-size: 0.82em;
        }
        pre code, pre[class*="language-"] code[class*="language-"] {
            font-size: 1em !important;
            display: block;
            overflow-x: auto;
            width: 100%;
            background: transparent !important;
        }
        pre, pre[class*="language-"] {
            margin: 1.5rem 0 !important;
            border-radius: var(--radius);
            background: var(--code-bg) !important;
            border: 1px solid var(--border-color);
            overflow: visible !important; /* allow comment bubbles / indicators to overflow right */
            line-height: 1.55;
        }

        /* ---------- Badges (monochrome: form + opacity, not hue) ---------- */
        .badge {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 0.12rem 0.42rem;
            border-radius: 2px;
            margin-left: 0.45rem;
            vertical-align: middle;
            line-height: 1.5;
            white-space: nowrap;
            border: 1px solid var(--border-strong);
            color: var(--text-secondary);
            background: transparent;
        }
        /* priority — presence via fill / opacity */
        .badge-must   { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }
        .badge-should { color: var(--text-primary); border-color: var(--border-strong); }
        .badge-could  { color: var(--text-secondary); border-color: var(--border-color); }
        .badge-wont   { color: var(--text-tertiary); border-color: transparent; text-decoration: line-through; }
        /* status — differentiated by border style, still monochrome */
        .badge-confirmed  { color: var(--text-primary); border-style: solid; border-color: var(--border-strong); }
        .badge-inferred   { color: var(--text-secondary); border-style: dashed; }
        .badge-assumption { color: var(--text-tertiary); border-style: dotted; }

        /* ---------- Callouts (flat, hairline, single left rule) ---------- */
        .callout {
            padding: 1rem 1.25rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--callout-info);
            border-radius: var(--radius);
            margin: 1.75rem 0;
        }
        .callout > p { margin-bottom: 0.5rem; color: var(--text-body); }
        .callout > p:last-child { margin-bottom: 0; }
        .callout-info    { border-left-color: var(--accent-color); }
        .callout-warning { border-left-color: var(--callout-warning); }
        .callout-danger  { border-left-color: var(--callout-danger); }
        .callout-title {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.09em;
            color: var(--text-tertiary);
        }

        /* ---------- Tables ----------
           Wrap-to-fit instead of horizontal scroll: a scrolling table would
           clip the per-row comment bubble sitting in the right gutter. */
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.75rem 0;
            font-size: 0.92rem;
            font-variant-numeric: tabular-nums;
            table-layout: auto;
        }
        .spec-table th, .spec-table td {
            padding: 0.5rem 0.7rem;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            vertical-align: top;
            overflow-wrap: break-word;   /* break a word only when it would overflow — not mid-word for short words */
        }
        .spec-table th {
            font-weight: 500;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border-strong);
        }
        .spec-table tbody tr:last-child td { border-bottom: none; }
        /* inline code in cells: compact, and only long tokens (e.g. /api/paths) break */
        .spec-table :not(pre) > code { padding: 0.05rem 0.28rem; font-size: 0.8em; word-break: break-all; }

        /* ---------- Diagram (theme-aware, no forced white) ----------
           The figure stays full-column width with overflow VISIBLE so the
           comment bubble in the gutter is never clipped; the inner .mermaid
           carries the horizontal scroll for oversized diagrams. */
        .diagram-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: var(--radius);
            margin: 1.75rem 0;
            text-align: center;
            overflow: visible;
        }
        .diagram-container .mermaid {
            overflow-x: auto;
            max-width: 100%;
        }
        .diagram-container figcaption {
            margin-top: 0.85rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        /* ---------- Feedback panel ---------- */
        .feedback-header {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }
        .comment-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.65rem 0.75rem;
            margin-bottom: 0.85rem;
            transition: border-color 0.18s;
        }
        .comment-box:focus-within { border-color: var(--accent-color); }
        .comment-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: vertical;
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.5;
            outline: none;
            min-height: 80px;
        }
        .comment-box textarea::placeholder { color: var(--text-tertiary); }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.7rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid var(--border-strong);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: var(--radius);
            cursor: pointer;
            text-align: center;
            transition: background-color 0.18s, border-color 0.18s, transform 0.1s;
        }
        .btn:hover { background: var(--bg-secondary); border-color: var(--text-tertiary); }
        .btn:active { transform: translateY(1px); }
        #submitFeedbackBtn {
            background: var(--accent-color);
            color: var(--on-accent);
            border-color: var(--accent-color);
        }
        #submitFeedbackBtn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .feedback-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 0.7rem 0.8rem;
            padding-right: 46px;   /* room for edit + delete affordances */
            border-radius: var(--radius);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-body);
            position: relative;
        }
        .feedback-item .delete-btn {
            position: absolute;
            top: 8px;
            right: 9px;
            cursor: pointer;
            color: var(--badge-must);
            font-weight: bold;
            line-height: 1;
        }
        .feedback-item .edit-btn {
            position: absolute;
            top: 8px;
            right: 28px;
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            line-height: 1;
            user-select: none;
            transition: color 0.18s;
        }
        .feedback-item .edit-btn:hover { color: var(--accent-color); }
        .feedback-item.editing-mode {
            border-color: var(--accent-color);
            background: hsl(var(--accent-hsl) / 0.05);
        }
        .edit-textarea {
            width: 100%;
            min-height: 60px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.5;
            padding: 0.45rem;
            margin: 0.4rem 0;
            resize: vertical;
            outline: none;
            transition: border-color 0.18s;
        }
        .edit-textarea:focus { border-color: var(--accent-color); }
        .edit-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.25rem;
        }
        .btn-sm {
            padding: 0.28rem 0.7rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: var(--radius);
            cursor: pointer;
            border: 1px solid transparent;
            transition: background-color 0.18s, border-color 0.18s, opacity 0.18s;
        }
        .btn-save {
            background: var(--accent-color);
            color: var(--on-accent);
            border-color: var(--accent-color);
        }
        .btn-save:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-strong);
        }
        .btn-cancel:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .feedback-success {
            color: var(--badge-could);
            font-weight: 500;
            text-align: center;
        }

        /* ---------- Inline commenting affordances ---------- */
        .commentable-element {
            position: relative;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .commentable-element:hover {
            background-color: hsl(var(--accent-hsl) / 0.06) !important;
        }
        .commentable-element.active-comment-target {
            background-color: hsl(var(--accent-hsl) / 0.09) !important;
            border-left: 2px solid var(--accent-color) !important;
            padding-left: 0.5rem;
        }
        .commentable-element.has-comments-highlight {
            border-left: 2px dashed hsl(var(--accent-hsl) / 0.5);
            padding-left: 0.5rem;
        }
        .element-comment-indicator {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
            background: var(--accent-color);
            color: var(--on-accent);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            font-weight: 500;
            padding: 0.12rem 0.4rem;
            border-radius: 2px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
            z-index: 11;
        }
        .element-comment-indicator:hover {
            transform: translateY(-50%) scale(1.08);
            background-color: var(--accent-hover);
        }
        pre.commentable-element .element-comment-indicator {
            top: 1rem;
            transform: none;
        }
        pre.commentable-element .element-comment-indicator:hover { transform: scale(1.08); }
        .sidebar-comment-target {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--accent-color);
            background: hsl(var(--accent-hsl) / 0.08);
            padding: 0.25rem 0.5rem;
            border-radius: 2px;
            margin-bottom: 0.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: background-color 0.2s;
        }
        .sidebar-comment-target:hover { background: hsl(var(--accent-hsl) / 0.16); }

        /* ---------- Sidebar TOC ---------- */
        .sidebar-toc {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        .sidebar-toc-item {
            display: block;
            color: var(--text-tertiary);
            text-decoration: none;
            padding: 0.25rem 0.6rem;
            border-left: 1px solid transparent;
            transition: color 0.2s, border-color 0.2s;
            cursor: pointer;
            line-height: 1.4;
        }
        .sidebar-toc-item:hover {
            color: var(--text-secondary);
            text-decoration: none;
            border-left-color: var(--border-strong);
        }
        .sidebar-toc-item.active {
            color: var(--text-primary);
            font-weight: 500;
            border-left-color: var(--accent-color);
        }
        .sidebar-toc-h1 { padding-left: 0.6rem; }
        .sidebar-toc-h2 { padding-left: 1.35rem; font-size: 0.8rem; }
        .sidebar-toc-h3 { padding-left: 2.1rem; font-size: 0.78rem; }

        /* ---------- Reading comfort in dark mode (compensate light-on-dark) ---------- */
        @media (prefers-color-scheme: dark) {
            .main-content p, .main-content li { line-height: 1.72; letter-spacing: 0.006em; }
        }

        /* ---------- Respect reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
        }

        /* ---------- Narrow viewports: collapse the rails ---------- */
        @media (max-width: 1080px) {
            body { display: block; }
            .layout { flex-direction: column; max-width: 100%; }
            .sidebar, .feedback-panel {
                position: static;
                width: 100%;
                height: auto;
                border: none;
                border-bottom: 1px solid var(--border-color);
            }
            .feedback-panel { border-bottom: none; border-top: 1px solid var(--border-color); }
            .main-content { max-width: 46rem; }
            .element-comment-indicator { right: 2px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>{{.Title}}</h2>
            <p style="font-size: 0.9rem;">Version: {{.Version}}</p>
            <p style="font-size: 0.9rem;">Date: {{.Date}}</p>
            <nav class="sidebar-toc" id="sidebarToc">
                <!-- Dynamic headings loaded via JS -->
            </nav>
        </aside>

        <main class="main-content">
            {{.Body}}
        </main>

        <!-- Feedback Panel visible in Serve mode -->
        <aside class="feedback-panel" id="feedbackPanel" style="display: none;">
            <div class="feedback-header">Review Comments</div>
            <div id="commentContextContainer" style="display: none; font-size: 0.8rem; background: var(--bg-primary); padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 0.5rem;">
                <span style="font-weight: 600; color: var(--accent-color);">Target:</span>
                <span id="commentContextText" style="color: var(--text-primary); margin-left: 0.25rem; display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;"></span>
                <span id="clearContextBtn" style="float: right; cursor: pointer; color: var(--badge-must); font-weight: bold; font-size: 1.1rem; line-height: 1;" title="Clear targeting">&times;</span>
            </div>
            <div class="comment-box">
                <textarea id="commentInput" placeholder="Type a comment or request changes..."></textarea>
            </div>
            <button class="btn" id="addCommentBtn">Add Comment</button>
            
            <div id="commentsList" style="margin-top: 1rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
                <!-- Comments appear here -->
            </div>
            
            <button class="btn" id="submitFeedbackBtn">Submit Review</button>
            <div id="statusMsg" class="feedback-success" style="display: none;">Feedback submitted successfully! You can now safely close this browser tab.</div>
        </aside>
    </div>

    <script>
        // Enable feedback UI if served
        const isServed = window.location.protocol.startsWith('http');
        if (isServed) {
            document.getElementById("feedbackPanel").style.display = "flex";
        }

        let comments = [];
        let editingIdx = -1;
        let activeAnchor = "";
        let activeContext = "";

        // Tag commentable elements on load
        function initializeCommentableElements() {
            const container = document.querySelector('.main-content');
            if (!container) return;

            // Target block elements inside main spec body
            const selectors = 'p, li, tr, h1, h2, h3, h4, h5, h6, .callout, .diagram-container, pre';
            const elements = container.querySelectorAll(selectors);
            
            let elementIdx = 0;
            elements.forEach(el => {
                // Skip if inside/descendant of a code block (but allow pre itself)
                if (el.closest('code') || (el.tagName !== 'PRE' && el.closest('pre'))) {
                    return;
                }

                // Skip nested elements inside other commentable elements (e.g. p inside .callout, p inside tr)
                let isNested = false;
                let parent = el.parentElement;
                while (parent && parent !== container) {
                    if (parent.matches(selectors)) {
                        isNested = true;
                        break;
                    }
                    parent = parent.parentElement;
                }
                if (isNested) {
                    return;
                }

                const anchorId = `spec-element-${elementIdx++}`;
                el.setAttribute('data-anchor', anchorId);
                el.classList.add('commentable-element');

                // Click anywhere on the element to target it for a comment.
                // A drag that selects text must stay a selection, so bail when
                // a non-collapsed selection exists; also let interactive
                // children (links, the view-indicator) keep their own behaviour.
                el.addEventListener('mouseup', (e) => {
                    if (e.target.closest('a, .element-comment-indicator')) return;
                    if (!window.getSelection().isCollapsed) return;
                    setCommentTarget(anchorId, el.textContent.trim());
                });
            });
        }

        // Set active target for next comment
        function setCommentTarget(anchorId, text) {
            // Remove previous active state
            document.querySelectorAll('.active-comment-target').forEach(el => {
                el.classList.remove('active-comment-target');
            });

            activeAnchor = anchorId;
            // Shorten context snippet and collapse consecutive whitespaces/newlines to a single space
            activeContext = text.replace(/💬\s*$/, '').trim().replace(/\s+/g, ' ');
            if (activeContext.length > 60) {
                activeContext = activeContext.substring(0, 57) + '...';
            }

            const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
            if (targetEl) {
                targetEl.classList.add('active-comment-target');
            }

            const contextText = document.getElementById("commentContextText");
            contextText.textContent = activeContext;
            document.getElementById("commentContextContainer").style.display = "block";
            document.getElementById("commentInput").focus();
        }

        // Clear active target
        function clearCommentTarget() {
            document.querySelectorAll('.active-comment-target').forEach(el => {
                el.classList.remove('active-comment-target');
            });
            activeAnchor = "";
            activeContext = "";
            document.getElementById("commentContextContainer").style.display = "none";
        }

        document.getElementById("clearContextBtn").addEventListener("click", clearCommentTarget);

        // Fetch existing comments on load
        function loadExistingComments() {
            if (!isServed) return;

            fetch("/api/feedback")
                .then(res => res.json())
                .then(data => {
                    comments = data || [];
                    renderComments();
                    updateInlineIndicators();
                })
                .catch(err => console.error("Error loading feedback comments:", err));
        }

        // Render inline indicators next to commented elements
        function updateInlineIndicators() {
            // Clear existing indicators
            document.querySelectorAll('.element-comment-indicator').forEach(el => el.remove());
            document.querySelectorAll('.has-comments-highlight').forEach(el => el.classList.remove('has-comments-highlight'));

            const countsByAnchor = {};
            comments.forEach(c => {
                if (c.anchor) {
                    countsByAnchor[c.anchor] = (countsByAnchor[c.anchor] || 0) + 1;
                }
            });

            Object.entries(countsByAnchor).forEach(([anchorId, count]) => {
                const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
                if (targetEl) {
                    targetEl.classList.add('has-comments-highlight');

                    const indicator = document.createElement('span');
                    indicator.className = 'element-comment-indicator';
                    indicator.innerHTML = `💬 ${count}`;
                    indicator.title = `Click to view ${count} comment(s)`;
                    indicator.addEventListener('click', (e) => {
                        e.stopPropagation();
                        scrollToSidebarComment(anchorId);
                    });

                    // Prepend or append depending on tag to avoid text breakages
                    targetEl.appendChild(indicator);
                }
            });
        }

        // Scroll sidebar to first comment matching anchor
        function scrollToSidebarComment(anchorId) {
            const commentItems = Array.from(document.querySelectorAll('.feedback-item'));
            const match = commentItems.find(item => item.getAttribute('data-anchor') === anchorId);
            if (match) {
                match.scrollIntoView({ behavior: 'smooth', block: 'center' });
                match.style.outline = "2px solid var(--accent-color)";
                setTimeout(() => {
                    match.style.outline = "none";
                }, 2000);
            }
        }

        // Scroll spec body to target element
        function scrollToSpecElement(anchorId) {
            const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetEl.classList.add('active-comment-target');
                setTimeout(() => {
                    targetEl.classList.remove('active-comment-target');
                }, 2000);
            }
        }

        document.getElementById("addCommentBtn").addEventListener("click", () => {
            const input = document.getElementById("commentInput");
            const text = input.value.trim();
            if (text) {
                comments.push({
                    text: text,
                    timestamp: new Date().toISOString(),
                    anchor: activeAnchor,
                    context: activeContext
                });
                input.value = "";
                clearCommentTarget();
                renderComments();
                updateInlineIndicators();
            }
        });

        document.getElementById("commentInput").addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                document.getElementById("addCommentBtn").click();
            }
        });

        function renderComments() {
            const container = document.getElementById("commentsList");
            container.innerHTML = "";
            comments.forEach((c, idx) => {
                const item = document.createElement("div");
                item.className = "feedback-item";
                if (c.anchor) {
                    item.setAttribute('data-anchor', c.anchor);
                }

                if (idx === editingIdx) {
                    item.classList.add("editing-mode");

                    // Context preview if present
                    if (c.anchor && c.context) {
                        const targetIndicator = document.createElement("div");
                        targetIndicator.className = "sidebar-comment-target";
                        targetIndicator.textContent = `💬 On: ${c.context}`;
                        targetIndicator.addEventListener('click', () => {
                            scrollToSpecElement(c.anchor);
                        });
                        item.appendChild(targetIndicator);
                    }

                    // Textarea for editing
                    const textarea = document.createElement("textarea");
                    textarea.className = "edit-textarea";
                    textarea.value = c.text;
                    textarea.addEventListener("keydown", (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                            saveComment(idx, textarea.value.trim());
                        } else if (e.key === "Escape") {
                            cancelEdit();
                        }
                    });

                    // Buttons
                    const btnGroup = document.createElement("div");
                    btnGroup.className = "edit-actions";

                    const saveBtn = document.createElement("button");
                    saveBtn.className = "btn-sm btn-save";
                    saveBtn.textContent = "Save";
                    saveBtn.onclick = () => saveComment(idx, textarea.value.trim());

                    const cancelBtn = document.createElement("button");
                    cancelBtn.className = "btn-sm btn-cancel";
                    cancelBtn.textContent = "Cancel";
                    cancelBtn.onclick = () => cancelEdit();

                    btnGroup.appendChild(cancelBtn);
                    btnGroup.appendChild(saveBtn);

                    item.appendChild(textarea);
                    item.appendChild(btnGroup);

                    container.appendChild(item);
                    // Auto-focus the textarea
                    setTimeout(() => textarea.focus(), 0);
                } else {
                    const deleteBtn = document.createElement("span");
                    deleteBtn.className = "delete-btn";
                    deleteBtn.innerHTML = "&times;";
                    deleteBtn.title = "Delete comment";
                    deleteBtn.tabIndex = 0;
                    deleteBtn.onclick = () => deleteComment(idx);
                    deleteBtn.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            deleteComment(idx);
                        }
                    });

                    const editBtn = document.createElement("span");
                    editBtn.className = "edit-btn";
                    editBtn.innerHTML = "✎";
                    editBtn.title = "Edit comment";
                    editBtn.tabIndex = 0;
                    editBtn.onclick = () => startEdit(idx);
                    editBtn.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            startEdit(idx);
                        }
                    });

                    // Add context target indicator if present
                    if (c.anchor && c.context) {
                        const targetIndicator = document.createElement("div");
                        targetIndicator.className = "sidebar-comment-target";
                        targetIndicator.textContent = `💬 On: ${c.context}`;
                        targetIndicator.addEventListener('click', () => {
                            scrollToSpecElement(c.anchor);
                        });
                        item.appendChild(targetIndicator);
                    }

                    const p = document.createElement("p");
                    p.style.marginBottom = "0";
                    p.textContent = c.text;

                    item.appendChild(deleteBtn);
                    item.appendChild(editBtn);
                    item.appendChild(p);
                    container.appendChild(item);
                }
            });
        }

        window.startEdit = function(idx) {
            editingIdx = idx;
            renderComments();
        };

        window.saveComment = function(idx, newText) {
            if (!newText) {
                alert("Comment text cannot be empty.");
                return;
            }
            comments[idx].text = newText;
            comments[idx].timestamp = new Date().toISOString();
            editingIdx = -1;
            renderComments();
            updateInlineIndicators();
        };

        window.cancelEdit = function() {
            editingIdx = -1;
            renderComments();
        };

        window.deleteComment = function(idx) {
            comments.splice(idx, 1);
            if (editingIdx === idx) {
                editingIdx = -1;
            } else if (editingIdx > idx) {
                // Adjust editing index if we deleted an item before the editing one
                editingIdx--;
            }
            renderComments();
            updateInlineIndicators();
        };

        document.getElementById("submitFeedbackBtn").addEventListener("click", () => {
            if (comments.length === 0) {
                alert("Please add at least one comment before submitting.");
                return;
            }
            
            document.getElementById("submitFeedbackBtn").disabled = true;
            fetch("/api/feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(comments)
            }).then(res => {
                if (res.ok) {
                    document.getElementById("statusMsg").textContent = "Feedback submitted successfully! You can now safely close this browser tab.";
                    document.getElementById("statusMsg").style.display = "block";
                    setTimeout(() => {
                        window.close();
                    }, 2000);
                } else {
                    alert("Error submitting feedback.");
                    document.getElementById("submitFeedbackBtn").disabled = false;
                }
            }).catch(err => {
                alert("Error: " + err);
                document.getElementById("submitFeedbackBtn").disabled = false;
            });
        });

        let isProgrammaticScroll = false; // Flag to prevent scroll-spy hijacking during clicks
        let programmaticScrollTimeout = null;
        let activeScrollEndHandler = null;

        // Helper to clean up programmatic scroll state safely
        function clearProgrammaticScrollState() {
            if (programmaticScrollTimeout) {
                clearTimeout(programmaticScrollTimeout);
                programmaticScrollTimeout = null;
            }
            if (activeScrollEndHandler) {
                window.removeEventListener("scrollend", activeScrollEndHandler);
                activeScrollEndHandler = null;
            }
            isProgrammaticScroll = false;
        }

        function initializeTableOfContents() {
            const tocContainer = document.getElementById("sidebarToc");
            const mainContent = document.querySelector(".main-content");
            if (!tocContainer || !mainContent) return;

            tocContainer.innerHTML = "";

            // 1. Fetch all headings (h1, h2, h3)
            const headings = Array.from(mainContent.querySelectorAll("h1, h2, h3"));
            
            // Pre-fill usedIds with all existing DOM IDs to prevent collisions
            const usedIds = new Set(Array.from(document.querySelectorAll("[id]")).map(el => el.id));

            function slugify(text) {
                const cleanText = text.replace(/💬/g, "").replace(/\[.*?\]/g, "").trim();
                let slug = cleanText.toLowerCase()
                    .replace(/[^\w\s-]/g, "")
                    .replace(/\s+/g, "-")
                    .replace(/-+/g, "-");
                if (!slug) slug = "section";
                
                let uniqueSlug = slug;
                let counter = 1;
                while (usedIds.has(uniqueSlug)) {
                    uniqueSlug = `${slug}-${counter}`;
                    counter++;
                }
                usedIds.add(uniqueSlug);
                return uniqueSlug;
            }

            headings.forEach((heading, idx) => {
                // Ensure heading has ID for anchoring
                if (!heading.id) {
                    heading.id = slugify(heading.textContent);
                } else {
                    usedIds.add(heading.id);
                }

                // Create TOC link
                const link = document.createElement("a");
                link.href = `#${heading.id}`;
                link.className = `sidebar-toc-item sidebar-toc-${heading.tagName.toLowerCase()}`;
                if (idx === 0) {
                    link.classList.add("active");
                }
                
                // Clean heading text for display in TOC
                const text = heading.textContent.replace(/💬/g, "").trim();
                link.textContent = text;

                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    clearProgrammaticScrollState();

                    isProgrammaticScroll = true;
                    heading.scrollIntoView({ behavior: "smooth", block: "start" });
                    history.pushState(null, null, `#${heading.id}`);
                    setActiveTOCItem(link);

                    activeScrollEndHandler = () => clearProgrammaticScrollState();
                    window.addEventListener("scrollend", activeScrollEndHandler);
                    programmaticScrollTimeout = setTimeout(clearProgrammaticScrollState, 1000);
                });

                tocContainer.appendChild(link);
            });

            function setActiveTOCItem(activeLink) {
                tocContainer.querySelectorAll(".sidebar-toc-item").forEach(item => {
                    item.classList.remove("active");
                });
                activeLink.classList.add("active");
            }

            // 2. Scroll-Spy implementation using IntersectionObserver
            const observerOptions = {
                root: null,
                rootMargin: "0px 0px -80% 0px",
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                if (isProgrammaticScroll) return; // Ignore observer events while scrolling from click

                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        const activeLink = tocContainer.querySelector(`a[href="#${id}"]`);
                        if (activeLink) {
                            setActiveTOCItem(activeLink);
                            activeLink.scrollIntoView({ behavior: "smooth", block: "nearest" });
                        }
                    }
                });
            }, observerOptions);

            headings.forEach(heading => observer.observe(heading));

            // Cache the first and last links to avoid DOM queries on scroll
            const firstLink = tocContainer.querySelector(".sidebar-toc-item");
            const lastLink = tocContainer.querySelector(".sidebar-toc-item:last-child");

            // Fallback for highlighting the first item near top of the page, or the last item at the bottom
            window.addEventListener("scroll", () => {
                if (isProgrammaticScroll) return;

                if (window.scrollY < 50) {
                    if (firstLink) {
                        setActiveTOCItem(firstLink);
                    }
                } else if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 10) {
                    if (lastLink) {
                        setActiveTOCItem(lastLink);
                    }
                }
            });
        }

        // Initialize elements and load existing comments on page start
        initializeCommentableElements();
        loadExistingComments();
        // Initialize Table of Contents
        initializeTableOfContents();

        // Handle initial URL hash scroll if present
        if (window.location.hash) {
            const targetId = decodeURIComponent(window.location.hash.substring(1));
            const targetEl = document.getElementById(targetId);
            if (targetEl) {
                setTimeout(() => {
                    targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                }, 200); // Small delay to let browser stabilize layout
            }
        }
    </script>
</body>
</html>
