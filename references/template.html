<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        // Theme-aware Mermaid: follow the OS colour scheme instead of a fixed white canvas.
        (function () {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            mermaid.initialize({ startOnLoad: true, theme: prefersDark ? 'dark' : 'neutral' });
        })();
    </script>
    <!-- Prism.js Tomorrow Night Theme for Dark Mode -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" media="(prefers-color-scheme: dark)" />
    <!-- Prism.js Default Theme for Light Mode -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" media="(prefers-color-scheme: light)" />
    <!-- Prism.js Core and Autoloader JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js" defer></script>
    <style>
        /* ============================================================
           reviewer — premium minimal review screen
           Monochrome stone scale · opacity-based hierarchy · one accent
           Hierarchy comes from opacity/weight/space, never from a 2nd hue.
           ============================================================ */
        :root {
            color-scheme: light dark;

            /* Foreground / background as HSL components so we can derive
               the whole hierarchy from opacity alone. */
            --fg-hsl: 30 12% 14%;
            --bg-hsl: 40 20% 96.5%;

            --bg-primary:   hsl(var(--bg-hsl));       /* page — the reading canvas */
            --bg-secondary: hsl(36 15% 93%);          /* quiet surfaces (callout, panels) */
            --bg-tertiary:  hsl(36 13% 87.5%);        /* inline code, elevated chips */
            --code-bg:      hsl(38 20% 94.5%);

            --text-primary:   hsl(var(--fg-hsl));
            --text-body:      hsl(var(--fg-hsl) / 0.86);
            --text-secondary: hsl(var(--fg-hsl) / 0.62);
            --text-tertiary:  hsl(var(--fg-hsl) / 0.40);

            /* one restrained accent, used only for interactive affordances */
            --accent-hsl:   222 42% 43%;
            --accent-color: hsl(var(--accent-hsl));
            --accent-hover: hsl(222 46% 34%);
            --on-accent:    hsl(40 30% 98%);

            --border-color:  hsl(var(--fg-hsl) / 0.13);   /* hairline */
            --border-strong: hsl(var(--fg-hsl) / 0.24);
            --card-bg:       hsl(36 15% 93%);
            --glass-border:  hsl(var(--fg-hsl) / 0.08);

            /* functional feedback colours (kept muted, not decorative) */
            --badge-must:  hsl(2 52% 46%);    /* destructive affordance: delete, clear × */
            --badge-could: hsl(150 30% 37%);  /* success message */
            --badge-should:     var(--text-secondary);
            --badge-wont:       var(--text-tertiary);
            --badge-confirmed:  var(--text-secondary);
            --badge-inferred:   var(--text-secondary);
            --badge-assumption: var(--text-tertiary);

            --callout-info:    var(--accent-color);
            --callout-warning: hsl(38 58% 40%);
            --callout-danger:  hsl(2 52% 46%);

            --measure: 40rem;   /* ~70ch reading column */
            --radius: 3px;
            --u: 8px;           /* spacing base unit */

            scrollbar-color: hsl(var(--fg-hsl) / 0.22) transparent;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg-hsl: 40 22% 91%;
                --bg-hsl: 30 9% 8%;

                --bg-primary:   hsl(var(--bg-hsl));
                --bg-secondary: hsl(30 7% 11%);
                --bg-tertiary:  hsl(30 6% 16%);
                --code-bg:      hsl(30 8% 11.5%);

                --accent-hsl:   213 55% 73%;
                --accent-color: hsl(var(--accent-hsl));
                --accent-hover: hsl(213 62% 82%);
                --on-accent:    hsl(30 12% 9%);

                --border-color:  hsl(var(--fg-hsl) / 0.14);
                --border-strong: hsl(var(--fg-hsl) / 0.26);
                --card-bg:       hsl(30 7% 12.5%);
                --glass-border:  hsl(var(--fg-hsl) / 0.07);

                --badge-must:  hsl(4 58% 67%);
                --badge-could: hsl(150 38% 62%);
                --callout-warning: hsl(40 62% 62%);
                --callout-danger:  hsl(4 58% 67%);

                scrollbar-color: hsl(var(--fg-hsl) / 0.26) transparent;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 1.0625rem;               /* 17px reading base */
            line-height: 1.65;
            background-color: var(--bg-primary);
            color: var(--text-body);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            font-kerning: normal;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection { background: hsl(var(--accent-hsl) / 0.22); }

        :focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
            border-radius: 2px;
        }

        /* thin, neutral scrollbars */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: hsl(var(--fg-hsl) / 0.18); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: hsl(var(--fg-hsl) / 0.3); }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ---------- Layout ---------- */
        .layout {
            display: flex;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }

        /* Supporting rails recede: same canvas as the page, separated only by a hairline. */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            background-color: transparent;
            border-right: 1px solid var(--border-color);
            padding: calc(var(--u) * 5) calc(var(--u) * 3.5);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 2);
        }
        .sidebar > h2 {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin: 0;
            border: none;
            padding: 0;
            text-wrap: balance;
        }
        .sidebar > p {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            color: var(--text-tertiary);
            margin: 0;
        }

        /* The main column is the hero: a comfortable reading measure, centred. */
        .main-content {
            flex: 1;
            min-width: 0;
            max-width: calc(var(--measure) + var(--u) * 12);
            margin: 0 auto;
            padding: clamp(2.5rem, 5vw, 4.5rem) clamp(1.5rem, 4vw, 3rem);
            overflow-y: auto;
        }

        .feedback-panel {
            width: 340px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            background-color: transparent;
            border-left: 1px solid var(--border-color);
            padding: calc(var(--u) * 5) calc(var(--u) * 3);
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 2);
            overflow-y: auto;
        }

        /* ---------- Typography ---------- */
        h1, h2, h3, h4 {
            color: var(--text-primary);
            text-wrap: balance;
            letter-spacing: -0.015em;
        }
        h1 {
            font-size: 2.05rem;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.025em;
            margin: 0 0 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.25;
            margin: 3rem 0 1rem;
        }
        h3 {
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.3;
            margin: 2.25rem 0 0.75rem;
        }
        h4 {
            font-size: 1rem;
            font-weight: 600;
            margin: 1.75rem 0 0.5rem;
        }

        p { margin-bottom: 1.15rem; color: var(--text-body); text-wrap: pretty; }

        ul, ol { margin: 0 0 1.15rem 1.4rem; color: var(--text-body); }
        li { margin-bottom: 0.4rem; }

        a { color: var(--accent-color); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.18s; }
        a:hover { border-bottom-color: currentColor; }

        hr { border: none; border-top: 1px solid var(--border-color); margin: 2.5rem 0; }

        strong { font-weight: 600; color: var(--text-primary); }
        em { font-style: italic; }

        /* ---------- Code ---------- */
        code, pre, .monospace, pre[class*="language-"], code[class*="language-"] {
            font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace !important;
            font-size: 0.88em;
        }
        :not(pre) > code {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            font-size: 0.82em;
        }
        pre code, pre[class*="language-"] code[class*="language-"] {
            font-size: 1em !important;
            display: block;
            overflow-x: auto;
            width: 100%;
            background: transparent !important;
        }
        pre, pre[class*="language-"] {
            margin: 1.5rem 0 !important;
            border-radius: var(--radius);
            background: var(--code-bg) !important;
            border: 1px solid var(--border-color);
            overflow: visible !important; /* allow comment bubbles / indicators to overflow right */
            line-height: 1.55;
        }

        /* ---------- Badges (monochrome: form + opacity, not hue) ---------- */
        .badge {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 0.12rem 0.42rem;
            border-radius: 2px;
            margin-left: 0.45rem;
            vertical-align: middle;
            line-height: 1.5;
            white-space: nowrap;
            border: 1px solid var(--border-strong);
            color: var(--text-secondary);
            background: transparent;
        }
        /* priority — presence via fill / opacity */
        .badge-must   { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }
        .badge-should { color: var(--text-primary); border-color: var(--border-strong); }
        .badge-could  { color: var(--text-secondary); border-color: var(--border-color); }
        .badge-wont   { color: var(--text-tertiary); border-color: transparent; text-decoration: line-through; }
        /* status — differentiated by border style, still monochrome */
        .badge-confirmed  { color: var(--text-primary); border-style: solid; border-color: var(--border-strong); }
        .badge-inferred   { color: var(--text-secondary); border-style: dashed; }
        .badge-assumption { color: var(--text-tertiary); border-style: dotted; }

        /* ---------- Callouts (flat, hairline, single left rule) ---------- */
        .callout {
            padding: 1rem 1.25rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--callout-info);
            border-radius: var(--radius);
            margin: 1.75rem 0;
        }
        .callout > p { margin-bottom: 0.5rem; color: var(--text-body); }
        .callout > p:last-child { margin-bottom: 0; }
        .callout-info    { border-left-color: var(--accent-color); }
        .callout-warning { border-left-color: var(--callout-warning); }
        .callout-danger  { border-left-color: var(--callout-danger); }
        .callout-title {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.09em;
            color: var(--text-tertiary);
        }

        /* ---------- Tables ----------
           Wrap-to-fit instead of horizontal scroll: a scrolling table would
           clip the per-row comment bubble sitting in the right gutter. */
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.75rem 0;
            font-size: 0.92rem;
            font-variant-numeric: tabular-nums;
            table-layout: auto;
        }
        .spec-table th, .spec-table td {
            padding: 0.5rem 0.7rem;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            vertical-align: top;
            overflow-wrap: break-word;   /* break a word only when it would overflow — not mid-word for short words */
        }
        .spec-table th {
            font-weight: 500;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border-strong);
        }
        .spec-table tbody tr:last-child td { border-bottom: none; }
        /* inline code in cells: compact, and only long tokens (e.g. /api/paths) break */
        .spec-table :not(pre) > code { padding: 0.05rem 0.28rem; font-size: 0.8em; word-break: break-all; }

        /* ---------- Diagram (theme-aware, no forced white) ----------
           The figure stays full-column width with overflow VISIBLE so the
           comment bubble in the gutter is never clipped; the inner .mermaid
           carries the horizontal scroll for oversized diagrams. */
        .diagram-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: var(--radius);
            margin: 1.75rem 0;
            text-align: center;
            overflow: visible;
        }
        .diagram-container .mermaid {
            overflow-x: auto;
            max-width: 100%;
        }
        .diagram-container figcaption {
            margin-top: 0.85rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        /* ---------- Feedback panel ---------- */
        .feedback-header {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }
        .comment-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.65rem 0.75rem;
            margin-bottom: 0.85rem;
            transition: border-color 0.18s;
        }
        .comment-box:focus-within { border-color: var(--accent-color); }
        .comment-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: vertical;
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.5;
            outline: none;
            min-height: 80px;
        }
        .comment-box textarea::placeholder { color: var(--text-tertiary); }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.7rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid var(--border-strong);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: var(--radius);
            cursor: pointer;
            text-align: center;
            transition: background-color 0.18s, border-color 0.18s, transform 0.1s;
        }
        .btn:hover { background: var(--bg-secondary); border-color: var(--text-tertiary); }
        .btn:active { transform: translateY(1px); }
        #submitFeedbackBtn {
            background: var(--accent-color);
            color: var(--on-accent);
            border-color: var(--accent-color);
        }
        #submitFeedbackBtn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .feedback-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 0.7rem 0.8rem;
            padding-right: 46px;   /* room for edit + delete affordances */
            border-radius: var(--radius);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-body);
            position: relative;
        }
        .feedback-item .delete-btn {
            position: absolute;
            top: 8px;
            right: 9px;
            cursor: pointer;
            color: var(--badge-must);
            font-weight: bold;
            line-height: 1;
        }
        .feedback-item .edit-btn {
            position: absolute;
            top: 8px;
            right: 28px;
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            line-height: 1;
            user-select: none;
            transition: color 0.18s;
        }
        .feedback-item .edit-btn:hover { color: var(--accent-color); }
        .feedback-item.editing-mode {
            border-color: var(--accent-color);
            background: hsl(var(--accent-hsl) / 0.05);
        }
        .edit-textarea {
            width: 100%;
            min-height: 60px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.5;
            padding: 0.45rem;
            margin: 0.4rem 0;
            resize: vertical;
            outline: none;
            transition: border-color 0.18s;
        }
        .edit-textarea:focus { border-color: var(--accent-color); }
        .edit-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.25rem;
        }
        .btn-sm {
            padding: 0.28rem 0.7rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: var(--radius);
            cursor: pointer;
            border: 1px solid transparent;
            transition: background-color 0.18s, border-color 0.18s, opacity 0.18s;
        }
        .btn-save {
            background: var(--accent-color);
            color: var(--on-accent);
            border-color: var(--accent-color);
        }
        .btn-save:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-strong);
        }
        .btn-cancel:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .feedback-success {
            color: var(--badge-could);
            font-weight: 500;
            text-align: center;
        }

        /* ---------- Live loop: change summary, agent replies, resolve, session ---------- */

        /* Agent's page-level summary of the latest pass — quiet callout, single left rule. */
        .change-summary {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--accent-color);
            border-radius: var(--radius);
            padding: 0.7rem 0.85rem;
            font-size: 0.88rem;
            line-height: 1.55;
            color: var(--text-body);
            /* enter softly when the agent's summary appears after a reload */
            animation: summary-enter 0.32s cubic-bezier(0.2, 0, 0, 1);
        }
        .change-summary .change-summary-label {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.35rem;
        }
        .change-summary p { margin: 0 0 0.5rem; color: var(--text-body); }
        .change-summary p:last-child { margin-bottom: 0; }

        @keyframes summary-enter {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* author tag on each comment */
        .comment-author {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.3rem;
        }

        /* agent reply threaded beneath a human comment. Concentric: parent radius 3px, inner 2px. */
        .agent-reply {
            margin-top: 0.55rem;
            padding: 0.5rem 0.6rem;
            background: var(--bg-tertiary);
            border-left: 2px solid var(--text-tertiary);
            border-radius: 2px;
            font-size: 0.86rem;
            line-height: 1.5;
            color: var(--text-body);
            animation: reply-enter 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .agent-reply .agent-reply-label {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.25rem;
        }
        .agent-reply p { margin: 0; }

        @keyframes reply-enter {
            from { opacity: 0; transform: translateY(-3px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* resolve toggle — a real checkbox, 40px+ hit area via the label */
        .resolve-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.55rem;
            min-height: 24px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            cursor: pointer;
            user-select: none;
            transition: color 0.18s;
        }
        .resolve-toggle:hover { color: var(--text-secondary); }
        .resolve-toggle input {
            width: 15px;
            height: 15px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* a comment the user marked resolved recedes but stays visible for the cycle */
        .feedback-item.resolved {
            opacity: 0.6;
        }
        .feedback-item.resolved > p { text-decoration: line-through; text-decoration-color: var(--text-tertiary); }
        .feedback-item.resolved .resolve-toggle { color: var(--badge-could); }

        /* End Review — quiet secondary action, distinct from Submit */
        #endReviewBtn {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-color);
            margin-top: 0.5rem;
        }
        #endReviewBtn:hover { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--text-tertiary); }
        .btn:active { transform: scale(0.98); }

        /* reload prompt shown only when auto-reload is deferred to protect unsent edits */
        .reload-prompt {
            display: none;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 0.55rem 0.7rem;
            font-size: 0.82rem;
            color: var(--text-body);
            animation: summary-enter 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .reload-prompt button {
            margin-left: auto;
            padding: 0.28rem 0.6rem;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: var(--radius);
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: var(--on-accent);
            cursor: pointer;
            transition: background-color 0.18s;
        }
        .reload-prompt button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        /* subtle live-connection dot next to the panel header */
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--badge-could);
            margin-left: 0.5rem;
            vertical-align: middle;
            transition: background-color 0.3s;
        }
        .live-dot.offline { background: var(--text-tertiary); }

        /* agent activity — live progress between submit and the reply landing */
        .agent-activity {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--text-tertiary);
            border-radius: var(--radius);
            padding: 0.6rem 0.75rem;
            font-size: 0.84rem;
            animation: summary-enter 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .agent-activity.working { border-left-color: var(--accent-color); }
        .agent-activity-label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.4rem;
        }
        #agentActivityList {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        #agentActivityList li {
            color: var(--text-secondary);
            line-height: 1.45;
            margin: 0;
            padding-left: 0.9rem;
            position: relative;
            animation: reply-enter 0.25s cubic-bezier(0.2, 0, 0, 1);
        }
        #agentActivityList li::before {
            content: "\203A";
            position: absolute;
            left: 0;
            color: var(--text-tertiary);
        }
        #agentActivityList li:last-child { color: var(--text-primary); }
        .agent-spinner {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-color);
            flex-shrink: 0;
            animation: agent-pulse 1s ease-in-out infinite;
        }
        .agent-activity:not(.working) .agent-spinner { animation: none; background: var(--text-tertiary); }
        @keyframes agent-pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50%      { opacity: 1;   transform: scale(1); }
        }
        @media (prefers-reduced-motion: reduce) { .agent-spinner { animation: none !important; } }

        /* ---------- Inline commenting affordances ---------- */
        .commentable-element {
            position: relative;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .commentable-element:hover {
            background-color: hsl(var(--accent-hsl) / 0.06) !important;
        }
        .commentable-element.active-comment-target {
            background-color: hsl(var(--accent-hsl) / 0.09) !important;
            border-left: 2px solid var(--accent-color) !important;
            padding-left: 0.5rem;
        }
        .commentable-element.has-comments-highlight {
            border-left: 2px dashed hsl(var(--accent-hsl) / 0.5);
            padding-left: 0.5rem;
        }
        .element-comment-indicator {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
            background: var(--accent-color);
            color: var(--on-accent);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            font-weight: 500;
            padding: 0.12rem 0.4rem;
            border-radius: 2px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
            z-index: 11;
        }
        .element-comment-indicator:hover {
            transform: translateY(-50%) scale(1.08);
            background-color: var(--accent-hover);
        }
        pre.commentable-element .element-comment-indicator {
            top: 1rem;
            transform: none;
        }
        pre.commentable-element .element-comment-indicator:hover { transform: scale(1.08); }
        /* ---------- Connector line (comment ⇄ target element) ----------
           A viewport-fixed SVG overlay draws a line between a selected comment
           and its target element. Selecting always scrolls the element into
           view, so a fixed layer (recomputed on scroll/resize) is enough. */
        #connectorOverlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 40;
            overflow: visible;
        }
        #connectorOverlay path {
            fill: none;
            stroke: var(--accent-color);
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
        }
        #connectorOverlay path.persistent { stroke-width: 1.75; opacity: 0.9; }
        #connectorOverlay path.transient  { stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.55; }
        #connectorOverlay circle { fill: var(--accent-color); }
        #connectorOverlay circle.transient { opacity: 0.55; }
        #connectorOverlay stop { stop-color: var(--accent-color); }

        @keyframes connector-draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
        #connectorOverlay path.persistent.drawing {
            stroke-dasharray: var(--len);
            animation: connector-draw 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* selected comment card + its target element share the accent lift */
        .feedback-item.selected { border-color: var(--accent-color); background: hsl(var(--accent-hsl) / 0.06); }
        .commentable-element.selected-target {
            background-color: hsl(var(--accent-hsl) / 0.09) !important;
            border-left: 2px solid var(--accent-color);
            padding-left: 0.5rem;
        }

        /* ---------- Sidebar TOC ---------- */
        .sidebar-toc {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        .sidebar-toc-item {
            display: block;
            color: var(--text-tertiary);
            text-decoration: none;
            padding: 0.25rem 0.6rem;
            border-left: 1px solid transparent;
            transition: color 0.2s, border-color 0.2s;
            cursor: pointer;
            line-height: 1.4;
        }
        .sidebar-toc-item:hover {
            color: var(--text-secondary);
            text-decoration: none;
            border-left-color: var(--border-strong);
        }
        .sidebar-toc-item.active {
            color: var(--text-primary);
            font-weight: 500;
            border-left-color: var(--accent-color);
        }
        .sidebar-toc-h1 { padding-left: 0.6rem; }
        .sidebar-toc-h2 { padding-left: 1.35rem; font-size: 0.8rem; }
        .sidebar-toc-h3 { padding-left: 2.1rem; font-size: 0.78rem; }

        /* ---------- Reading comfort in dark mode (compensate light-on-dark) ---------- */
        @media (prefers-color-scheme: dark) {
            .main-content p, .main-content li { line-height: 1.72; letter-spacing: 0.006em; }
        }

        /* ---------- Respect reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
        }

        /* ---------- Narrow viewports: collapse the rails ---------- */
        @media (max-width: 1080px) {
            body { display: block; }
            .layout { flex-direction: column; max-width: 100%; }
            .sidebar, .feedback-panel {
                position: static;
                width: 100%;
                height: auto;
                border: none;
                border-bottom: 1px solid var(--border-color);
            }
            .feedback-panel { border-bottom: none; border-top: 1px solid var(--border-color); }
            .main-content { max-width: 46rem; }
            .element-comment-indicator { right: 2px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>{{.Title}}</h2>
            <p style="font-size: 0.9rem;">Version: {{.Version}}</p>
            <p style="font-size: 0.9rem;">Date: {{.Date}}</p>
            <nav class="sidebar-toc" id="sidebarToc">
                <!-- Dynamic headings loaded via JS -->
            </nav>
        </aside>

        <main class="main-content">
            {{.Body}}
        </main>

        <!-- Feedback Panel visible in Serve mode -->
        <aside class="feedback-panel" id="feedbackPanel" style="display: none;">
            <div class="feedback-header">Review Comments<span class="live-dot offline" id="liveDot" title="Live connection"></span></div>

            <div class="reload-prompt" id="reloadPrompt">
                <span>Document updated by the agent.</span>
                <button type="button" id="reloadNowBtn">Reload</button>
            </div>

            <div class="change-summary" id="changeSummary" style="display: none;">
                <span class="change-summary-label">Agent changes</span>
                <div id="changeSummaryBody"></div>
            </div>

            <div id="commentContextContainer" style="display: none; font-size: 0.8rem; background: var(--bg-primary); padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 0.5rem;">
                <span style="font-weight: 600; color: var(--accent-color);">Target:</span>
                <span id="commentContextText" style="color: var(--text-primary); margin-left: 0.25rem; display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;"></span>
                <span id="clearContextBtn" style="float: right; cursor: pointer; color: var(--badge-must); font-weight: bold; font-size: 1.1rem; line-height: 1;" title="Clear targeting">&times;</span>
            </div>
            <div class="comment-box">
                <textarea id="commentInput" placeholder="Type a comment or request changes..."></textarea>
            </div>
            <button class="btn" id="addCommentBtn">Add Comment</button>
            
            <div id="commentsList" style="margin-top: 1rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
                <!-- Comments appear here -->
            </div>
            
            <div class="agent-activity" id="agentActivity" style="display: none;">
                <div class="agent-activity-label"><span class="agent-spinner"></span><span id="agentActivityState">Agent</span></div>
                <ul id="agentActivityList"></ul>
            </div>

            <button class="btn" id="submitFeedbackBtn">Submit Review</button>
            <button class="btn" id="endReviewBtn">End Review</button>
            <div id="statusMsg" class="feedback-success" style="display: none;"></div>
        </aside>
    </div>

    <svg id="connectorOverlay" aria-hidden="true"></svg>

    <script>
        // Enable feedback UI if served
        const isServed = window.location.protocol.startsWith('http');
        if (isServed) {
            document.getElementById("feedbackPanel").style.display = "flex";
        }

        let comments = [];
        let summary = "";
        let editingIdx = -1;
        let activeAnchor = "";
        let activeContext = "";
        // dirty = the user has unsent local changes; used to defer auto-reload so we never
        // discard an in-progress comment when the agent updates the document.
        let dirty = false;
        let pendingReload = false;

        function markDirty() { dirty = true; }

        // Tag commentable elements on load
        function initializeCommentableElements() {
            const container = document.querySelector('.main-content');
            if (!container) return;

            // Target block elements inside main spec body
            const selectors = 'p, li, tr, h1, h2, h3, h4, h5, h6, .callout, .diagram-container, pre';
            const elements = container.querySelectorAll(selectors);
            
            let elementIdx = 0;
            elements.forEach(el => {
                // Skip if inside/descendant of a code block (but allow pre itself)
                if (el.closest('code') || (el.tagName !== 'PRE' && el.closest('pre'))) {
                    return;
                }

                // Skip nested elements inside other commentable elements (e.g. p inside .callout, p inside tr)
                let isNested = false;
                let parent = el.parentElement;
                while (parent && parent !== container) {
                    if (parent.matches(selectors)) {
                        isNested = true;
                        break;
                    }
                    parent = parent.parentElement;
                }
                if (isNested) {
                    return;
                }

                const anchorId = `spec-element-${elementIdx++}`;
                el.setAttribute('data-anchor', anchorId);
                el.classList.add('commentable-element');

                // Click anywhere on the element to target it for a comment.
                // A drag that selects text must stay a selection, so bail when
                // a non-collapsed selection exists; also let interactive
                // children (links, the view-indicator) keep their own behaviour.
                el.addEventListener('mouseup', (e) => {
                    if (e.target.closest('a, .element-comment-indicator')) return;
                    if (!window.getSelection().isCollapsed) return;
                    // Mode A: a commented element selects its comment (shows the line);
                    // an uncommented element targets a new comment (line to the input box).
                    if (isCommented(anchorId)) {
                        selectComment(anchorId);
                    } else {
                        setCommentTarget(anchorId, el.textContent.trim());
                    }
                });
                // Hover a commented element to preview its connector line.
                el.addEventListener('mouseenter', () => { if (isCommented(anchorId)) hoverConnector(anchorId); });
                el.addEventListener('mouseleave', () => { if (isCommented(anchorId)) unhoverConnector(); });
            });
        }

        // Set active target for next comment
        function setCommentTarget(anchorId, text) {
            // Remove previous active state
            document.querySelectorAll('.active-comment-target').forEach(el => {
                el.classList.remove('active-comment-target');
            });

            activeAnchor = anchorId;
            // Shorten context snippet and collapse consecutive whitespaces/newlines to a single space
            activeContext = text.replace(/💬\s*$/, '').trim().replace(/\s+/g, ' ');
            if (activeContext.length > 60) {
                activeContext = activeContext.substring(0, 57) + '...';
            }

            const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
            if (targetEl) {
                targetEl.classList.add('active-comment-target');
            }

            const contextText = document.getElementById("commentContextText");
            contextText.textContent = activeContext;
            document.getElementById("commentContextContainer").style.display = "block";
            document.getElementById("commentInput").focus();

            // Draw a connector from the targeted element to the comment input box.
            clearConnectionMarks();
            connection = { kind: "compose", anchor: anchorId };
            hoverAnchor = null;
            drawConnection(connection, true);
        }

        // Clear active target
        function clearCommentTarget() {
            document.querySelectorAll('.active-comment-target').forEach(el => {
                el.classList.remove('active-comment-target');
            });
            activeAnchor = "";
            activeContext = "";
            document.getElementById("commentContextContainer").style.display = "none";

            if (connection && connection.kind === "compose") {
                connection = null;
                clearConnector();
            }
        }

        document.getElementById("clearContextBtn").addEventListener("click", clearCommentTarget);

        // Fetch existing comments on load. The server returns {comments, summary}.
        function loadExistingComments() {
            if (!isServed) return;

            fetch("/api/feedback")
                .then(res => res.json())
                .then(data => {
                    comments = (data && data.comments) || [];
                    summary = (data && data.summary) || "";
                    renderSummary();
                    renderComments();
                    updateInlineIndicators();
                })
                .catch(err => console.error("Error loading feedback comments:", err));
        }

        // Render the agent's page-level change summary above the comment box.
        function renderSummary() {
            const box = document.getElementById("changeSummary");
            const body = document.getElementById("changeSummaryBody");
            if (!box || !body) return;
            if (summary && summary.trim()) {
                body.textContent = summary.trim();
                box.style.display = "block";
            } else {
                box.style.display = "none";
            }
        }

        // Agent activity: live progress shown on the page while the agent works (no full reload).
        function renderAgentStatus(msg) {
            const box = document.getElementById("agentActivity");
            const list = document.getElementById("agentActivityList");
            const stateEl = document.getElementById("agentActivityState");
            if (!box || !list) return;
            if (msg && msg.state === "working") {
                box.style.display = "block";
                box.classList.add("working");
                if (stateEl) stateEl.textContent = "Agent working…";
                appendActivity(list, msg.message);
            } else {
                box.classList.remove("working");
                box.style.display = "none";
                list.innerHTML = "";
            }
        }

        function appendActivity(list, text) {
            if (!text || !text.trim()) return;
            const last = list.lastElementChild;
            if (last && last.textContent === text.trim()) return; // collapse duplicate consecutive updates
            const li = document.createElement("li");
            li.textContent = text.trim();
            list.appendChild(li);
        }

        // Restore agent status on (re)load — a mid-round reload must not lose the "working" indicator.
        function loadAgentStatus() {
            if (!isServed) return;
            fetch("/api/status")
                .then(res => res.json())
                .then(s => { if (s && s.state === "working") renderAgentStatus({ kind: "status", state: "working", message: s.message }); })
                .catch(() => {});
        }

        // Render inline indicators next to commented elements
        function updateInlineIndicators() {
            // Clear existing indicators
            document.querySelectorAll('.element-comment-indicator').forEach(el => el.remove());
            document.querySelectorAll('.has-comments-highlight').forEach(el => el.classList.remove('has-comments-highlight'));

            const countsByAnchor = {};
            comments.forEach(c => {
                if (c.anchor) {
                    countsByAnchor[c.anchor] = (countsByAnchor[c.anchor] || 0) + 1;
                }
            });

            Object.entries(countsByAnchor).forEach(([anchorId, count]) => {
                const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
                if (targetEl) {
                    targetEl.classList.add('has-comments-highlight');

                    const indicator = document.createElement('span');
                    indicator.className = 'element-comment-indicator';
                    indicator.innerHTML = `💬 ${count}`;
                    indicator.title = `Click to view ${count} comment(s)`;
                    indicator.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectComment(anchorId);
                    });

                    // Prepend or append depending on tag to avoid text breakages
                    targetEl.appendChild(indicator);
                }
            });
            reconcileConnection();
        }

        // Scroll sidebar to first comment matching anchor
        function scrollToSidebarComment(anchorId) {
            const commentItems = Array.from(document.querySelectorAll('.feedback-item'));
            const match = commentItems.find(item => item.getAttribute('data-anchor') === anchorId);
            if (match) {
                match.scrollIntoView({ behavior: 'smooth', block: 'center' });
                match.style.outline = "2px solid var(--accent-color)";
                setTimeout(() => {
                    match.style.outline = "none";
                }, 2000);
            }
        }

        // Scroll spec body to target element
        function scrollToSpecElement(anchorId) {
            const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetEl.classList.add('active-comment-target');
                setTimeout(() => {
                    targetEl.classList.remove('active-comment-target');
                }, 2000);
            }
        }

        // ---------- Connector line: comment ⇄ target element ----------
        // A single SVG overlay draws one line at a time. State:
        //   connection: null | { kind: "selected" | "compose", anchor }
        //   hoverAnchor: anchor previewed on hover (only when nothing is selected)
        const connectorSvg = document.getElementById("connectorOverlay");
        const SVG_NS = "http://www.w3.org/2000/svg";
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let connection = null;
        let hoverAnchor = null;

        function anchorElement(anchor) { return document.querySelector(`.main-content [data-anchor="${anchor}"]`); }
        function commentCard(anchor) { return document.querySelector(`.feedback-item[data-anchor="${anchor}"]`); }
        function isCommented(anchor) { return !!anchor && comments.some(c => c.anchor === anchor); }

        // Clamp a y coordinate to the viewport so an endpoint whose element has
        // scrolled off-screen still terminates at the screen edge, keeping the
        // line visible and pointing toward the (off-screen) element.
        const CONNECTOR_MARGIN = 8;
        function clampY(y) { return Math.max(CONNECTOR_MARGIN, Math.min(window.innerHeight - CONNECTOR_MARGIN, y)); }

        // Element side of the line starts at the RIGHT EDGE of the 💬 badge when
        // present; uncommented elements have no badge, so use the element's edge.
        // Horizontal position is unaffected by vertical scroll; y is clamped.
        function connectorStart(el) {
            const badge = el.querySelector(".element-comment-indicator");
            const r = (badge || el).getBoundingClientRect();
            const rawY = r.top + r.height / 2;
            const y = clampY(rawY);
            return { x: r.right + 4, y, offscreen: y !== rawY };
        }
        function connectorEnd(rect) {
            const rawY = rect.top + rect.height / 2;
            const y = clampY(rawY);
            return { x: rect.left - 6, y, offscreen: y !== rawY };
        }

        function clearConnector() { if (connectorSvg) connectorSvg.innerHTML = ""; }

        function paintConnector(start, end, kind, animate) {
            if (!connectorSvg) return;
            connectorSvg.innerHTML = "";
            const dx = Math.max(40, (end.x - start.x) * 0.5);
            const d = `M ${start.x} ${start.y} C ${start.x + dx} ${start.y}, ${end.x - dx} ${end.y}, ${end.x} ${end.y}`;
            const len = Math.hypot(end.x - start.x, end.y - start.y) + Math.abs(end.y - start.y);
            const base = kind === "persistent" ? 0.9 : 0.55;
            const path = document.createElementNS(SVG_NS, "path");
            path.setAttribute("d", d);
            path.classList.add(kind);

            // When an endpoint's element is off-screen (clamped to the edge),
            // fade the stroke to transparent toward that edge so the line looks
            // like it slips off the top/bottom rather than stopping abruptly.
            if (start.offscreen || end.offscreen) {
                const grad = document.createElementNS(SVG_NS, "linearGradient");
                grad.id = "connectorFade";
                grad.setAttribute("gradientUnits", "userSpaceOnUse");
                grad.setAttribute("x1", start.x); grad.setAttribute("y1", start.y);
                grad.setAttribute("x2", end.x);   grad.setAttribute("y2", end.y);
                [
                    { o: 0,    op: start.offscreen ? 0 : base },
                    { o: 0.22, op: base },
                    { o: 0.78, op: base },
                    { o: 1,    op: end.offscreen ? 0 : base },
                ].forEach(s => {
                    const st = document.createElementNS(SVG_NS, "stop");
                    st.setAttribute("offset", s.o);
                    st.setAttribute("stop-opacity", s.op);
                    grad.appendChild(st);
                });
                const defs = document.createElementNS(SVG_NS, "defs");
                defs.appendChild(grad);
                connectorSvg.appendChild(defs);
                path.style.stroke = "url(#connectorFade)";
                path.style.opacity = "1"; // gradient stop-opacity carries the fade
            }

            if (kind === "persistent" && animate && !prefersReducedMotion) {
                path.style.setProperty("--len", len.toFixed(0));
                path.classList.add("drawing");
            }
            connectorSvg.appendChild(path);

            // Endpoint dots — omit the dot at an off-screen (clamped) end.
            const dots = [];
            if (!start.offscreen) dots.push([start.x, start.y]);
            if (!end.offscreen) dots.push([end.x, end.y]);
            dots.forEach(([cx, cy]) => {
                const dot = document.createElementNS(SVG_NS, "circle");
                dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
                dot.setAttribute("r", kind === "persistent" ? 3 : 2.5);
                if (kind === "transient") dot.classList.add("transient");
                connectorSvg.appendChild(dot);
            });
        }

        function drawConnection(conn, animate) {
            const el = anchorElement(conn.anchor);
            if (!el) { clearConnector(); return; }
            let endRect;
            if (conn.kind === "selected") {
                const card = commentCard(conn.anchor);
                if (!card) { clearConnector(); return; }
                endRect = card.getBoundingClientRect();
            } else {
                const box = document.querySelector(".comment-box");
                if (!box) { clearConnector(); return; }
                endRect = box.getBoundingClientRect();
            }
            paintConnector(connectorStart(el), connectorEnd(endRect), "persistent", animate);
        }

        function refreshConnector() {
            if (connection) { drawConnection(connection, false); return; }
            if (hoverAnchor) {
                const el = anchorElement(hoverAnchor);
                const card = commentCard(hoverAnchor);
                if (el && card) {
                    paintConnector(connectorStart(el), connectorEnd(card.getBoundingClientRect()), "transient", false);
                } else {
                    clearConnector();
                }
                return;
            }
            clearConnector();
        }

        function clearConnectionMarks() {
            document.querySelectorAll(".feedback-item.selected").forEach(n => n.classList.remove("selected"));
            document.querySelectorAll(".commentable-element.selected-target").forEach(n => n.classList.remove("selected-target"));
        }

        // Scroll the body so the target element's vertical centre lines up with
        // the comment card's centre, then draw the (animated) line.
        function alignAndDraw(el, card) {
            const er = el.getBoundingClientRect();
            const cr = card.getBoundingClientRect();
            const delta = (er.top + er.height / 2) - (cr.top + cr.height / 2);
            const finish = () => { if (connection) drawConnection(connection, true); };
            if (Math.abs(delta) < 2 || prefersReducedMotion) {
                window.scrollBy(0, delta);
                finish();
            } else {
                window.scrollTo({ top: window.scrollY + delta, behavior: "smooth" });
                setTimeout(finish, 320);
            }
        }

        function selectComment(anchor) {
            if (connection && connection.kind === "selected" && connection.anchor === anchor) {
                clearConnection();
                return;
            }
            clearCommentTarget();       // drop any compose state / line first
            clearConnectionMarks();
            connection = { kind: "selected", anchor };
            hoverAnchor = null;
            const card = commentCard(anchor);
            const el = anchorElement(anchor);
            if (card) card.classList.add("selected");
            if (el && card) {
                el.classList.add("selected-target");
                alignAndDraw(el, card);
            }
        }

        function clearConnection() {
            connection = null;
            clearConnectionMarks();
            clearConnector();
        }

        function hoverConnector(anchor) { hoverAnchor = anchor; if (!connection) refreshConnector(); }
        function unhoverConnector() { hoverAnchor = null; if (!connection) clearConnector(); }

        // Re-apply the active connection after comment list / indicators re-render.
        // Drops the connection if its comment or element no longer exists.
        function reconcileConnection() {
            if (connection && connection.kind === "selected") {
                const card = commentCard(connection.anchor);
                const el = anchorElement(connection.anchor);
                if (!card || !el) { clearConnection(); return; }
                clearConnectionMarks();
                card.classList.add("selected");
                el.classList.add("selected-target");
            }
            refreshConnector();
        }

        // Keep the line attached while scrolling / resizing.
        let connectorRaf = null;
        function scheduleConnectorRefresh() {
            if (connectorRaf) return;
            connectorRaf = requestAnimationFrame(() => { connectorRaf = null; refreshConnector(); });
        }
        window.addEventListener("scroll", scheduleConnectorRefresh, true);
        window.addEventListener("resize", scheduleConnectorRefresh);
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") { clearConnection(); clearCommentTarget(); } });
        // Click on empty space (not a comment / element / composer) deselects.
        document.addEventListener("click", (e) => {
            if (e.target.closest(".feedback-item, .commentable-element, .comment-box, #commentContextContainer")) return;
            if (connection && connection.kind === "selected") clearConnection();
        });

        document.getElementById("addCommentBtn").addEventListener("click", () => {
            const input = document.getElementById("commentInput");
            const text = input.value.trim();
            if (text) {
                comments.push({
                    text: text,
                    timestamp: new Date().toISOString(),
                    anchor: activeAnchor,
                    context: activeContext,
                    author: "human",
                    status: "open"
                });
                input.value = "";
                markDirty();
                clearCommentTarget();
                renderComments();
                updateInlineIndicators();
            }
        });

        document.getElementById("commentInput").addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                document.getElementById("addCommentBtn").click();
            }
        });
        // Any text in the composer counts as an unsent change (guards auto-reload).
        document.getElementById("commentInput").addEventListener("input", (e) => {
            if (e.target.value.trim()) markDirty();
        });

        // Sidebar display order follows the target block's appearance in the document, so the
        // panel can be read top-down alongside the spec. `comments` itself (and the feedback
        // file written from it) keeps creation order — only the rendering is reordered, and the
        // original array index travels with each entry so the idx-based handlers stay valid.
        const UNPLACED_RANK = Number.MAX_SAFE_INTEGER;
        function commentsInAppearanceOrder() {
            const order = new Map();
            document.querySelectorAll('.main-content [data-anchor]').forEach((el, i) => {
                order.set(el.getAttribute('data-anchor'), i);
            });
            // No anchor, or an anchor whose element is gone after an agent edit: sink to the end.
            const rank = c => (c.anchor && order.has(c.anchor)) ? order.get(c.anchor) : UNPLACED_RANK;
            // sort is stable, so comments sharing a rank (same block, or both unplaced) stay in creation order.
            return comments
                .map((c, idx) => ({ c, idx }))
                .sort((a, b) => rank(a.c) - rank(b.c));
        }

        function renderComments() {
            const container = document.getElementById("commentsList");
            container.innerHTML = "";
            commentsInAppearanceOrder().forEach(({ c, idx }) => {
                const item = document.createElement("div");
                item.className = "feedback-item";
                if (c.anchor) {
                    item.setAttribute('data-anchor', c.anchor);
                }

                if (idx === editingIdx) {
                    item.classList.add("editing-mode");

                    // Textarea for editing
                    const textarea = document.createElement("textarea");
                    textarea.className = "edit-textarea";
                    textarea.value = c.text;
                    textarea.addEventListener("keydown", (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                            saveComment(idx, textarea.value.trim());
                        } else if (e.key === "Escape") {
                            cancelEdit();
                        }
                    });

                    // Buttons
                    const btnGroup = document.createElement("div");
                    btnGroup.className = "edit-actions";

                    const saveBtn = document.createElement("button");
                    saveBtn.className = "btn-sm btn-save";
                    saveBtn.textContent = "Save";
                    saveBtn.onclick = () => saveComment(idx, textarea.value.trim());

                    const cancelBtn = document.createElement("button");
                    cancelBtn.className = "btn-sm btn-cancel";
                    cancelBtn.textContent = "Cancel";
                    cancelBtn.onclick = () => cancelEdit();

                    btnGroup.appendChild(cancelBtn);
                    btnGroup.appendChild(saveBtn);

                    item.appendChild(textarea);
                    item.appendChild(btnGroup);

                    container.appendChild(item);
                    // Auto-focus the textarea
                    setTimeout(() => textarea.focus(), 0);
                } else {
                    const deleteBtn = document.createElement("span");
                    deleteBtn.className = "delete-btn";
                    deleteBtn.innerHTML = "&times;";
                    deleteBtn.title = "Delete comment";
                    deleteBtn.tabIndex = 0;
                    deleteBtn.onclick = () => deleteComment(idx);
                    deleteBtn.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            deleteComment(idx);
                        }
                    });

                    const editBtn = document.createElement("span");
                    editBtn.className = "edit-btn";
                    editBtn.innerHTML = "✎";
                    editBtn.title = "Edit comment";
                    editBtn.tabIndex = 0;
                    editBtn.onclick = () => startEdit(idx);
                    editBtn.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            startEdit(idx);
                        }
                    });

                    const authorTag = document.createElement("div");
                    authorTag.className = "comment-author";
                    authorTag.textContent = (c.author === "agent") ? "Agent" : "You";

                    const p = document.createElement("p");
                    p.style.marginBottom = "0";
                    p.textContent = c.text;

                    item.appendChild(deleteBtn);
                    item.appendChild(editBtn);
                    item.appendChild(authorTag);
                    item.appendChild(p);

                    // Agent's reply, threaded beneath the human comment.
                    if (c.reply && c.reply.trim()) {
                        const reply = document.createElement("div");
                        reply.className = "agent-reply";
                        const label = document.createElement("span");
                        label.className = "agent-reply-label";
                        label.textContent = "Agent reply";
                        const rp = document.createElement("p");
                        rp.textContent = c.reply;
                        reply.appendChild(label);
                        reply.appendChild(rp);
                        item.appendChild(reply);

                        // Resolve toggle — the human confirms the fix; the agent never self-resolves.
                        const toggleLabel = document.createElement("label");
                        toggleLabel.className = "resolve-toggle";
                        const checkbox = document.createElement("input");
                        checkbox.type = "checkbox";
                        checkbox.checked = (c.status === "resolved");
                        const toggleText = document.createElement("span");
                        toggleText.textContent = checkbox.checked ? "Resolved" : "Mark resolved";
                        checkbox.addEventListener("change", () => {
                            comments[idx].status = checkbox.checked ? "resolved" : "open";
                            markDirty();
                            renderComments();
                        });
                        toggleLabel.appendChild(checkbox);
                        toggleLabel.appendChild(toggleText);
                        item.appendChild(toggleLabel);
                    }

                    if (c.status === "resolved") {
                        item.classList.add("resolved");
                    }

                    // Click the card to select it (and draw its line); hover to preview.
                    // Ignore clicks on the card's own controls.
                    if (c.anchor) {
                        item.addEventListener("click", (e) => {
                            if (e.target.closest(".delete-btn, .edit-btn, .resolve-toggle, input, button, textarea, a")) return;
                            selectComment(c.anchor);
                        });
                        item.addEventListener("mouseenter", () => { if (!connection) hoverConnector(c.anchor); });
                        item.addEventListener("mouseleave", () => { if (!connection) unhoverConnector(); });
                    }

                    container.appendChild(item);
                }
            });
            reconcileConnection();
        }

        window.startEdit = function(idx) {
            editingIdx = idx;
            renderComments();
        };

        window.saveComment = function(idx, newText) {
            if (!newText) {
                alert("Comment text cannot be empty.");
                return;
            }
            comments[idx].text = newText;
            comments[idx].timestamp = new Date().toISOString();
            editingIdx = -1;
            renderComments();
            updateInlineIndicators();
        };

        window.cancelEdit = function() {
            editingIdx = -1;
            renderComments();
        };

        window.deleteComment = function(idx) {
            comments.splice(idx, 1);
            if (editingIdx === idx) {
                editingIdx = -1;
            } else if (editingIdx > idx) {
                // Adjust editing index if we deleted an item before the editing one
                editingIdx--;
            }
            renderComments();
            updateInlineIndicators();
        };

        document.getElementById("submitFeedbackBtn").addEventListener("click", () => {
            if (comments.length === 0) {
                alert("Please add at least one comment before submitting.");
                return;
            }

            const btn = document.getElementById("submitFeedbackBtn");
            btn.disabled = true;
            // Start a fresh round: the previous agent summary is stale until the agent runs again.
            fetch("/api/feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ comments: comments, summary: "" })
            }).then(res => {
                if (res.ok) {
                    dirty = false;
                    summary = "";
                    renderSummary();
                    btn.disabled = false;
                    // The live activity panel (right above the button) is the reaction to Submit;
                    // the agent's own status updates then refine it.
                    renderAgentStatus({ kind: "status", state: "working", message: "送信しました。エージェントの応答を待っています…" });
                    // The server will push status updates and a reload as the agent works.
                } else {
                    alert("Error submitting feedback.");
                    btn.disabled = false;
                }
            }).catch(err => {
                alert("Error: " + err);
                btn.disabled = false;
            });
        });

        // End Review — stop the live session (separate from Submit).
        document.getElementById("endReviewBtn").addEventListener("click", () => {
            if (!confirm("End this review session? The review server will stop.")) return;
            const finish = () => {
                const status = document.getElementById("statusMsg");
                status.textContent = "Review ended. You can close this tab.";
                status.style.display = "block";
                setTimeout(() => window.close(), 1200);
            };
            fetch("/api/close", { method: "POST" }).then(finish).catch(finish);
        });

        // Live reload over SSE: the server pushes "reload" when the agent edits the
        // document or writes replies. Defer the reload if the user has unsent edits.
        function hasUnsentEdits() {
            return dirty || editingIdx !== -1 || document.getElementById("commentInput").value.trim() !== "";
        }

        function connectLiveReload() {
            if (!isServed || typeof EventSource === "undefined") return;
            const dot = document.getElementById("liveDot");
            const es = new EventSource("/api/events");
            es.onopen = () => { if (dot) dot.classList.remove("offline"); };
            es.onerror = () => { if (dot) dot.classList.add("offline"); };
            es.onmessage = (e) => {
                let msg;
                try { msg = JSON.parse(e.data); } catch (_) { return; }
                if (msg.kind === "status") {
                    renderAgentStatus(msg);
                    return;
                }
                if (msg.kind === "reload") {
                    if (hasUnsentEdits()) {
                        pendingReload = true;
                        document.getElementById("reloadPrompt").style.display = "flex";
                    } else {
                        window.location.reload();
                    }
                }
            };
        }

        document.getElementById("reloadNowBtn").addEventListener("click", () => window.location.reload());

        let isProgrammaticScroll = false; // Flag to prevent scroll-spy hijacking during clicks
        let programmaticScrollTimeout = null;
        let activeScrollEndHandler = null;

        // Helper to clean up programmatic scroll state safely
        function clearProgrammaticScrollState() {
            if (programmaticScrollTimeout) {
                clearTimeout(programmaticScrollTimeout);
                programmaticScrollTimeout = null;
            }
            if (activeScrollEndHandler) {
                window.removeEventListener("scrollend", activeScrollEndHandler);
                activeScrollEndHandler = null;
            }
            isProgrammaticScroll = false;
        }

        function initializeTableOfContents() {
            const tocContainer = document.getElementById("sidebarToc");
            const mainContent = document.querySelector(".main-content");
            if (!tocContainer || !mainContent) return;

            tocContainer.innerHTML = "";

            // 1. Fetch all headings (h1, h2, h3)
            const headings = Array.from(mainContent.querySelectorAll("h1, h2, h3"));
            
            // Pre-fill usedIds with all existing DOM IDs to prevent collisions
            const usedIds = new Set(Array.from(document.querySelectorAll("[id]")).map(el => el.id));

            function slugify(text) {
                const cleanText = text.replace(/💬/g, "").replace(/\[.*?\]/g, "").trim();
                let slug = cleanText.toLowerCase()
                    .replace(/[^\w\s-]/g, "")
                    .replace(/\s+/g, "-")
                    .replace(/-+/g, "-");
                if (!slug) slug = "section";
                
                let uniqueSlug = slug;
                let counter = 1;
                while (usedIds.has(uniqueSlug)) {
                    uniqueSlug = `${slug}-${counter}`;
                    counter++;
                }
                usedIds.add(uniqueSlug);
                return uniqueSlug;
            }

            headings.forEach((heading, idx) => {
                // Ensure heading has ID for anchoring
                if (!heading.id) {
                    heading.id = slugify(heading.textContent);
                } else {
                    usedIds.add(heading.id);
                }

                // Create TOC link
                const link = document.createElement("a");
                link.href = `#${heading.id}`;
                link.className = `sidebar-toc-item sidebar-toc-${heading.tagName.toLowerCase()}`;
                if (idx === 0) {
                    link.classList.add("active");
                }
                
                // Clean heading text for display in TOC
                const text = heading.textContent.replace(/💬/g, "").trim();
                link.textContent = text;

                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    clearProgrammaticScrollState();

                    isProgrammaticScroll = true;
                    heading.scrollIntoView({ behavior: "smooth", block: "start" });
                    history.pushState(null, null, `#${heading.id}`);
                    setActiveTOCItem(link);

                    activeScrollEndHandler = () => clearProgrammaticScrollState();
                    window.addEventListener("scrollend", activeScrollEndHandler);
                    programmaticScrollTimeout = setTimeout(clearProgrammaticScrollState, 1000);
                });

                tocContainer.appendChild(link);
            });

            function setActiveTOCItem(activeLink) {
                tocContainer.querySelectorAll(".sidebar-toc-item").forEach(item => {
                    item.classList.remove("active");
                });
                activeLink.classList.add("active");
            }

            // 2. Scroll-Spy implementation using IntersectionObserver
            const observerOptions = {
                root: null,
                rootMargin: "0px 0px -80% 0px",
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                if (isProgrammaticScroll) return; // Ignore observer events while scrolling from click

                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        const activeLink = tocContainer.querySelector(`a[href="#${id}"]`);
                        if (activeLink) {
                            setActiveTOCItem(activeLink);
                            activeLink.scrollIntoView({ behavior: "smooth", block: "nearest" });
                        }
                    }
                });
            }, observerOptions);

            headings.forEach(heading => observer.observe(heading));

            // Cache the first and last links to avoid DOM queries on scroll
            const firstLink = tocContainer.querySelector(".sidebar-toc-item");
            const lastLink = tocContainer.querySelector(".sidebar-toc-item:last-child");

            // Fallback for highlighting the first item near top of the page, or the last item at the bottom
            window.addEventListener("scroll", () => {
                if (isProgrammaticScroll) return;

                if (window.scrollY < 50) {
                    if (firstLink) {
                        setActiveTOCItem(firstLink);
                    }
                } else if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 10) {
                    if (lastLink) {
                        setActiveTOCItem(lastLink);
                    }
                }
            });
        }

        // Initialize elements and load existing comments on page start
        initializeCommentableElements();
        loadExistingComments();
        // Initialize Table of Contents
        initializeTableOfContents();
        // Connect the live-reload stream (serve mode only)
        connectLiveReload();
        // Restore any in-progress agent status (e.g. after a mid-round reload)
        loadAgentStatus();

        // Handle initial URL hash scroll if present
        if (window.location.hash) {
            const targetId = decodeURIComponent(window.location.hash.substring(1));
            const targetEl = document.getElementById(targetId);
            if (targetEl) {
                setTimeout(() => {
                    targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                }, 200); // Small delay to let browser stabilize layout
            }
        }
    </script>
</body>
</html>
