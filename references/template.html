            const selectors = 'p, li, tr, h1, h2, h3, h4, h5, h6, .callout, .diagram-container, pre';
            const elements = container.querySelectorAll(selectors);
            
            let elementIdx = 0;
            elements.forEach(el => {
                // Skip if inside/descendant of a code block (but allow pre itself)
                if (el.closest('code') || (el.tagName !== 'PRE' && el.closest('pre'))) {
                    return;
                }

                // Skip nested elements inside other commentable elements (e.g. p inside .callout, p inside tr)
                let isNested = false;
                let parent = el.parentElement;
                while (parent && parent !== container) {
                    if (parent.matches(selectors)) {
                        isNested = true;
                        break;
                    }
                    parent = parent.parentElement;
                }
                if (isNested) {
                    return;
                }

                const anchorId = `spec-element-${elementIdx++}`;
                el.setAttribute('data-anchor', anchorId);
                el.classList.add('commentable-element');

                // Click anywhere on the element to target it for a comment.
                // A drag that selects text must stay a selection, so bail when
                // a non-collapsed selection exists; also let interactive
                // children (links, the view-indicator) keep their own behaviour.
                el.addEventListener('mouseup', (e) => {
                    if (e.target.closest('a, .comment-indicator')) return;
                    if (!window.getSelection().isCollapsed) return;
                    // Mode A: a commented element selects its comment (shows the line);
                    // an uncommented element targets a new comment (line to the input box).
                    if (isCommented(anchorId)) {
                        selectComment(anchorId);
                    } else {
                        setCommentTarget(anchorId, visibleText(el).trim());
                    }
                });
                // Hover a commented element to preview its connector line.
                el.addEventListener('mouseenter', () => { if (isCommented(anchorId)) hoverConnector(anchorId); });
                el.addEventListener('mouseleave', () => { if (isCommented(anchorId)) unhoverConnector(); });
            });
        }

        // ---------- Diff mode: line-range comment targets ----------
        // A diff comment targets a range of lines, not a block, so its anchor is
        // "<path>#<start>-<end>" where the numbers are 1-based positions among the file's
        // rendered diff lines. The anchor is built when the range is selected; the DOM
        // attribute that carries it is (re)applied by applyDiffAnchors.
        const isDiffMode = !!document.querySelector(".document-column.diff-mode");

        function diffLineElements() { return Array.from(document.querySelectorAll(".diff-line")); }
        function lineIndexOf(el) { return parseInt(el.getAttribute("data-line-index"), 10); }
        function formatDiffAnchor(path, start, end) { return `${path}#${start}-${end}`; }
        function formatDiffFileAnchor(path) { return `${path}#file`; }

        // Mirrors ParseDiffFileAnchor in Go: the whole-file form, split on the last '#'.
        function parseDiffFileAnchor(anchor) {
            if (!anchor) return null;
            const i = anchor.lastIndexOf("#");
            if (i < 0 || anchor.slice(i + 1) !== "file") return null;
            return { path: anchor.slice(0, i) };
        }

        function fileHeaderFor(path) {
            return Array.from(document.querySelectorAll(".diff-file-header"))
                .find(el => el.getAttribute("data-file") === path) || null;
        }

        // Mirrors ParseDiffAnchor in Go, including the split on the LAST '#': a path may
        // contain one, and the anchor always ends in "#<digits>-<digits>".
        function parseDiffAnchor(anchor) {
            if (!anchor) return null;
            const i = anchor.lastIndexOf("#");
            if (i < 0) return null;
            const m = /^(\d+)-(\d+)$/.exec(anchor.slice(i + 1));
            if (!m) return null;
            const start = parseInt(m[1], 10), end = parseInt(m[2], 10);
            if (start < 1 || end < start) return null;
            return { path: anchor.slice(0, i), start, end };
        }

        // Matching on the elements rather than through an attribute selector: a file path can
        // contain quotes and backslashes, which would need escaping to survive a selector.
        function linesInRange(path, start, end) {
            return diffLineElements().filter(el => {
                const idx = lineIndexOf(el);
                return el.getAttribute("data-file") === path && idx >= start && idx <= end;
            });
        }

        function lineCode(el) {
            const code = el.querySelector(".diff-code");
            return code ? code.textContent : "";
        }

        // data-anchor goes on the FIRST line of a range only; the rest are marked with
        // data-anchor-member. Every anchor-driven function on this page resolves an anchor with
        // querySelector('[data-anchor="…"]'), which expects exactly one element — with the
        // attribute on every line of the range they would each silently do nothing.
        function applyDiffAnchors() {
            if (!isDiffMode) return;
            document.querySelectorAll(".diff-line[data-anchor], .diff-line[data-anchor-member], .diff-file-header[data-anchor]").forEach(el => {
                el.removeAttribute("data-anchor");
                el.removeAttribute("data-anchor-member");
                el.classList.remove("anchored-range");
            });

            const anchors = [];
            // Outdated comments keep their anchor but are not shown in the diff body (TASK-5);
            // until then every anchored comment paints.
            comments.forEach(c => { if (c.anchor && !c.outdated && !anchors.includes(c.anchor)) anchors.push(c.anchor); });
            if (activeAnchor && !anchors.includes(activeAnchor)) anchors.push(activeAnchor);

            anchors.forEach(anchor => {
                const whole = parseDiffFileAnchor(anchor);
                if (whole) {
                    const header = fileHeaderFor(whole.path);
                    if (header) {
                        header.setAttribute("data-anchor", anchor);
                        header.classList.add("anchored-range");
                    }
                    return;
                }

                const parsed = parseDiffAnchor(anchor);
                if (!parsed) return;
                linesInRange(parsed.path, parsed.start, parsed.end).forEach((el, i) => {
                    if (i === 0) {
                        el.setAttribute("data-anchor", anchor);
                    } else {
                        el.setAttribute("data-anchor-member", anchor);
                    }
                    el.classList.add("anchored-range");
                });
            });
        }

        function clearRangeSelection() {
            document.querySelectorAll(".diff-line.range-selected").forEach(el => el.classList.remove("range-selected"));
        }

        // Target a line range for the next comment. Selections never cross a hunk: the
        // coordinate system could express it, but lines on either side of a hunk boundary are
        // hundreds of lines apart in the real file, and storing them as if they were adjacent
        // would make them impossible to find again.
        function setDiffCommentTarget(fromEl, toEl) {
            if (fromEl.parentElement !== toEl.parentElement) return;

            const path = fromEl.getAttribute("data-file");
            const a = lineIndexOf(fromEl), b = lineIndexOf(toEl);
            const start = Math.min(a, b), end = Math.max(a, b);
            const els = linesInRange(path, start, end);
            if (!els.length) return;

            document.querySelectorAll(".active-comment-target").forEach(el => el.classList.remove("active-comment-target"));
            clearRangeSelection();
            els.forEach(el => el.classList.add("range-selected"));

            activeAnchor = formatDiffAnchor(path, start, end);
            activeAnchorLines = els.map(lineCode);
            activeContext = diffContextPreview(path, start, end, activeAnchorLines[0] || "");

            applyDiffAnchors();
            els.forEach(el => el.classList.add("active-comment-target"));

            document.getElementById("commentContextText").textContent = activeContext;
            document.getElementById("commentContextContainer").style.display = "block";
            document.getElementById("suggestionActions").style.display = "block";

            clearConnectorMarks();
            connector = { kind: "compose", anchor: activeAnchor };
            hoverAnchor = null;
            drawConnector(connector, true);
        }

        // Target a whole file. There is no line content to carry, so no anchorLines and no
        // suggestion: a suggestion replaces specific lines, and this comment names none.
        function setDiffFileCommentTarget(header) {
            const path = header.getAttribute("data-file");
            if (!path) return;

            document.querySelectorAll(".active-comment-target").forEach(el => el.classList.remove("active-comment-target"));
            clearRangeSelection();

            activeAnchor = formatDiffFileAnchor(path);
            activeAnchorLines = [];
            activeContext = path.length > 60 ? path.substring(0, 57) + "..." : path;

            applyDiffAnchors();
            header.classList.add("active-comment-target");

            document.getElementById("commentContextText").textContent = activeContext;
            document.getElementById("commentContextContainer").style.display = "block";
            document.getElementById("suggestionActions").style.display = "none";

            clearConnectorMarks();
            connector = { kind: "compose", anchor: activeAnchor };
            hoverAnchor = null;
            drawConnector(connector, true);
        }

        function diffContextPreview(path, start, end, firstLine) {
            const where = start === end ? `${path}:${start}` : `${path}:${start}-${end}`;
            const code = firstLine.trim().replace(/\s+/g, " ");
            const text = code ? `${where} — ${code}` : where;
            return text.length > 60 ? text.substring(0, 57) + "..." : text;
        }

        // ---------- Syntax highlighting ----------
        // Prism is already on the page for Markdown code blocks, so the diff borrows it. The
        // grammar is chosen per FILE, from the path in data-file — a diff has no other signal,
        // and one page routinely mixes Go, Markdown and YAML.
        const DIFF_LANGUAGE_BY_EXTENSION = {
            go: "go", js: "javascript", mjs: "javascript", cjs: "javascript", jsx: "jsx",
            ts: "typescript", tsx: "tsx", py: "python", rb: "ruby", rs: "rust", java: "java",
            kt: "kotlin", swift: "swift", scala: "scala", c: "c", h: "c", cc: "cpp", cpp: "cpp",
            hpp: "cpp", cs: "csharp", php: "php", pl: "perl", lua: "lua", sh: "bash",
            bash: "bash", zsh: "bash", fish: "bash", sql: "sql", css: "css", scss: "scss",
            html: "markup", xml: "markup", svg: "markup", vue: "markup", json: "json",
            yaml: "yaml", yml: "yaml", toml: "toml", ini: "ini", md: "markdown",
            markdown: "markdown", tf: "hcl", hcl: "hcl", graphql: "graphql", proto: "protobuf",
            dockerfile: "docker", mk: "makefile",
        };
        const DIFF_LANGUAGE_BY_NAME = {
            Dockerfile: "docker", Makefile: "makefile", Gemfile: "ruby", Rakefile: "ruby",
            ".gitignore": "git", ".gitattributes": "git",
        };

        function languageForPath(path) {
            if (!path) return null;
            const name = path.split("/").pop();
            if (DIFF_LANGUAGE_BY_NAME[name]) return DIFF_LANGUAGE_BY_NAME[name];
            const dot = name.lastIndexOf(".");
            if (dot < 0) return null;
            return DIFF_LANGUAGE_BY_EXTENSION[name.slice(dot + 1).toLowerCase()] || null;
        }

        // Highlighting is done line by line as lines come into view. A diff is a list of
        // fragments, not a document, so there is no whole-file parse to share anyway — and
        // deferring it keeps a thousand-line diff from paying for all of it up front.
        function highlightDiffLine(line) {
            const code = line.querySelector(".diff-code");
            if (!code || !code.textContent || line.classList.contains("diff-meta")) return;
            const language = languageForPath(line.getAttribute("data-file"));
            if (!language || !window.Prism) return;
            code.classList.add("language-" + language);
            Prism.highlightElement(code);
        }

        function initializeDiffHighlighting() {
            // Prism's <script> tags are deferred, so they have not run while this inline script
            // does. DOMContentLoaded fires after them.
            window.addEventListener("DOMContentLoaded", () => {
                if (!window.Prism) return;
                const lines = document.querySelectorAll(".diff-line");
                if (!("IntersectionObserver" in window)) {
                    lines.forEach(highlightDiffLine);
                    return;
                }
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        observer.unobserve(entry.target);
                        highlightDiffLine(entry.target);
                    });
                }, { rootMargin: "300px 0px" });
                lines.forEach(line => observer.observe(line));
            });
        }

        function initializeDiffLines() {
            const container = document.querySelector(".document-column");
            if (!container) return;

            let dragFrom = null;    // where the current drag started
            let dragging = false;
            let pendingFocus = false;

            container.addEventListener("mousedown", (e) => {
                // The comment indicator runs selectComment from its own click handler. Letting this one
                // run too selects the comment on mousedown and then toggles it straight back off
                // on click, so the connector line appears and vanishes within the same gesture.
                if (e.target.closest(".comment-indicator, a")) return;

                const header = e.target.closest(".diff-file-header");
                if (header) {
                    const existing = header.getAttribute("data-anchor");
                    if (existing && isCommented(existing)) {
                        selectComment(existing);
                    } else {
                        setDiffFileCommentTarget(header);
                        pendingFocus = true;
                    }
                    return;
                }

                const line = e.target.closest(".diff-line");
                if (!line) return;

                // A line that already carries a comment shows it instead of starting a new
                // selection — the same "commented targets select, uncommented targets compose"
                // rule the Markdown page follows.
                const existing = line.getAttribute("data-anchor") || line.getAttribute("data-anchor-member");
                if (existing && !e.shiftKey && isCommented(existing)) {
                    selectComment(existing);
                    return;
                }

                if (e.shiftKey && dragFrom && dragFrom.parentElement === line.parentElement) {
                    setDiffCommentTarget(dragFrom, line);
                    pendingFocus = true;
                    return;
                }
                dragFrom = line;
                dragging = true;
                pendingFocus = true;
                setDiffCommentTarget(line, line);
            });

            container.addEventListener("mouseover", (e) => {
                if (!dragging || !dragFrom) return;
                const line = e.target.closest(".diff-line");
                // A drag that wanders out of the hunk keeps the last valid range rather than
                // extending across the boundary.
                if (!line || line.parentElement !== dragFrom.parentElement) return;
                setDiffCommentTarget(dragFrom, line);
            });

            // Focus lands on mouseup, not on mousedown: the browser's own default handling of
            // mousedown moves focus after our handler runs, so focusing there is undone before
            // the user can type. preventScroll keeps the panel from jumping the page while the
            // eye is still on the line that was just picked.
            window.addEventListener("mouseup", () => {
                if (pendingFocus && activeAnchor) {
                    document.getElementById("composerInput").focus({ preventScroll: true });
                }
                dragging = false;
                pendingFocus = false;
            });
        }

        // Quote the selected lines into the comment box as a ```suggestion fence. Only ever on
        // click: a fence inserted automatically would be in the way of every comment that is
        // just a question, and would train the agent to expect a patch that is not there.
        function quoteLines() {
            if (!activeAnchorLines.length) return;
            const input = document.getElementById("composerInput");
            const fence = "```suggestion\n" + activeAnchorLines.join("\n") + "\n```\n";
            const at = input.selectionStart != null ? input.selectionStart : input.value.length;
            const before = input.value.slice(0, at);
            const after = input.value.slice(at);
            const prefix = before && !before.endsWith("\n") ? "\n" : "";
            input.value = before + prefix + fence + after;
            const caret = (before + prefix + fence).length;
            autoGrowTextarea(input);
            input.focus();
            input.setSelectionRange(caret, caret);
            markDirty();
        }

        // Set active target for next comment
        function setCommentTarget(anchorId, text) {
            // Remove previous active state
            document.querySelectorAll('.active-comment-target').forEach(el => {
                el.classList.remove('active-comment-target');
            });

            activeAnchor = anchorId;
            // Shorten context snippet and collapse consecutive whitespaces/newlines to a single space
            activeContext = text.trim().replace(/\s+/g, ' ');
            if (activeContext.length > 60) {
                activeContext = activeContext.substring(0, 57) + '...';
            }

            const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
            if (targetEl) {
                targetEl.classList.add('active-comment-target');
            }

            const contextText = document.getElementById("commentContextText");
            contextText.textContent = activeContext;
            document.getElementById("commentContextContainer").style.display = "block";
            document.getElementById("composerInput").focus();

            // Draw a connector from the targeted element to the comment input box.
            clearConnectorMarks();
            connector = { kind: "compose", anchor: anchorId };
            hoverAnchor = null;
            drawConnector(connector, true);
        }

        // Clear active target
        function clearCommentTarget() {
            document.querySelectorAll('.active-comment-target').forEach(el => {
                el.classList.remove('active-comment-target');
            });
            activeAnchor = "";
            activeContext = "";
            activeAnchorLines = [];
            clearRangeSelection();
            applyDiffAnchors();
            const suggestionActions = document.getElementById("suggestionActions");
            if (suggestionActions) suggestionActions.style.display = "none";
            document.getElementById("commentContextContainer").style.display = "none";

            if (connector && connector.kind === "compose") {
                connector = null;
                clearConnectorSvg();
            }
        }

        document.getElementById("clearContextBtn").addEventListener("click", clearCommentTarget);
        document.getElementById("quoteLinesBtn").addEventListener("click", quoteLines);

        // Fetch existing comments on load. The server returns {comments, summary}.
        function loadExistingComments() {
            if (!isServed) return;

            fetch("/api/feedback")
                .then(res => res.json())
                .then(data => {
                    comments = (data && data.comments) || [];
                    summary = (data && data.summary) || "";
                    renderSummary();
                    renderComments();
                    updateCommentIndicators();
                })
                .catch(err => console.error("Error loading feedback comments:", err));
        }

        // Render the agent's page-level change summary above the comment box.
        function renderSummary() {
            const box = document.getElementById("changeSummary");
            const body = document.getElementById("changeSummaryBody");
            if (!box || !body) return;
            if (summary && summary.trim()) {
                body.replaceChildren(proseBlock(summary.trim()));
                box.style.display = "block";
            } else {
                box.style.display = "none";
            }
        }

        // Agent activity: live progress shown on the page while the agent works (no full reload).
        function renderAgentStatus(msg) {
            const box = document.getElementById("agentActivity");
            const list = document.getElementById("agentActivityList");
            const stateEl = document.getElementById("agentActivityState");
            if (!box || !list) return;
            if (msg && msg.state === "working") {
                box.style.display = "block";
                box.classList.add("working");
                if (stateEl) stateEl.textContent = "Agent working…";
                appendActivity(list, msg.message);
            } else {
                box.classList.remove("working");
                box.style.display = "none";
                list.innerHTML = "";
            }
        }

        function appendActivity(list, text) {
            if (!text || !text.trim()) return;
            const last = list.lastElementChild;
            if (last && last.textContent === text.trim()) return; // collapse duplicate consecutive updates
            const li = document.createElement("li");
            li.textContent = text.trim();
            list.appendChild(li);
        }

        // Restore agent status on (re)load — a mid-round reload must not lose the "working" indicator.
        function loadAgentStatus() {
            if (!isServed) return;
            fetch("/api/status")
                .then(res => res.json())
                .then(s => { if (s && s.state === "working") renderAgentStatus({ kind: "status", state: "working", message: s.message }); })
                .catch(() => {});
        }

        // The open-thread glyph, drawn rather than typed. A speech balloon exists as a
        // codepoint, but every one of them carries a colour glyph, and a hue that is not the
        // accent is the one thing the palette does not allow (UI_DESIGN §2.1). Stroked in
        // currentColor, it takes the chip's colour in either state and in either theme.
        const OPEN_GLYPH_SVG = '<svg viewBox="0 0 12 12" width="9.5" height="9.5">'
            + '<path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"'
            + ' d="M2.4 1.3h7.2a1.4 1.4 0 0 1 1.4 1.4v3.6a1.4 1.4 0 0 1-1.4 1.4H5.4L3.1 9.9V7.7h-.7A1.4 1.4 0 0 1 1 6.3V2.7a1.4 1.4 0 0 1 1.4-1.4Z"/>'
            + '</svg>';

        // An indicator is appended INSIDE its target element, so it lands in that element's
        // textContent. Anything reading an element for its own words — a heading for the rail,
        // a block for the composer's context line — has to read around it.
        function visibleText(el) {
            const clone = el.cloneNode(true);
            clone.querySelectorAll('.comment-indicator').forEach(n => n.remove());
            return clone.textContent;
        }

        // Render inline indicators next to commented elements
        function updateCommentIndicators() {
            // Clear existing indicators
            document.querySelectorAll('.comment-indicator').forEach(el => el.remove());
            document.querySelectorAll('.has-comments-highlight').forEach(el => el.classList.remove('has-comments-highlight'));

            // In diff mode the anchors are attributes this page puts on the lines, so they have
            // to be (re)applied before anything resolves one.
            applyDiffAnchors();

            const countsByAnchor = {};
            const openByAnchor = {};
            comments.forEach(c => {
                // An outdated comment keeps its anchor (so it can come back if its lines do),
                // but it has nothing to point at in the current diff.
                if (c.anchor && !c.outdated) {
                    countsByAnchor[c.anchor] = (countsByAnchor[c.anchor] || 0) + 1;
                    if (c.status !== "resolved") {
                        openByAnchor[c.anchor] = (openByAnchor[c.anchor] || 0) + 1;
                    }
                }
            });

            Object.entries(countsByAnchor).forEach(([anchorId, count]) => {
                const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
                if (targetEl) {
                    targetEl.classList.add('has-comments-highlight');

                    // One open thread is enough to keep the block speaking: the mark turns only
                    // when there is nothing left here to answer.
                    const allResolved = !openByAnchor[anchorId];
                    const indicator = document.createElement('span');
                    indicator.className = allResolved ? 'comment-indicator resolved' : 'comment-indicator';
                    const glyph = document.createElement('span');
                    glyph.className = 'ci-glyph';
                    glyph.setAttribute('aria-hidden', 'true');
                    if (allResolved) {
                        glyph.textContent = '\u2713';
                    } else {
                        glyph.innerHTML = OPEN_GLYPH_SVG;
                    }
                    indicator.appendChild(glyph);
                    indicator.appendChild(document.createTextNode(String(count)));
                    indicator.title = allResolved
                        ? `Click to view ${count} comment(s), all resolved`
                        : `Click to view ${count} comment(s)`;
                    indicator.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectComment(anchorId);
                    });

                    // A tr may only contain cells, so the badge hangs off the
                    // last cell. Why not the row itself: the browser would wrap
                    // it in an anonymous cell and the row would gain a column.
                    const badgeHost = targetEl.tagName === 'TR'
                        ? (targetEl.lastElementChild || targetEl)
                        : targetEl;
                    badgeHost.appendChild(indicator);
                }
            });
            reconcileConnector();
        }

        function flashCard(card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.style.outline = "2px solid var(--accent-color)";
            setTimeout(() => {
                card.style.outline = "none";
            }, 2000);
        }

        // Scroll the feedback panel to the first comment card matching the anchor
        function scrollToCommentCard(anchorId) {
            const commentItems = Array.from(document.querySelectorAll('.comment-card'));
            const match = commentItems.find(item => item.getAttribute('data-anchor') === anchorId);
            if (match) flashCard(match);
        }

        // Resolving moves a card to the end of the panel and un-resolving carries it back, either
        // way usually out of sight. The card is found by its index rather than its anchor because
        // a thread about the document as a whole has no anchor to be found by.
        function revealCommentCard(idx) {
            const card = document.querySelector(`.comment-card[data-comment-idx="${idx}"]`);
            if (card) flashCard(card);
        }

        // Scroll spec body to target element
        function scrollToSpecElement(anchorId) {
            const targetEl = document.querySelector(`[data-anchor="${anchorId}"]`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetEl.classList.add('active-comment-target');
                setTimeout(() => {
                    targetEl.classList.remove('active-comment-target');
                }, 2000);
            }
        }

        // ---------- Connector line: comment ⇄ target element ----------
        // A single SVG overlay draws one line at a time. State:
        //   connector: null | { kind: "selected" | "compose", anchor }
        //   hoverAnchor: anchor previewed on hover (only when nothing is selected)
        const connectorSvg = document.getElementById("connectorOverlay");
        const SVG_NS = "http://www.w3.org/2000/svg";
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let connector = null;
        let hoverAnchor = null;

        function anchorElement(anchor) { return document.querySelector(`.document-column [data-anchor="${anchor}"]`); }

        // Every element the anchor covers. Only the first line of a diff range carries
        // data-anchor (so the querySelector-based lookups above resolve to one element), but the
        // whole range is what the comment is about, so the whole range is what lights up.
        // Filtered in JS rather than by attribute selector: a path may contain quotes.
        function anchorElements(anchor) {
            const first = anchorElement(anchor);
            if (!first) return [];
            const members = Array.from(document.querySelectorAll(".document-column [data-anchor-member]"))
                .filter(el => el.getAttribute("data-anchor-member") === anchor);
            return [first].concat(members);
        }
        function commentCard(anchor) { return document.querySelector(`.comment-card[data-anchor="${anchor}"]`); }
        function isCommented(anchor) { return !!anchor && comments.some(c => c.anchor === anchor); }

        // Clamp a y coordinate to the viewport so an endpoint whose element has
        // scrolled off-screen still terminates at the screen edge, keeping the
        // line visible and pointing toward the (off-screen) element.
        const CONNECTOR_MARGIN = 8;
        function clampY(y) { return Math.max(CONNECTOR_MARGIN, Math.min(window.innerHeight - CONNECTOR_MARGIN, y)); }

        // Element side of the line starts at the RIGHT EDGE of the comment indicator when
        // present; uncommented elements have no badge, so use the element's edge.
        // Horizontal position is unaffected by vertical scroll; y is clamped.
        function connectorStart(el) {
            const badge = el.querySelector(".comment-indicator");
            const r = (badge || el).getBoundingClientRect();
            const rawY = r.top + r.height / 2;
            const y = clampY(rawY);
            return { x: r.right + 4, y, offscreen: y !== rawY };
        }
        function connectorEnd(rect) {
            const rawY = rect.top + rect.height / 2;
            const y = clampY(rawY);
            return { x: rect.left - 6, y, offscreen: y !== rawY };
        }

        function clearConnectorSvg() { if (connectorSvg) connectorSvg.innerHTML = ""; }

        function paintConnector(start, end, kind, animate) {
            if (!connectorSvg) return;
            connectorSvg.innerHTML = "";
            const dx = Math.max(40, (end.x - start.x) * 0.5);
            const d = `M ${start.x} ${start.y} C ${start.x + dx} ${start.y}, ${end.x - dx} ${end.y}, ${end.x} ${end.y}`;
            const len = Math.hypot(end.x - start.x, end.y - start.y) + Math.abs(end.y - start.y);
            const base = kind === "persistent" ? 0.9 : 0.55;
            const path = document.createElementNS(SVG_NS, "path");
            path.setAttribute("d", d);
            path.classList.add(kind);

            // When an endpoint's element is off-screen (clamped to the edge),
            // fade the stroke to transparent toward that edge so the line looks
            // like it slips off the top/bottom rather than stopping abruptly.
            if (start.offscreen || end.offscreen) {
                const grad = document.createElementNS(SVG_NS, "linearGradient");
                grad.id = "connectorFade";
                grad.setAttribute("gradientUnits", "userSpaceOnUse");
                grad.setAttribute("x1", start.x); grad.setAttribute("y1", start.y);
                grad.setAttribute("x2", end.x);   grad.setAttribute("y2", end.y);
                [
                    { o: 0,    op: start.offscreen ? 0 : base },
                    { o: 0.22, op: base },
                    { o: 0.78, op: base },
                    { o: 1,    op: end.offscreen ? 0 : base },
                ].forEach(s => {
                    const st = document.createElementNS(SVG_NS, "stop");
                    st.setAttribute("offset", s.o);
                    st.setAttribute("stop-opacity", s.op);
                    grad.appendChild(st);
                });
                const defs = document.createElementNS(SVG_NS, "defs");
                defs.appendChild(grad);
                connectorSvg.appendChild(defs);
                path.style.stroke = "url(#connectorFade)";
                path.style.opacity = "1"; // gradient stop-opacity carries the fade
            }

            if (kind === "persistent" && animate && !prefersReducedMotion) {
                path.style.setProperty("--len", len.toFixed(0));
                path.classList.add("drawing");
            }
            connectorSvg.appendChild(path);

            // Endpoint dots — omit the dot at an off-screen (clamped) end.
            const dots = [];
            if (!start.offscreen) dots.push([start.x, start.y]);
            if (!end.offscreen) dots.push([end.x, end.y]);
            dots.forEach(([cx, cy]) => {
                const dot = document.createElementNS(SVG_NS, "circle");
                dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
                dot.setAttribute("r", kind === "persistent" ? 3 : 2.5);
                if (kind === "transient") dot.classList.add("transient");
                connectorSvg.appendChild(dot);
            });
        }

        function drawConnector(conn, animate) {
            const el = anchorElement(conn.anchor);
            if (!el) { clearConnectorSvg(); return; }
            let endRect;
            if (conn.kind === "selected") {
                const card = commentCard(conn.anchor);
                if (!card) { clearConnectorSvg(); return; }
                endRect = card.getBoundingClientRect();
            } else {
                const box = document.querySelector(".composer");
                if (!box) { clearConnectorSvg(); return; }
                endRect = box.getBoundingClientRect();
            }
            paintConnector(connectorStart(el), connectorEnd(endRect), "persistent", animate);
        }

        function refreshConnector() {
            if (connector) { drawConnector(connector, false); return; }
            if (hoverAnchor) {
                const el = anchorElement(hoverAnchor);
                const card = commentCard(hoverAnchor);
                if (el && card) {
                    paintConnector(connectorStart(el), connectorEnd(card.getBoundingClientRect()), "transient", false);
                } else {
                    clearConnectorSvg();
                }
                return;
            }
            clearConnectorSvg();
        }

        function clearConnectorMarks() {
            document.querySelectorAll(".comment-card.selected").forEach(n => n.classList.remove("selected"));
            // Not scoped to .commentable-element: a diff line is a target too, and leaving the
            // class on it would strand the highlight of a range that is no longer selected.
            document.querySelectorAll(".selected-target").forEach(n => n.classList.remove("selected-target"));
        }

        /* Whatever currently scrolls the document column. .document-column owns its scrollport in
           the three-column layout, but the narrow-viewport media query hands scrolling back to
           the page. Reading the computed overflow keeps the breakpoint in the stylesheet instead
           of restating it here, where the two could drift apart. */
        function documentScroller() {
            const main = document.querySelector(".document-column");
            return main && getComputedStyle(main).overflowY === "auto" ? main : window;
        }

        // window and Element share scrollBy/scrollTo, but not the read side.
        function scrollOffset(scroller) {
            return scroller === window ? window.scrollY : scroller.scrollTop;
        }

        // Scroll the document column so the target element's vertical centre lines up
        // with the comment card's centre, then draw the (animated) line.
        function alignAndDraw(el, card) {
            const er = el.getBoundingClientRect();
            const cr = card.getBoundingClientRect();
            const delta = (er.top + er.height / 2) - (cr.top + cr.height / 2);
            const finish = () => { if (connector) drawConnector(connector, true); };
            const scroller = documentScroller();
            if (Math.abs(delta) < 2 || prefersReducedMotion) {
                scroller.scrollBy(0, delta);
                finish();
            } else {
                scroller.scrollTo({ top: scrollOffset(scroller) + delta, behavior: "smooth" });
                setTimeout(finish, 320);
            }
        }

        function selectComment(anchor) {
            if (connector && connector.kind === "selected" && connector.anchor === anchor) {
                dropConnector();
                return;
            }
            clearCommentTarget();       // drop any compose state / line first
            clearConnectorMarks();
            connector = { kind: "selected", anchor };
            hoverAnchor = null;
            const card = commentCard(anchor);
            const els = anchorElements(anchor);
            if (card) card.classList.add("selected");
            if (els.length && card) {
                els.forEach(el => el.classList.add("selected-target"));
                alignAndDraw(els[0], card);
            }
        }

        function dropConnector() {
            connector = null;
            clearConnectorMarks();
            clearConnectorSvg();
        }

        function hoverConnector(anchor) { hoverAnchor = anchor; if (!connector) refreshConnector(); }
        function unhoverConnector() { hoverAnchor = null; if (!connector) clearConnectorSvg(); }

        // Re-apply the active connector after comment list / indicators re-render.
        // Drops the connector if its comment or element no longer exists.
        function reconcileConnector() {
            if (connector && connector.kind === "selected") {
                const card = commentCard(connector.anchor);
                const els = anchorElements(connector.anchor);
                if (!card || !els.length) { dropConnector(); return; }
                clearConnectorMarks();
                card.classList.add("selected");
                els.forEach(el => el.classList.add("selected-target"));
            }
            refreshConnector();
        }

        // Keep the line attached while scrolling / resizing.
        let connectorRaf = null;
        function scheduleConnectorRefresh() {
            if (connectorRaf) return;
            connectorRaf = requestAnimationFrame(() => { connectorRaf = null; refreshConnector(); });
        }
        window.addEventListener("scroll", scheduleConnectorRefresh, true);
        window.addEventListener("resize", scheduleConnectorRefresh);
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") { dropConnector(); clearCommentTarget(); } });
        // Click on empty space (not a comment / element / composer) deselects.
        // .diff-line belongs in this list for the same reason .commentable-element does: it is a
        // comment target, and without it selecting a diff comment is undone by the very click
        // that made it, connector line included.
        document.addEventListener("click", (e) => {
            if (e.target.closest(".comment-card, .commentable-element, .diff-line, .diff-file-header, .composer, #commentContextContainer")) return;
            if (connector && connector.kind === "selected") dropConnector();
        });

        document.getElementById("addCommentBtn").addEventListener("click", () => {
            const input = document.getElementById("composerInput");
            const text = input.value.trim();
            if (text) {
                const comment = {
                    text: text,
                    timestamp: new Date().toISOString(),
                    anchor: activeAnchor,
                    context: activeContext,
                    author: "human",
                    status: "open"
                };
                // Only a diff comment has line content to carry; omitempty keeps it out of the
                // sidecar for Markdown comments.
                if (activeAnchorLines.length) comment.anchorLines = activeAnchorLines.slice();
                comments.push(comment);
                input.value = "";
                autoGrowTextarea(input);
                markDirty();
                clearCommentTarget();
                renderComments();
                updateCommentIndicators();
            }
        });

        document.getElementById("composerInput").addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                document.getElementById("addCommentBtn").click();
            }
        });
        // Any text in the composer counts as an unsent change (guards auto-reload).
        document.getElementById("composerInput").addEventListener("input", (e) => {
            if (e.target.value.trim()) markDirty();
            autoGrowTextarea(e.target);
        });

        // Feedback panel display order follows the target block's appearance in the document, so the
        // panel can be read top-down alongside the spec. `comments` itself (and the feedback
        // file written from it) keeps creation order — only the rendering is reordered, and the
        // original array index travels with each entry so the idx-based handlers stay valid.
        const UNPLACED_RANK = Number.MAX_SAFE_INTEGER;
        const DOCUMENT_RANK = -1;
        function commentsInAppearanceOrder() {
            const order = new Map();
            document.querySelectorAll('.document-column [data-anchor]').forEach((el, i) => {
                order.set(el.getAttribute('data-anchor'), i);
            });
            // A comment with no target at all is about the document as a whole — it belongs above
            // everything, like the round summary. An anchor whose element is gone after an agent
            // edit, or a comment whose lines left the diff, still points somewhere: it sinks to
            // the end, where it always has.
            const rank = c => {
                if (!c.anchor) return DOCUMENT_RANK;
                return (!c.outdated && order.has(c.anchor)) ? order.get(c.anchor) : UNPLACED_RANK;
            };
            // A resolved thread is finished work: it sinks below every open one, keeping its own
            // document order among the rest of the resolved, so that the panel reads as the work
            // still outstanding followed by the work just closed.
            const resolvedRank = c => (c.status === "resolved" ? 1 : 0);
            // sort is stable, so comments sharing a rank (same block, or both unplaced) stay in creation order.
            return comments
                .map((c, idx) => ({ c, idx }))
                .sort((a, b) => (resolvedRank(a.c) - resolvedRank(b.c)) || (rank(a.c) - rank(b.c)));
        }

        // ---------- Comment body: prose plus ```suggestion blocks ----------
        // A suggestion is a replacement for the anchored lines, so it is shown the way a
        // replacement is read anywhere else: as a diff against those lines. Reading it as a bare
        // code block means holding the original in your head to see what actually changed.
        const suggestionFenceRegex = /```suggestion[ \t]*\r?\n([\s\S]*?)\r?\n?```/g;

        // The folded line carries the comment's own opening words and nothing else: what the
        // reader has to do with it is recognise the remark they closed, and they wrote it.
        //
        // The panel reads a comment as Markdown, so the line is taken from the rendered text
        // rather than the source — a folded thread should read the way its card reads, not show
        // the asterisks and backticks the reader typed. It stays one line of plain text: the row
        // truncates, and a heading or a list would have nowhere to go. Without markdown-it it
        // falls back to the source, and marks the fallback so the DOMContentLoaded redraw picks
        // this line up too.
        function headLine(text) {
            suggestionFenceRegex.lastIndex = 0;
            const source = (text || "").replace(suggestionFenceRegex, " ");
            const md = proseMarkdown();
            if (!md) {
                proseFellBack = true;
                return source.replace(/\s+/g, " ").trim();
            }
            const box = document.createElement("div");
            box.innerHTML = md.render(source);
            return (box.textContent || "").replace(/\s+/g, " ").trim();
        }

        // Built like the edit and delete affordances it sits beside, down to the keyboard path.
        function foldToggle(idx) {
            const btn = document.createElement("span");
            btn.className = "fold-toggle";
            btn.textContent = "\u25b4";
            btn.title = "Fold this resolved thread";
            btn.tabIndex = 0;
            const fold = () => {
                expandedResolved.delete(idx);
                renderComments();
            };
            btn.onclick = fold;
            btn.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    fold();
                }
            });
            return btn;
        }

        function resolvedSummary(c, idx) {
            const summaryBtn = document.createElement("button");
            summaryBtn.type = "button";
            summaryBtn.className = "resolved-summary";
            summaryBtn.title = "Open this resolved thread";

            const mark = document.createElement("span");
            mark.className = "resolved-summary-mark";
            mark.textContent = "\u2713";

            const text = document.createElement("span");
            text.className = "resolved-summary-text";
            text.textContent = headLine(c.text);

            const chevron = document.createElement("span");
            chevron.className = "resolved-summary-chevron";
            chevron.textContent = "\u25b8";

            summaryBtn.appendChild(mark);
            summaryBtn.appendChild(text);
            summaryBtn.appendChild(chevron);
            summaryBtn.addEventListener("click", () => {
                expandedResolved.add(idx);
                renderComments();
            });
            return summaryBtn;
        }

        function renderCommentBody(item, c) {
            const text = c.text || "";
            suggestionFenceRegex.lastIndex = 0;

            let cursor = 0;
            let match;
            while ((match = suggestionFenceRegex.exec(text)) !== null) {
                appendProse(item, text.slice(cursor, match.index));
                item.appendChild(suggestionDiff(c.anchorLines || [], match[1].split("\n")));
                cursor = match.index + match[0].length;
            }
            appendProse(item, text.slice(cursor));
        }

        function appendProse(item, text) {
            const trimmed = text.replace(/^\s*\n|\n\s*$/g, "");
            if (!trimmed.trim()) return;
            item.appendChild(proseBlock(trimmed));
        }

        // ---------- Panel Prose ----------
        // A comment, a reply and the change summary are all written in Markdown, so the panel
        // reads them as Markdown. markdown-it is a CDN script like Prism and Mermaid, and like
        // them it is only an enhancement: when it has not arrived the same text is drawn the
        // way it always was and every review interaction still works (UI_DESIGN.md 1).
        //
        // html:false leaves author-written HTML escaped instead of emitted and markdown-it
        // validates link schemes itself, so no separate sanitizer is needed for text the agent
        // wrote. breaks:true because a lone newline in a review comment is meant as a line
        // break, not as the paragraph continuation Markdown would otherwise make of it.
        let proseRenderer = null;
        let proseFellBack = false;
        function proseMarkdown() {
            if (!proseRenderer && window.markdownit) {
                proseRenderer = window.markdownit({ html: false, linkify: true, breaks: true });
            }
            return proseRenderer;
        }

        // Rendered Markdown may hold block children, so it needs a <div> to sit in; the
        // fallback stays the <p> the panel has always drawn, keeping its pre-wrap and so its
        // line breaks. Only the rendering differs — the comment's own text is never rewritten.
        function proseBlock(text) {
            const md = proseMarkdown();
            if (md) {
                const box = document.createElement("div");
                box.className = "prose";
                box.innerHTML = md.render(text);
                return box;
            }
            proseFellBack = true;
            const p = document.createElement("p");
            p.className = "prose-plain";
            p.style.marginBottom = "0";
            p.textContent = text;
            return p;
        }

        // markdown-it's <script> is deferred, so it has not run while this inline script does,
        // and a panel drawn before the fetch returns can have fallen back for no reason.
        // DOMContentLoaded fires after it: redraw then, and only if something did fall back.
        window.addEventListener("DOMContentLoaded", () => {
            if (!proseFellBack || !proseMarkdown()) return;
            proseFellBack = false;
            renderSummary();
            renderComments();
        });

        // Lines shared at either end stay as context, so a one-line edit inside a six-line quote
        // shows as a one-line change instead of six removals and six additions.
        function suggestionDiff(original, suggested) {
            const box = document.createElement("div");
            box.className = "suggestion-diff";

            const label = document.createElement("div");
            label.className = "suggestion-diff-label";
            label.textContent = original.length ? "Suggested change" : "Suggestion";
            box.appendChild(label);

            let head = 0;
            while (head < original.length && head < suggested.length && original[head] === suggested[head]) head++;
            let tail = 0;
            while (
                tail < original.length - head &&
                tail < suggested.length - head &&
                original[original.length - 1 - tail] === suggested[suggested.length - 1 - tail]
            ) tail++;

            const row = (kind, marker, content) => {
                const line = document.createElement("div");
                line.className = "suggestion-line suggestion-" + kind;
                const m = document.createElement("span");
                m.className = "suggestion-marker";
                m.textContent = marker;
                const code = document.createElement("span");
                code.className = "suggestion-code";
                code.textContent = content;
                line.appendChild(m);
                line.appendChild(code);
                box.appendChild(line);
            };

            original.slice(0, head).forEach(l => row("ctx", " ", l));
            original.slice(head, original.length - tail).forEach(l => row("del", "-", l));
            suggested.slice(head, suggested.length - tail).forEach(l => row("add", "+", l));
            if (tail) original.slice(original.length - tail).forEach(l => row("ctx", " ", l));

            return box;
        }

        // ---------- Placing a thread the agent opened ----------
        // The agent quotes a passage rather than naming an anchor, because spec-element-N exists
        // only in this page's DOM walk — reproducing that numbering in Go would be the very
        // duplication the anchor rules forbid. So the quote is resolved here, on every render.
        //
        // A diff is different: its anchors are derived from the diff file, so the server has
        // already resolved those quotes by the time the page sees them.
        function normalizeQuote(text) {
            return (text || "").replace(/\s+/g, " ").trim();
        }

        function resolveQuoteAnchors() {
            if (document.body.classList.contains("diff-review")) return;
            const targets = Array.from(document.querySelectorAll('.document-column [data-anchor]'));

            comments.forEach(c => {
                if (!c.anchorQuote) return;
                const want = normalizeQuote(c.anchorQuote);
                if (!want) return;
                // The first match only: exactly one element may carry the anchor, and the first
                // occurrence is a more useful guess than none. A quote that matches nothing keeps
                // its text and loses its target — it is never dropped.
                const hit = targets.find(el => normalizeQuote(el.textContent).includes(want));
                c.anchor = hit ? hit.getAttribute("data-anchor") : "";
                c.outdated = false;
            });
        }

        // ---------- Questions the agent is waiting on ----------
        // The same rule the server states in Go (Comment.PendingQuestion): a question stands
        // until a human message follows it. Any reply answers — which is why answering needs no
        // control of its own.
        function threadOf(c) {
            const head = {
                author: c.author || "human",
                text: c.text,
                timestamp: c.timestamp,
                needsAnswer: !!c.needsAnswer,
            };
            return [head].concat(c.messages || []);
        }

        function lastQuestionIndex(c) {
            const msgs = threadOf(c);
            for (let i = msgs.length - 1; i >= 0; i--) {
                if (msgs[i].needsAnswer) return i;
            }
            return -1;
        }

        function pendingQuestion(c) {
            const at = lastQuestionIndex(c);
            if (at < 0) return false;
            const msgs = threadOf(c);
            // A declined question has been settled — refused, but settled. Leaving it pending
            // would keep the count up on a thread the human has already closed.
            if (at === 0 ? c.declined : (c.messages[at - 1] || {}).declined) return false;
            return !msgs.slice(at + 1).some(m => m.author === "human");
        }

        // Closing a thread without answering is a decision, not an oversight, so it is recorded
        // on the question itself and reported to the agent rather than left to be inferred.
        function declinePendingQuestion(c) {
            const at = lastQuestionIndex(c);
            if (at < 0) return;
            if (at === 0) {
                c.declined = true;
            } else {
                c.messages[at - 1].declined = true;
            }
        }

        // The panel-level count. It is shown above the composer because a question you have not
        // noticed is the one thing on this page that blocks the agent.
        function renderPendingQuestions() {
            const box = document.getElementById("pendingQuestions");
            if (!box) return;
            const n = comments.filter(pendingQuestion).length;
            if (!n) {
                box.style.display = "none";
                return;
            }
            box.textContent = n === 1
                ? "1 question awaiting your answer"
                : n + " questions awaiting your answer";
            box.style.display = "block";
        }

        // ---------- A comment is a thread ----------
        // The head is the comment itself; messages are the turns after it. Both sides speak here,
        // so each turn is attributed and timestamped — otherwise a long thread stops being
        // readable as a conversation.
        function threadMessage(m, idx, mi) {
            const box = document.createElement("div");
            const own = (m.author !== "agent");
            box.className = "thread-message " + (own ? "from-human" : "from-agent");

            const meta = document.createElement("div");
            meta.className = "thread-message-meta";
            const who = document.createElement("span");
            who.textContent = own ? "You" : "Agent";
            meta.appendChild(who);
            const when = messageTime(m.timestamp);
            if (when) {
                const time = document.createElement("span");
                time.className = "thread-message-time";
                time.textContent = when.short;
                time.title = when.full;
                meta.appendChild(time);
            }
            // Only the human's own turns are editable, for the same reason the head comment is:
            // it is their remark to correct. The agent's messages are a record of what it said.
            if (own) {
                const editBtn = document.createElement("span");
                editBtn.className = "thread-message-edit";
                editBtn.innerHTML = "✎";
                editBtn.title = "Edit this reply";
                editBtn.tabIndex = 0;
                editBtn.onclick = (e) => { e.stopPropagation(); startEditMessage(idx, mi); };
                editBtn.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        startEditMessage(idx, mi);
                    }
                });
                meta.appendChild(editBtn);
            }
            box.appendChild(meta);

            if (own && editingMsg && editingMsg.idx === idx && editingMsg.mi === mi) {
                box.appendChild(messageEditor(idx, mi, m));
                return box;
            }

            box.appendChild(proseBlock(m.text || ""));
            return box;
        }

        // Editing one turn of a thread, with the same keys as the composer and inline editing:
        // Ctrl/Cmd+Enter saves, Escape cancels.
        function messageEditor(idx, mi, m) {
            const wrap = document.createElement("div");

            const textarea = document.createElement("textarea");
            textarea.className = "edit-textarea";
            textarea.value = m.text || "";
            textarea.addEventListener("input", (e) => autoGrowTextarea(e.target));
            textarea.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                    saveMessage(idx, mi, textarea.value.trim());
                } else if (e.key === "Escape") {
                    cancelEditMessage();
                }
            });

            const actions = document.createElement("div");
            actions.className = "edit-actions";
            const cancelBtn = document.createElement("button");
            cancelBtn.className = "btn-sm btn-cancel";
            cancelBtn.textContent = "Cancel";
            cancelBtn.onclick = () => cancelEditMessage();
            const saveBtn = document.createElement("button");
            saveBtn.className = "btn-sm btn-save";
            saveBtn.textContent = "Save";
            saveBtn.onclick = () => saveMessage(idx, mi, textarea.value.trim());
            actions.appendChild(cancelBtn);
            actions.appendChild(saveBtn);

            wrap.appendChild(textarea);
            wrap.appendChild(actions);
            setTimeout(() => { autoGrowTextarea(textarea); textarea.focus(); }, 0);
            return wrap;
        }

        // A timestamp is only worth showing if it parses: the sidecar is written by two programs
        // and read after arbitrary delays, so an unusable value is shown as nothing at all.
        function messageTime(ts) {
            if (!ts) return null;
            const d = new Date(ts);
            if (isNaN(d.getTime())) return null;
            return {
                short: d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                full: d.toLocaleString(),
            };
        }

        // The human's side of the thread. It posts nothing by itself: the reply is held with the
        // rest of the comments and travels on the next Submit, keeping review's batch rhythm.
        function appendReplyControl(item, idx) {
            if (replyingIdx !== idx) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "thread-reply-btn";
                btn.textContent = "Reply";
                btn.onclick = () => startReply(idx);
                item.appendChild(btn);
                return;
            }

            const box = document.createElement("div");
            box.className = "thread-reply";

            const textarea = document.createElement("textarea");
            textarea.className = "edit-textarea";
            textarea.placeholder = "Reply to this thread…";
            textarea.addEventListener("input", (e) => autoGrowTextarea(e.target));
            textarea.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                    sendReply(idx, textarea.value.trim());
                } else if (e.key === "Escape") {
                    cancelReply();
                }
            });

            const actions = document.createElement("div");
            actions.className = "edit-actions";
            const cancelBtn = document.createElement("button");
            cancelBtn.className = "btn-sm btn-cancel";
            cancelBtn.textContent = "Cancel";
            cancelBtn.onclick = () => cancelReply();
            const sendBtn = document.createElement("button");
            sendBtn.className = "btn-sm btn-save";
            sendBtn.textContent = "Reply";
            sendBtn.onclick = () => sendReply(idx, textarea.value.trim());
            actions.appendChild(cancelBtn);
            actions.appendChild(sendBtn);

            box.appendChild(textarea);
            box.appendChild(actions);
            item.appendChild(box);
            setTimeout(() => { autoGrowTextarea(textarea); textarea.focus(); }, 0);
        }

        function renderComments() {
            const container = document.getElementById("commentsList");
            container.innerHTML = "";
            resolveQuoteAnchors();

            const ordered = commentsInAppearanceOrder();
            // Threads with no target — a question about the document as a whole, or one whose
            // quoted passage is no longer there — are gathered under a heading of their own rather
            // than left looking like comments on whatever they happen to sit next to. The rest
            // keep the panel's usual document order, under a heading only when the first group
            // exists to be told apart from.
            const sectionLabel = (text) => {
                const heading = document.createElement("div");
                heading.className = "panel-section-label";
                heading.textContent = text;
                container.appendChild(heading);
            };
            const documentLevel = ordered.length > 0 && !ordered[0].c.anchor;
            const firstAnchored = ordered.findIndex(({ c }) => !!c.anchor);
            if (documentLevel) sectionLabel("About this document");

            ordered.forEach(({ c, idx }, pos) => {
                if (documentLevel && pos === firstAnchored) sectionLabel("On the text");
                const item = document.createElement("div");
                item.className = "comment-card";
                // The panel renders in the document's order, not the array's, so the card carries
                // its index back — that is what lets the pending-question count reach its thread.
                item.setAttribute('data-comment-idx', idx);
                if (c.anchor) {
                    item.setAttribute('data-anchor', c.anchor);
                }

                // A resolved thread folds to one line. Opening it is all the click does: the
                // thread is finished work, so there is nothing left to point at and no Connector
                // Line to draw — the one exception to the panel's click-a-card-to-select rule.
                if (c.status === "resolved" && idx !== editingIdx && !expandedResolved.has(idx)) {
                    item.classList.add("resolved", "folded");
                    // A folded card takes no hover, so a hover line left pointing at it could
                    // never be dismissed by moving away from it. Folding ends the hover.
                    if (hoverAnchor && hoverAnchor === c.anchor) unhoverConnector();
                    item.appendChild(resolvedSummary(c, idx));
                    container.appendChild(item);
                    return;
                }

                if (idx === editingIdx) {
                    item.classList.add("editing-mode");

                    // Textarea for editing
                    const textarea = document.createElement("textarea");
                    textarea.className = "edit-textarea";
                    textarea.value = c.text;
                    textarea.addEventListener("input", (e) => autoGrowTextarea(e.target));
                    textarea.addEventListener("keydown", (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                            saveComment(idx, textarea.value.trim());
                        } else if (e.key === "Escape") {
                            cancelEdit();
                        }
                    });

                    // Buttons
                    const btnGroup = document.createElement("div");
                    btnGroup.className = "edit-actions";

                    const saveBtn = document.createElement("button");
                    saveBtn.className = "btn-sm btn-save";
                    saveBtn.textContent = "Save";
                    saveBtn.onclick = () => saveComment(idx, textarea.value.trim());

                    const cancelBtn = document.createElement("button");
                    cancelBtn.className = "btn-sm btn-cancel";
                    cancelBtn.textContent = "Cancel";
                    cancelBtn.onclick = () => cancelEdit();

                    btnGroup.appendChild(cancelBtn);
                    btnGroup.appendChild(saveBtn);

                    item.appendChild(textarea);
                    item.appendChild(btnGroup);

                    container.appendChild(item);
                    // Auto-focus the textarea, sized to the comment it already holds.
                    setTimeout(() => { autoGrowTextarea(textarea); textarea.focus(); }, 0);
                } else {
                    const deleteBtn = document.createElement("span");
                    deleteBtn.className = "delete-btn";
                    deleteBtn.innerHTML = "&times;";
                    deleteBtn.title = "Delete comment";
                    deleteBtn.tabIndex = 0;
                    deleteBtn.onclick = () => deleteComment(idx);
                    deleteBtn.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            deleteComment(idx);
                        }
                    });

                    const editBtn = document.createElement("span");
                    editBtn.className = "edit-btn";
                    editBtn.innerHTML = "✎";
                    editBtn.title = "Edit comment";
                    editBtn.tabIndex = 0;
                    editBtn.onclick = () => startEdit(idx);
                    editBtn.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            startEdit(idx);
                        }
                    });

                    const agentOpened = (c.author === "agent");
                    const authorTag = document.createElement("div");
                    authorTag.className = "comment-author";
                    authorTag.textContent = agentOpened ? "Agent" : "You";

                    // A quote that no longer matches anything: the thread stays, and says why it
                    // is not pointing at the text any more.
                    if (c.anchorQuote && !c.anchor) {
                        const lost = document.createElement("div");
                        lost.className = "outdated-tag";
                        lost.textContent = "Quoted passage not found";
                        lost.title = c.anchorQuote;
                        item.appendChild(lost);
                    }

                    if (pendingQuestion(c)) {
                        item.classList.add("awaiting-answer");
                        const asking = document.createElement("div");
                        asking.className = "awaiting-tag";
                        asking.textContent = "Awaiting your answer";
                        item.appendChild(asking);
                    }

                    // A comment whose lines are no longer in the diff stays in the panel, with
                    // the lines it was written against — that text is the only way left to tell
                    // what it was about.
                    if (c.outdated) {
                        item.classList.add("outdated");
                        const tag = document.createElement("div");
                        tag.className = "outdated-tag";
                        tag.textContent = "Outdated";
                        if (c.context) tag.title = c.context;
                        item.appendChild(tag);
                    }

                    // Editing and deleting are for the human's own remark. A thread the agent
                    // opened is not the human's text to rewrite, and deleting it would be the
                    // silent close the whole question mechanism exists to prevent — resolving it
                    // is the way to close it, and that path records declined.
                    if (!agentOpened) {
                        item.appendChild(deleteBtn);
                        item.appendChild(editBtn);
                    } else {
                        item.classList.add("agent-thread");
                    }
                    if (c.status === "resolved") {
                        item.appendChild(foldToggle(idx));
                    }
                    item.appendChild(authorTag);
                    renderCommentBody(item, c);

                    if (c.outdated) {
                        if (c.context) {
                            const where = document.createElement("div");
                            where.className = "outdated-context";
                            where.textContent = c.context;
                            item.appendChild(where);
                        }
                        if (c.anchorLines && c.anchorLines.length) {
                            const lines = document.createElement("pre");
                            lines.className = "outdated-lines";
                            lines.textContent = c.anchorLines.join("\n");
                            item.appendChild(lines);
                        }
                    }

                    // The rest of the thread, in the order it was said. The head is the comment
                    // itself, already rendered above.
                    const messages = c.messages || [];
                    messages.forEach((m, mi) => item.appendChild(threadMessage(m, idx, mi)));

                    // Every thread can be written into, whoever spoke last — a thread is not an
                    // alternation of turns. Withholding the control until someone answered made a
                    // remark of the human's own the one thing they could not add to, while the
                    // agent has always been free to append twice through review_reply.
                    appendReplyControl(item, idx);

                    // Resolving is withheld until the thread has an answer: an unanswered remark of
                    // the human's own is closed by deleting it, so a resolve there would say the
                    // same thing twice. A thread the agent opened is resolvable from the start —
                    // its head IS the question, so waiting for a message would strand it.
                    if (messages.length || agentOpened) {
                        // Resolve toggle — the human confirms the fix; the agent never self-resolves.
                        const toggleLabel = document.createElement("label");
                        toggleLabel.className = "resolve-toggle";
                        const checkbox = document.createElement("input");
                        checkbox.type = "checkbox";
                        checkbox.checked = (c.status === "resolved");
                        const toggleText = document.createElement("span");
                        toggleText.textContent = checkbox.checked ? "Resolved" : "Mark resolved";
                        checkbox.addEventListener("change", () => {
                            // Closing a thread that still holds a question is the one resolve the
                            // page questions: the agent is blocked on it, and silently resolving
                            // would look to the agent exactly like being ignored.
                            if (checkbox.checked && pendingQuestion(comments[idx])) {
                                const closeAnyway = confirm(
                                    "The agent is waiting for an answer in this thread.\n\n" +
                                    "OK — close it without answering. The agent is told the question was declined.\n" +
                                    "Cancel — answer it first."
                                );
                                if (!closeAnyway) {
                                    checkbox.checked = false;
                                    startReply(idx);
                                    return;
                                }
                                declinePendingQuestion(comments[idx]);
                            }
                            comments[idx].status = checkbox.checked ? "resolved" : "open";
                            // Reopening a thread starts it folded again: the expansion was about
                            // this card as it stood, not about the thread from here on.
                            expandedResolved.delete(idx);
                            markDirty();
                            renderComments();
                            // Resolving changes what the block's Comment Indicator says, so it is
                            // recomputed here, the way every other change to the comment set does.
                            updateCommentIndicators();
                            // The card has just crossed to the other end of the panel. Say where.
                            revealCommentCard(idx);
                        });
                        toggleLabel.appendChild(checkbox);
                        toggleLabel.appendChild(toggleText);
                        item.appendChild(toggleLabel);
                    }

                    if (c.status === "resolved") {
                        item.classList.add("resolved");
                    }

                    // Click the card to select it (and draw its line); hover to preview.
                    // Ignore clicks on the card's own controls. An outdated comment has no
                    // target left in the body, so it is not selectable.
                    if (c.anchor && !c.outdated) {
                        item.addEventListener("click", (e) => {
                            if (e.target.closest(".delete-btn, .edit-btn, .fold-toggle, .resolve-toggle, input, button, textarea, a")) return;
                            selectComment(c.anchor);
                        });
                        item.addEventListener("mouseenter", () => { if (!connector) hoverConnector(c.anchor); });
                        item.addEventListener("mouseleave", () => { if (!connector) unhoverConnector(); });
                    }

                    container.appendChild(item);
                }
            });
            renderPendingQuestions();
            reconcileConnector();
        }

        // The count takes you to the first thread that is waiting, and opens its composer — the
        // answer is a reply like any other.
        document.getElementById("pendingQuestions").addEventListener("click", () => {
            const idx = comments.findIndex(pendingQuestion);
            if (idx < 0) return;
            startReply(idx);
            const card = document.querySelector(`.comment-card[data-comment-idx="${idx}"]`);
            if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });

        window.startEdit = function(idx) {
            editingIdx = idx;
            renderComments();
        };

        window.startEditMessage = function(idx, mi) {
            editingMsg = { idx, mi };
            renderComments();
        };

        window.cancelEditMessage = function() {
            editingMsg = null;
            renderComments();
        };
